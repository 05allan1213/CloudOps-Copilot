apiVersion: v1
kind: Service
metadata:
  name: cloudops-demo-workload
  namespace: cloudops-demo
  labels:
    app.kubernetes.io/name: cloudops-demo-workload
    app.kubernetes.io/instance: cloudops-demo
    app.kubernetes.io/component: normal-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudops-demo-workload
    app.kubernetes.io/instance: cloudops-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: demo-diagnostics
  namespace: cloudops-demo
  labels:
    app.kubernetes.io/name: cloudops-demo-workload
    app.kubernetes.io/instance: cloudops-demo
    app.kubernetes.io/component: diagnostics-service
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: cloudops-demo-workload
    app.kubernetes.io/instance: cloudops-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
