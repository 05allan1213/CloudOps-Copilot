name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - .github/workflows/**
      - .dockerignore
      - Dockerfile
      - Makefile
      - charts/**
      - cmd/**
      - frontend/**
      - go.mod
      - go.sum
      - internal/**
      - migrations/**
      - runbooks/**
      - scripts/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  GO_VERSION: '1.26.5'
  GOIMPORTS_VERSION: v0.43.0
  GOLANGCI_LINT_VERSION: v2.11.4
  GOVULNCHECK_VERSION: v1.6.0
  NODE_VERSION: '20'
  HELM_VERSION: v3.14.4
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.6.7@sha256:0925177fb05b44ce18574076141b5c3d83235e1904d3f952182ac99ddc45762c
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

jobs:
  go:
    name: Go contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install Go check tools
        run: |
          go install "golang.org/x/tools/cmd/goimports@${GOIMPORTS_VERSION}"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"

      - name: Check module, structure, formatting, and naming
        run: |
          make check-gofmt
          make check-goimports GOIMPORTS="$(go env GOPATH)/bin/goimports"
          make check-deps
          make check-structure
          make check-naming

      - name: Vet and lint
        run: |
          make vet
          make lint-go GOLANGCI_LINT="$(go env GOPATH)/bin/golangci-lint"

      - name: Test and build
        run: |
          make test-go
          make test-race
          make build-go

      - name: Scan reachable Go vulnerabilities
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  frontend:
    name: Frontend contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Audit dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Lint, typecheck, test, and build
        run: |
          npm run lint:no-new-warnings
          npm run typecheck
          npm run typecheck:e2e
          npm test
          npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Stable read-only E2E
        run: npm run test:e2e:stable

  runtime-contracts:
    name: Runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Check shell scripts
        run: |
          mapfile -d '' scripts < <(find scripts -type f -name '*.sh' -print0 | sort -z)
          ((${#scripts[@]} > 0))
          for script in "${scripts[@]}"; do
            bash -n "${script}"
          done
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            -w /repo \
            "${SHELLCHECK_IMAGE}" \
            "${scripts[@]}"

      - name: Check Helm render contracts
        run: |
          make helm-lint
          make helm-template
          make helm-contracts
          helm template cloudops charts/cloudops \
            --namespace cloudops-system \
            --values charts/cloudops/values-local.yaml | \
            docker run --rm -i "${KUBECONFORM_IMAGE}" \
              -strict -summary -ignore-missing-schemas

      - name: Check workflow contracts
        run: |
          python3 scripts/check-immutable-workflow-dependencies.py
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            -w /repo \
            "${ACTIONLINT_IMAGE}" \
            -no-color

  images:
    name: Image (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            target: cloudops-api
          - name: worker
            target: cloudops-worker
          - name: migrate
            target: cloudops-migrate
          - name: demo
            target: cloudops-demo
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.image.target }}
          push: false
          provenance: false
          sbom: false
          tags: cloudops-${{ matrix.image.name }}:ci
          build-args: |
            VCS_REF=${{ github.sha }}
            VCS_SOURCE=${{ github.server_url }}/${{ github.repository }}
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=ci-${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image.name }}

  required-ci:
    name: Required CI
    if: ${{ always() }}
    needs:
      - go
      - frontend
      - runtime-contracts
      - images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful CI jobs
        env:
          GO_RESULT: ${{ needs.go.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUNTIME_RESULT: ${{ needs.runtime-contracts.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
        run: |
          test "${GO_RESULT}" = success
          test "${FRONTEND_RESULT}" = success
          test "${RUNTIME_RESULT}" = success
          test "${IMAGES_RESULT}" = success
