name: CI

on:
  pull_request:
    paths:
      - .github/workflows/ci.yaml
      - server-monitor/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci.yaml
      - server-monitor/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  GOIMPORTS_VERSION: v0.43.0
  NODE_VERSION: '20'
  HELM_VERSION: v3.14.4
  PROMETHEUS_IMAGE: prom/prometheus:v2.51.0
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  go-checks:
    name: ${{ matrix.module }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module:
          - server-probe
          - server-web
          - alert-service
          - pkg
    defaults:
      run:
        working-directory: server-monitor/${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server-monitor/${{ matrix.module }}/go.mod
          cache-dependency-path: server-monitor/${{ matrix.module }}/go.sum

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@${GOIMPORTS_VERSION}

      - name: Check goimports
        run: |
          GOIMPORTS_BIN="$(go env GOPATH)/bin/goimports"
          test -z "$(${GOIMPORTS_BIN} -l .)"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: server-monitor/${{ matrix.module }}
          args: --timeout=5m
          version: latest

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: NLU evaluation
        if: matrix.module == 'server-web'
        run: |
          set -o pipefail
          go test ./internal/copilot/nlu/eval/ -run TestEvaluate -v -count=1 2>&1 | tee nlu-eval-report.txt

      - name: RAG evaluation
        if: matrix.module == 'server-web'
        run: |
          set -o pipefail
          go test ./internal/copilot/runbook/eval/ -run TestRAGEval -v -count=1 2>&1 | tee rag-eval-report.txt

      - name: NLU multi-intent evaluation
        if: matrix.module == 'server-web'
        run: |
          set -o pipefail
          go test ./internal/copilot/nlu/eval/ -run TestEvaluateMulti -v -count=1 2>&1 | tee nlu-multi-eval-report.txt

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server-monitor/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server-monitor/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Run ESLint
        run: npx eslint . --ext .ts,.vue

      - name: Build frontend
        run: npm run build

  compose:
    name: compose config checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server-monitor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose config
        run: |
          cleanup() {
            if [ -f .env.ci-backup ]; then
              mv .env.ci-backup .env
            else
              rm -f .env
            fi
          }
          trap cleanup EXIT
          if [ -f .env ]; then
            mv .env .env.ci-backup
          fi
          cp .env.example .env
          docker compose --env-file .env.example config >/tmp/server-monitor-compose.yaml

      - name: Check K8s setup script syntax
        run: bash -n docker/setup-k8s.sh

  prometheus:
    name: prometheus config checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Prometheus config
        run: |
          docker run --rm             --entrypoint promtool             -v "${{ github.workspace }}/server-monitor/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro"             -v "${{ github.workspace }}/server-monitor/docker/alerts.yml:/etc/prometheus/rules/alerts.yml:ro"             ${{ env.PROMETHEUS_IMAGE }}             check config /etc/prometheus/prometheus.yml

      - name: Check Prometheus rules
        run: |
          docker run --rm             --entrypoint promtool             -v "${{ github.workspace }}/server-monitor/docker/alerts.yml:/etc/prometheus/alerts.yml:ro"             ${{ env.PROMETHEUS_IMAGE }}             check rules /etc/prometheus/alerts.yml

      - name: Check custom alert rules
        run: |
          docker run --rm             --entrypoint promtool             -v "${{ github.workspace }}/server-monitor/docker/custom-alerts.yml:/etc/prometheus/rules/custom-alerts.yml:ro"             ${{ env.PROMETHEUS_IMAGE }}             check rules /etc/prometheus/rules/custom-alerts.yml

      - name: Check AI quality alert rules
        run: |
          docker run --rm             --entrypoint promtool             -v "${{ github.workspace }}/server-monitor/docker/copilot-ai-quality-rules.yml:/etc/prometheus/rules/copilot-ai-quality-rules.yml:ro"             ${{ env.PROMETHEUS_IMAGE }}             check rules /etc/prometheus/rules/copilot-ai-quality-rules.yml

  helm:
    name: helm chart checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint chart
        run: helm lint server-monitor/charts/server-monitor

  docker-build:
    name: docker build (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - go-checks
      - frontend
      - compose
      - prometheus
      - helm
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: server-probe
            file: ./server-monitor/server-probe/Dockerfile
            tag: server-probe:ci
          - name: server-web
            file: ./server-monitor/server-web/Dockerfile
            tag: server-web:ci
          - name: alert-service
            file: ./server-monitor/alert-service/Dockerfile
            tag: alert-service:ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./server-monitor
          file: ${{ matrix.image.file }}
          target: runtime
          push: false
          load: false
          provenance: false
          sbom: false
          tags: ${{ matrix.image.tag }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  push-images:
    name: push images (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - docker-build
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: server-probe
            file: ./server-monitor/server-probe/Dockerfile
          - name: server-web
            file: ./server-monitor/server-web/Dockerfile
          - name: alert-service
            file: ./server-monitor/alert-service/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./server-monitor
          file: ${{ matrix.image.file }}
          target: runtime
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image.name }}:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  deploy:
    name: deploy chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs:
      - push-images
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      DEPLOY_NAMESPACE: ${{ vars.DEPLOY_NAMESPACE }}
      DEPLOY_RELEASE_NAME: ${{ vars.DEPLOY_RELEASE_NAME }}
      DEPLOY_VALUES_FILE: ${{ vars.DEPLOY_VALUES_FILE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          if [ -z "${KUBE_CONFIG_DATA}" ]; then
            echo "KUBE_CONFIG_DATA secret is required when DEPLOY_ENABLED=true" >&2
            exit 1
          fi
          KUBECONFIG_PATH="${RUNNER_TEMP}/kubeconfig"
          printf '%s' "${KUBE_CONFIG_DATA}" | base64 -d > "${KUBECONFIG_PATH}"
          chmod 600 "${KUBECONFIG_PATH}"
          echo "KUBECONFIG=${KUBECONFIG_PATH}" >> "${GITHUB_ENV}"

      - name: Deploy with Helm
        run: |
          RELEASE_NAME="${DEPLOY_RELEASE_NAME:-server-monitor}"
          NAMESPACE="${DEPLOY_NAMESPACE:-server-monitor}"
          VALUES_FILE="${DEPLOY_VALUES_FILE:-server-monitor/charts/server-monitor/values.yaml}"

          helm upgrade --install "${RELEASE_NAME}" server-monitor/charts/server-monitor             --namespace "${NAMESPACE}"             --create-namespace             --wait             --atomic             --timeout 10m             --values "${VALUES_FILE}"             --set serverWeb.image.repository=${DOCKERHUB_NAMESPACE}/server-web             --set serverWeb.image.tag=${GITHUB_SHA}             --set alertService.image.repository=${DOCKERHUB_NAMESPACE}/alert-service             --set alertService.image.tag=${GITHUB_SHA}             --set serverProbe.image.repository=${DOCKERHUB_NAMESPACE}/server-probe             --set serverProbe.image.tag=${GITHUB_SHA}
