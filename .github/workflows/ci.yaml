name: CI

on:
  pull_request:
    paths:
      - .github/workflows/ci.yaml
      - server-monitor/**
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - .github/workflows/ci.yaml
      - server-monitor/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  GO_VERSION: '1.26.5'
  GOIMPORTS_VERSION: v0.43.0
  GOLANGCI_LINT_VERSION: v2.11.4
  GOVULNCHECK_VERSION: v1.6.0
  NODE_VERSION: '20'
  HELM_VERSION: v3.14.4
  PROMETHEUS_IMAGE: prom/prometheus:v2.51.0@sha256:5ccad477d0057e62a7cd1981ffcc43785ac10c5a35522dc207466ff7e7ec845f
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  go-checks:
    name: ${{ matrix.module }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module:
          - server-probe
          - server-web
          - alert-service
          - pkg
    defaults:
      run:
        working-directory: server-monitor/${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server-monitor/${{ matrix.module }}/go.sum

      - name: Install goimports
        run: go install "golang.org/x/tools/cmd/goimports@${GOIMPORTS_VERSION}"

      - name: Check goimports
        run: |
          GOIMPORTS_BIN="$(go env GOPATH)/bin/goimports"
          test -z "$(${GOIMPORTS_BIN} -l .)"

      - name: Install golangci-lint
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"

      - name: Run golangci-lint
        run: |
          GOLANGCI_LINT_BIN="$(go env GOPATH)/bin/golangci-lint"
          "${GOLANGCI_LINT_BIN}" run --timeout=5m ./...

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run race tests
        run: go test -race -count=1 ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build module
        run: go build ./...

      - name: Scan reachable Go vulnerabilities
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

      - name: NLU evaluation
        if: matrix.module == 'server-web'
        run: |
          set -o pipefail
          go test ./internal/copilot/nlu/eval/ -run TestEvaluate -v -count=1 2>&1 | tee nlu-eval-report.txt

      - name: RAG evaluation
        if: matrix.module == 'server-web'
        run: |
          set -o pipefail
          go test ./internal/copilot/runbook/eval/ -run TestRAGEval -v -count=1 2>&1 | tee rag-eval-report.txt

      - name: NLU multi-intent evaluation
        if: matrix.module == 'server-web'
        run: |
          set -o pipefail
          go test ./internal/copilot/nlu/eval/ -run TestEvaluateMulti -v -count=1 2>&1 | tee nlu-multi-eval-report.txt

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server-monitor/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server-monitor/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Audit production and build dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Run ESLint
        run: npm run lint

      - name: Run strict typecheck
        run: npx vue-tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

  compose:
    name: compose config checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server-monitor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose config
        run: |
          cleanup() {
            if [ -f .env.ci-backup ]; then
              mv .env.ci-backup .env
            else
              rm -f .env
            fi
          }
          trap cleanup EXIT
          if [ -f .env ]; then
            mv .env .env.ci-backup
          fi
          cp .env.example .env
          docker compose --env-file .env.example config >/tmp/server-monitor-compose.yaml

      - name: Check shell syntax
        run: |
          while IFS= read -r script; do
            bash -n "${script}"
          done < <(rg --files -g '*.sh')

      - name: Run shellcheck
        run: |
          mapfile -t scripts < <(rg --files -g '*.sh')
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo/server-monitor \
            koalaman/shellcheck:v0.10.0 \
            "${scripts[@]}"

  prometheus:
    name: prometheus config checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Prometheus config
        run: |
          docker run --rm             --entrypoint promtool             -v "${{ github.workspace }}/server-monitor/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro"             -v "${{ github.workspace }}/server-monitor/docker/alerts.yml:/etc/prometheus/rules/alerts.yml:ro"             ${{ env.PROMETHEUS_IMAGE }}             check config /etc/prometheus/prometheus.yml

      - name: Check Prometheus rules
        run: |
          docker run --rm             --entrypoint promtool             -v "${{ github.workspace }}/server-monitor/docker/alerts.yml:/etc/prometheus/alerts.yml:ro"             ${{ env.PROMETHEUS_IMAGE }}             check rules /etc/prometheus/alerts.yml

      - name: Check custom alert rules
        run: |
          docker run --rm             --entrypoint promtool             -v "${{ github.workspace }}/server-monitor/docker/custom-alerts.yml:/etc/prometheus/rules/custom-alerts.yml:ro"             ${{ env.PROMETHEUS_IMAGE }}             check rules /etc/prometheus/rules/custom-alerts.yml

      - name: Check AI quality alert rules
        run: |
          docker run --rm             --entrypoint promtool             -v "${{ github.workspace }}/server-monitor/docker/copilot-ai-quality-rules.yml:/etc/prometheus/rules/copilot-ai-quality-rules.yml:ro"             ${{ env.PROMETHEUS_IMAGE }}             check rules /etc/prometheus/rules/copilot-ai-quality-rules.yml

  helm:
    name: helm chart checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint chart
        run: helm lint server-monitor/charts/server-monitor

      - name: Render chart
        run: helm template cloudops server-monitor/charts/server-monitor >/tmp/cloudops-rendered.yaml

      - name: Validate rendered Kubernetes schema
        run: |
          docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas \
            </tmp/cloudops-rendered.yaml

  static-delivery:
    name: workflow and manifest checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse workflow YAML
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            mikefarah/yq:4.44.1 eval '.' .github/workflows/ci.yaml >/dev/null

      - name: Run actionlint
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.7 -color

      - name: Parse raw Kubernetes YAML
        run: |
          for manifest in server-monitor/k8s/*.yaml; do
            docker run --rm \
              -v "${{ github.workspace }}:/repo" \
              -w /repo \
              mikefarah/yq:4.44.1 eval '.' "${manifest}" >/dev/null
          done

      - name: Validate raw Kubernetes schema
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas \
            server-monitor/k8s/*.yaml

      - name: Check patch whitespace
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASE_SHA="${EVENT_BASE_SHA}"
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD^"
          fi
          git diff --check "${BASE_SHA}" "${GITHUB_SHA}" --

  docker-build:
    name: docker build (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - go-checks
      - frontend
      - compose
      - prometheus
      - helm
      - static-delivery
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: server-probe
            file: ./server-monitor/server-probe/Dockerfile
            tag: server-probe:ci
          - name: server-web
            file: ./server-monitor/server-web/Dockerfile
            tag: server-web:ci
          - name: alert-service
            file: ./server-monitor/alert-service/Dockerfile
            tag: alert-service:ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./server-monitor
          file: ${{ matrix.image.file }}
          target: runtime
          push: false
          load: true
          provenance: false
          sbom: false
          tags: ${{ matrix.image.tag }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VCS_SOURCE=${{ github.server_url }}/${{ github.repository }}
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Verify OCI revision labels
        env:
          IMAGE_TAG: ${{ matrix.image.tag }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          test "$(docker image inspect "${IMAGE_TAG}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${EXPECTED_REVISION}"
          test "$(docker image inspect "${IMAGE_TAG}" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = "${EXPECTED_SOURCE}"
          test "$(docker image inspect "${IMAGE_TAG}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "${EXPECTED_REVISION}"

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ matrix.image.tag }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0.20.6
        with:
          image: ${{ matrix.image.tag }}
          format: spdx-json
          output-file: ${{ matrix.image.name }}.spdx.json

      - name: Upload image SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image.name }}
          path: ${{ matrix.image.name }}.spdx.json
          if-no-files-found: error

  push-images:
    name: push images (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - docker-build
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: server-probe
            file: ./server-monitor/server-probe/Dockerfile
          - name: server-web
            file: ./server-monitor/server-web/Dockerfile
          - name: alert-service
            file: ./server-monitor/alert-service/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push immutable image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: ./server-monitor
          file: ${{ matrix.image.file }}
          target: runtime
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image.name }}:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VCS_SOURCE=${{ github.server_url }}/${{ github.repository }}
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Sign immutable image digest
        env:
          IMAGE: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image.name }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Record immutable digest
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          test "${DIGEST#sha256:}" != "${DIGEST}"
          printf '%s' "${DIGEST}" >"${{ matrix.image.name }}.digest"

      - name: Upload immutable digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.image.name }}
          path: ${{ matrix.image.name }}.digest
          if-no-files-found: error

  deploy:
    name: deploy chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_ENABLED == 'true'
    needs:
      - push-images
    environment: production
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      DEPLOY_NAMESPACE: ${{ vars.DEPLOY_NAMESPACE }}
      DEPLOY_RELEASE_NAME: ${{ vars.DEPLOY_RELEASE_NAME }}
      DEPLOY_VALUES_FILE: ${{ vars.DEPLOY_VALUES_FILE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Download immutable image digests
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/image-digests
          merge-multiple: true

      - name: Configure kubeconfig
        run: |
          if [ -z "${KUBE_CONFIG_DATA}" ]; then
            echo "KUBE_CONFIG_DATA secret is required when DEPLOY_ENABLED=true" >&2
            exit 1
          fi
          KUBECONFIG_PATH="${RUNNER_TEMP}/kubeconfig"
          printf '%s' "${KUBE_CONFIG_DATA}" | base64 -d > "${KUBECONFIG_PATH}"
          chmod 600 "${KUBECONFIG_PATH}"
          echo "KUBECONFIG=${KUBECONFIG_PATH}" >> "${GITHUB_ENV}"

      - name: Deploy with Helm
        run: |
          RELEASE_NAME="${DEPLOY_RELEASE_NAME:-server-monitor}"
          NAMESPACE="${DEPLOY_NAMESPACE:-server-monitor}"
          VALUES_FILE="${DEPLOY_VALUES_FILE:-server-monitor/charts/server-monitor/values.yaml}"
          SERVER_WEB_DIGEST="$(cat "${RUNNER_TEMP}/image-digests/server-web.digest")"
          ALERT_SERVICE_DIGEST="$(cat "${RUNNER_TEMP}/image-digests/alert-service.digest")"
          SERVER_PROBE_DIGEST="$(cat "${RUNNER_TEMP}/image-digests/server-probe.digest")"
          for digest in "${SERVER_WEB_DIGEST}" "${ALERT_SERVICE_DIGEST}" "${SERVER_PROBE_DIGEST}"; do
            [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          done

          helm upgrade --install "${RELEASE_NAME}" server-monitor/charts/server-monitor \
            --namespace "${NAMESPACE}" \
            --create-namespace \
            --wait \
            --atomic \
            --timeout 10m \
            --values "${VALUES_FILE}" \
            --set-string "serverWeb.image.repository=${DOCKERHUB_NAMESPACE}/server-web" \
            --set-string "serverWeb.image.digest=${SERVER_WEB_DIGEST}" \
            --set-string "alertService.image.repository=${DOCKERHUB_NAMESPACE}/alert-service" \
            --set-string "alertService.image.digest=${ALERT_SERVICE_DIGEST}" \
            --set-string "serverProbe.image.repository=${DOCKERHUB_NAMESPACE}/server-probe" \
            --set-string "serverProbe.image.digest=${SERVER_PROBE_DIGEST}"
