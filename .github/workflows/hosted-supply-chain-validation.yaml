name: Hosted Supply-Chain Validation

on:
  workflow_dispatch:

concurrency:
  group: hosted-supply-chain-validation-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  validate-context:
    name: validate non-production context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}

      - name: Fail closed outside the approved main ref
        run: |
          [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${GITHUB_SHA}" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Prove validation has no deployment surface
        run: |
          WORKFLOW=.github/workflows/hosted-supply-chain-validation.yaml
          if grep -En '^[[:space:]]+environment:' "${WORKFLOW}"; then
            exit 1
          fi
          if grep -En '^[[:space:]]+uses:[[:space:]]+azure/setup-(helm|kubectl)@' "${WORKFLOW}"; then
            exit 1
          fi
          if grep -En '^[[:space:]]+(helm|kubectl|argocd)[[:space:]]' "${WORKFLOW}"; then
            exit 1
          fi
          if grep -En '^[[:space:]]+[A-Za-z0-9_-]+:.*secrets\.' "${WORKFLOW}"; then
            exit 1
          fi

  validate-images:
    name: validate image (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs:
      - validate-context
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    env:
      EVIDENCE_SUBDIR: hosted-validation-evidence/${{ matrix.image.name }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            file: ./Dockerfile
            target: cloudops-api
          - name: worker
            file: ./Dockerfile
            target: cloudops-worker
          - name: migrate
            file: ./Dockerfile
            target: cloudops-migrate
          - name: demo
            file: ./Dockerfile
            target: cloudops-demo
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to validation GHCR namespace
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare validation-only image identity
        id: image
        env:
          SERVICE: ${{ matrix.image.name }}
        run: |
          case "${SERVICE}" in
            api|worker|migrate|demo) ;;
            *) exit 1 ;;
          esac
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          PACKAGE="cloudops-copilot-validation-${SERVICE}"
          IMAGE_REPOSITORY="ghcr.io/${OWNER}/${PACKAGE}"
          VALIDATION_TAG="validation-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_TAG="${IMAGE_REPOSITORY}:${VALIDATION_TAG}"
          EVIDENCE_DIR="${RUNNER_TEMP}/${EVIDENCE_SUBDIR}"
          mkdir -p "${EVIDENCE_DIR}"
          echo "EVIDENCE_DIR=${EVIDENCE_DIR}" >>"${GITHUB_ENV}"
          {
            echo "package=${PACKAGE}"
            echo "repository=${IMAGE_REPOSITORY}"
            echo "tag=${IMAGE_TAG}"
            echo "tag_name=${VALIDATION_TAG}"
          } >>"${GITHUB_OUTPUT}"
          printf '%s\n' "${GITHUB_SHA}" >"${EVIDENCE_DIR}/git-sha.txt"

      - name: Build and push validation image
        id: build-push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VCS_SOURCE=${{ github.server_url }}/${{ github.repository }}
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=hosted-validation-${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=hosted-validation-${{ matrix.image.name }}

      - name: Verify Registry digest and OCI labels
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          SERVICE: ${{ matrix.image.name }}
        run: |
          [[ "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          REGISTRY_DIGEST="$(docker buildx imagetools inspect "${IMAGE_TAG}" --format '{{json .Manifest}}' | jq -r '.digest')"
          test "${REGISTRY_DIGEST}" = "${DIGEST}"

          IMAGE_REF="${IMAGE_REPOSITORY}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE_REF}" --format '{{json .Image}}' >"${EVIDENCE_DIR}/oci-labels.json"
          jq -e --arg sha "${GITHUB_SHA}" --arg source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" '
            .config.Labels["org.opencontainers.image.revision"] == $sha and
            .config.Labels["org.opencontainers.image.version"] == $sha and
            .config.Labels["org.opencontainers.image.source"] == $source
          ' "${EVIDENCE_DIR}/oci-labels.json" >/dev/null

          jq -n \
            --arg service "${SERVICE}" \
            --arg repository "${IMAGE_REPOSITORY}" \
            --arg digest "${DIGEST}" \
            --arg validation_tag "${IMAGE_TAG}" \
            '{service: $service, repository: $repository, digest: $digest, validation_tag: $validation_tag}' \
            >"${EVIDENCE_DIR}/image-digests.json"

      - name: Scan exact validation digest
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: v0.72.0
          image-ref: ${{ steps.image.outputs.repository }}@${{ steps.build-push.outputs.digest }}
          format: json
          output: ${{ runner.temp }}/hosted-validation-evidence/${{ matrix.image.name }}/trivy.json
          exit-code: '1'
          ignore-unfixed: false
          severity: HIGH,CRITICAL

      - name: Generate exact validation digest SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: ${{ steps.image.outputs.repository }}@${{ steps.build-push.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/hosted-validation-evidence/${{ matrix.image.name }}/${{ matrix.image.name }}.spdx.json

      - name: Record scan and SBOM hashes
        run: |
          sha256sum \
            "${EVIDENCE_DIR}/${{ matrix.image.name }}.spdx.json" \
            "${EVIDENCE_DIR}/trivy.json" \
            >"${EVIDENCE_DIR}/evidence.sha256"

      - name: Attest exact digest build provenance
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Attest exact digest SBOM
        id: sbom-attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/hosted-validation-evidence/${{ matrix.image.name }}/${{ matrix.image.name }}.spdx.json
          push-to-registry: true

      - name: Inspect provenance and SBOM subjects
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          extract_statement() {
            local bundle="$1"
            local output="$2"
            jq -er '.. | objects | .payload? // empty' "${bundle}" | head -n 1 | base64 -d >"${output}"
          }

          cp "${PROVENANCE_BUNDLE}" "${EVIDENCE_DIR}/provenance.bundle.json"
          cp "${SBOM_BUNDLE}" "${EVIDENCE_DIR}/sbom.bundle.json"
          extract_statement "${PROVENANCE_BUNDLE}" "${EVIDENCE_DIR}/provenance-inspection.json"
          extract_statement "${SBOM_BUNDLE}" "${EVIDENCE_DIR}/sbom-attestation-inspection.json"

          for statement in provenance-inspection.json sbom-attestation-inspection.json; do
            jq -e --arg name "${IMAGE_REPOSITORY}" --arg digest "${DIGEST#sha256:}" '
              any(.subject[]; .name == $name and .digest.sha256 == $digest)
            ' "${EVIDENCE_DIR}/${statement}" >/dev/null
          done
          jq -e '.predicateType == "https://slsa.dev/provenance/v1"' \
            "${EVIDENCE_DIR}/provenance-inspection.json" >/dev/null
          jq -e '.predicateType | startswith("https://spdx.dev/")' \
            "${EVIDENCE_DIR}/sbom-attestation-inspection.json" >/dev/null

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1

      - name: Sign exact validation digest with GitHub OIDC
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          SERVICE: ${{ matrix.image.name }}
        run: |
          cosign sign --yes \
            --oidc-provider=github-actions \
            --bundle "${EVIDENCE_DIR}/cosign-sign.bundle.json" \
            -a "service=${SERVICE}" \
            -a "digest=${DIGEST}" \
            -a "git.sha=${GITHUB_SHA}" \
            "${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Verify exact hosted identity and transparency log
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          SERVICE: ${{ matrix.image.name }}
        run: |
          CERTIFICATE_IDENTITY="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/hosted-supply-chain-validation.yaml@refs/heads/main"
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
            --certificate-github-workflow-name "${GITHUB_WORKFLOW}" \
            --certificate-github-workflow-ref "refs/heads/main" \
            --certificate-github-workflow-sha "${GITHUB_SHA}" \
            --certificate-github-workflow-trigger "workflow_dispatch" \
            -a "service=${SERVICE}" \
            -a "digest=${DIGEST}" \
            -a "git.sha=${GITHUB_SHA}" \
            --output json \
            "${IMAGE_REPOSITORY}@${DIGEST}" \
            >"${EVIDENCE_DIR}/cosign-verify.json"
          cosign download signature "${IMAGE_REPOSITORY}@${DIGEST}" \
            >"${EVIDENCE_DIR}/cosign-signatures.json"

          CERTIFICATE_BYTES="$(jq -er '
            .verificationMaterial.certificate.rawBytes //
            .verificationMaterial.x509CertificateChain.certificates[0].rawBytes
          ' "${EVIDENCE_DIR}/cosign-sign.bundle.json")"
          printf '%s' "${CERTIFICATE_BYTES}" | base64 -d \
            | openssl x509 -inform DER -noout -text \
            >"${EVIDENCE_DIR}/certificate-claims.txt"
          certificate_claim() {
            local oid="$1"
            awk -v oid="${oid}:" '
              index($0, oid) {
                getline
                sub(/^[[:space:]]+/, "")
                print
                exit
              }
            ' "${EVIDENCE_DIR}/certificate-claims.txt"
          }
          CERTIFICATE_IDENTITY_FROM_CERT="$(awk '
            /X509v3 Subject Alternative Name/ {
              getline
              sub(/^[[:space:]]*URI:/, "")
              print
              exit
            }
          ' "${EVIDENCE_DIR}/certificate-claims.txt")"
          CERTIFICATE_ISSUER="$(certificate_claim 1.3.6.1.4.1.57264.1.1)"
          CERTIFICATE_TRIGGER="$(certificate_claim 1.3.6.1.4.1.57264.1.2)"
          CERTIFICATE_SHA="$(certificate_claim 1.3.6.1.4.1.57264.1.3)"
          CERTIFICATE_WORKFLOW_NAME="$(certificate_claim 1.3.6.1.4.1.57264.1.4)"
          CERTIFICATE_REPOSITORY="$(certificate_claim 1.3.6.1.4.1.57264.1.5)"
          CERTIFICATE_REF="$(certificate_claim 1.3.6.1.4.1.57264.1.6)"
          jq -n \
            --arg issuer "${CERTIFICATE_ISSUER}" \
            --arg certificate_identity "${CERTIFICATE_IDENTITY_FROM_CERT}" \
            --arg repository "${CERTIFICATE_REPOSITORY}" \
            --arg workflow_name "${CERTIFICATE_WORKFLOW_NAME}" \
            --arg workflow_ref "${CERTIFICATE_REF}" \
            --arg workflow_sha "${CERTIFICATE_SHA}" \
            --arg workflow_trigger "${CERTIFICATE_TRIGGER}" \
            '[{issuer: $issuer, certificate_identity: $certificate_identity,
              repository: $repository, workflow_name: $workflow_name,
              workflow_ref: $workflow_ref, workflow_sha: $workflow_sha,
              workflow_trigger: $workflow_trigger}]' \
            >"${EVIDENCE_DIR}/certificate-claims.json"
          jq -e \
            --arg issuer "https://token.actions.githubusercontent.com" \
            --arg identity "${CERTIFICATE_IDENTITY}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflow_name "${GITHUB_WORKFLOW}" \
            --arg workflow_ref "refs/heads/main" \
            --arg workflow_sha "${GITHUB_SHA}" \
            --arg workflow_trigger "workflow_dispatch" \
            'length == 1 and .[0].issuer == $issuer and
              .[0].certificate_identity == $identity and
              .[0].repository == $repository and
              .[0].workflow_name == $workflow_name and
              .[0].workflow_ref == $workflow_ref and
              .[0].workflow_sha == $workflow_sha and
              .[0].workflow_trigger == $workflow_trigger' \
            "${EVIDENCE_DIR}/certificate-claims.json" >/dev/null
          jq '{mediaType, tlogEntries: .verificationMaterial.tlogEntries}' \
            "${EVIDENCE_DIR}/cosign-sign.bundle.json" \
            >"${EVIDENCE_DIR}/rekor-transparency.json"
          jq -e '.tlogEntries | length > 0 and all(.[]; .logIndex != null and .logId != null)' \
            "${EVIDENCE_DIR}/rekor-transparency.json" >/dev/null

      - name: Record hosted workflow evidence
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          SERVICE: ${{ matrix.image.name }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflow_name "${GITHUB_WORKFLOW}" \
            --arg workflow_path ".github/workflows/hosted-supply-chain-validation.yaml" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg run_url "${RUN_URL}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            --arg ref "${GITHUB_REF}" \
            --arg sha "${GITHUB_SHA}" \
            --arg actor "${GITHUB_ACTOR}" \
            --arg environment "none" \
            --arg issuer "https://token.actions.githubusercontent.com" \
            --arg certificate_identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/hosted-supply-chain-validation.yaml@refs/heads/main" \
            --arg service "${SERVICE}" \
            --arg image_repository "${IMAGE_REPOSITORY}" \
            --arg image_digest "${DIGEST}" \
            '{repository: $repository, workflow_name: $workflow_name, workflow_path: $workflow_path,
              run_id: $run_id, run_attempt: $run_attempt, run_url: $run_url, event: $event,
              ref: $ref, sha: $sha, actor: $actor, environment: $environment, issuer: $issuer,
              certificate_identity: $certificate_identity, service: $service,
              image_repository: $image_repository, image_digest: $image_digest}' \
            >"${EVIDENCE_DIR}/workflow-run.json"
          ACTION_PATHS=(.github/workflows)
          if [ -d .github/actions ]; then
            ACTION_PATHS+=(.github/actions)
          fi
          grep -RhoE 'uses:[[:space:]]+[^[:space:]]+' "${ACTION_PATHS[@]}" \
            | sed -E 's/^uses:[[:space:]]+//' | sort -u >"${EVIDENCE_DIR}/action-pins.txt"
          sha256sum "${EVIDENCE_DIR}"/*.json >"${EVIDENCE_DIR}/json-evidence.sha256"

      - name: Delete temporary validation package and referrers
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.image.outputs.package }}
          VALIDATION_TAG: ${{ steps.image.outputs.tag_name }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
          SERVICE: ${{ matrix.image.name }}
        run: |
          EVIDENCE_DIR="${EVIDENCE_DIR:-${RUNNER_TEMP}/${EVIDENCE_SUBDIR}}"
          mkdir -p "${EVIDENCE_DIR}"
          set +e

          API_ROOT="${GITHUB_API_URL%/}"
          EXPECTED_PACKAGE=""
          EXPECTED_TAG="validation-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IDENTITY_STATE="invalid"
          DIGEST_STATE="invalid"
          IDENTITY_ERRORS='[]'
          CLEANUP_SCOPE=""
          CLEANUP_VERSION_ID=""
          CLEANUP_RESULT="fail"
          INITIAL_PACKAGE_VERSIONS='[]'
          SCOPE_PROBES='[]'
          DELETE_ATTEMPTS='[]'
          DELETE_FAILURES=0
          POST_DELETE_VERSION_HTTP=""
          POST_DELETE_VERSION_STATE="not_run"
          POST_DELETE_PACKAGE_HTTP=""
          POST_DELETE_PACKAGE_VERSIONS='[]'
          POST_DELETE_PACKAGE_STATE="not_run"
          REFERRER_PROBE_EXIT=""
          REFERRER_STATE="not_run"
          REFERRERS='[]'

          api_call() {
            local method="$1"
            local path="$2"
            local body_file="$3"
            local headers_file="$4"
            local error_file="$5"
            curl --silent --show-error \
              --request "${method}" \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --dump-header "${headers_file}" \
              --output "${body_file}" \
              --write-out '%{http_code}' \
              "${API_ROOT}${path}" 2>"${error_file}"
          }

          record_identity_error() {
            IDENTITY_ERRORS="$(jq -c --arg error "$1" '. + [$error]' <<<"${IDENTITY_ERRORS}")"
          }

          summarize_versions() {
            jq -c '[.[] | {
              id,
              name,
              tags: (.metadata.container.tags // []),
              created_at,
              updated_at
            }]' "$1"
          }

          case "${SERVICE}" in
            api|worker|migrate|demo)
              EXPECTED_PACKAGE="cloudops-copilot-validation-${SERVICE}"
              ;;
            *)
              record_identity_error "service is not an approved validation service"
              ;;
          esac
          if [ -n "${EXPECTED_PACKAGE}" ] && [ "${PACKAGE}" != "${EXPECTED_PACKAGE}" ]; then
            record_identity_error "package does not match the approved validation package"
          fi
          if [ "${VALIDATION_TAG}" != "${EXPECTED_TAG}" ]; then
            record_identity_error "validation tag does not match the current SHA, run, and attempt"
          fi
          if [ "$(jq 'length' <<<"${IDENTITY_ERRORS}")" -eq 0 ]; then
            IDENTITY_STATE="valid"
          fi
          if [[ "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            DIGEST_STATE="valid"
          else
            record_identity_error "image digest is missing or invalid"
          fi

          if [ "${IDENTITY_STATE}" = "valid" ]; then
            for scope in orgs users; do
              probe_body="${RUNNER_TEMP}/${PACKAGE}-${scope}-scope.json"
              probe_headers="${RUNNER_TEMP}/${PACKAGE}-${scope}-scope.headers"
              probe_error_file="${RUNNER_TEMP}/${PACKAGE}-${scope}-scope.err"
              endpoint="/${scope}/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE}/versions?per_page=100&page=1"
              if probe_http="$(api_call GET "${endpoint}" "${probe_body}" "${probe_headers}" "${probe_error_file}")"; then
                probe_exit=0
              else
                probe_exit=$?
              fi
              probe_error="$(tail -c 4000 "${probe_error_file}" 2>/dev/null)"
              SCOPE_PROBES="$(jq -c \
                --arg scope "${scope}" \
                --arg http "${probe_http}" \
                --arg error "${probe_error}" \
                --argjson curl_exit "${probe_exit}" \
                '. + [{scope: $scope, http: $http, curl_exit: $curl_exit, error: $error}]' \
                <<<"${SCOPE_PROBES}")"
              if [ "${probe_exit}" -ne 0 ]; then
                record_identity_error "GitHub Packages scope probe failed"
                continue
              fi
              case "${probe_http}" in
                200)
                  if ! jq -e 'type == "array"' "${probe_body}" >/dev/null 2>&1; then
                    record_identity_error "GitHub Packages scope response was not an array"
                  elif [ -n "${CLEANUP_SCOPE}" ]; then
                    record_identity_error "validation package resolved in more than one owner scope"
                  else
                    CLEANUP_SCOPE="${scope}"
                    INITIAL_PACKAGE_VERSIONS="$(summarize_versions "${probe_body}")"
                  fi
                  ;;
                404) ;;
                *) record_identity_error "GitHub Packages scope probe returned an unexpected status" ;;
              esac
            done
          fi

          if [ -z "${CLEANUP_SCOPE}" ]; then
            record_identity_error "validation package was not found in an approved owner scope"
          else
            tagged_versions="$(jq -c --arg tag "${VALIDATION_TAG}" '
              [.[] | select(any(.tags[]?; . == $tag))]
            ' <<<"${INITIAL_PACKAGE_VERSIONS}")"
            tagged_count="$(jq 'length' <<<"${tagged_versions}")"
            if [ "${tagged_count}" -ne 1 ]; then
              record_identity_error "expected exactly one package version with the current validation tag"
            else
              CLEANUP_VERSION_ID="$(jq -r '.[0].id' <<<"${tagged_versions}")"
              tagged_digest="$(jq -r '.[0].name' <<<"${tagged_versions}")"
              if [ "${DIGEST_STATE}" != "valid" ] || [ "${tagged_digest}" != "${DIGEST}" ]; then
                record_identity_error "tagged package version does not match the built image digest"
              fi
            fi
          fi

          if [ -n "${CLEANUP_SCOPE}" ] && [ -n "${CLEANUP_VERSION_ID}" ]; then
            subject_path="/${CLEANUP_SCOPE}/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE}/versions/${CLEANUP_VERSION_ID}"
            delete_body="${RUNNER_TEMP}/${PACKAGE}-subject-delete.json"
            delete_headers="${RUNNER_TEMP}/${PACKAGE}-subject-delete.headers"
            delete_error_file="${RUNNER_TEMP}/${PACKAGE}-subject-delete.err"
            if delete_http="$(api_call DELETE "${subject_path}" "${delete_body}" "${delete_headers}" "${delete_error_file}")"; then
              delete_exit=0
            else
              delete_exit=$?
            fi
            delete_error="$(tail -c 4000 "${delete_error_file}" 2>/dev/null)"
            DELETE_ATTEMPTS="$(jq -c \
              --arg phase subject \
              --arg version_id "${CLEANUP_VERSION_ID}" \
              --arg http "${delete_http}" \
              --arg error "${delete_error}" \
              --argjson curl_exit "${delete_exit}" \
              '. + [{phase: $phase, version_id: $version_id, http: $http,
                curl_exit: $curl_exit, error: $error}]' <<<"${DELETE_ATTEMPTS}")"
            if [ "${delete_exit}" -ne 0 ] || { [ "${delete_http}" != "204" ] && [ "${delete_http}" != "404" ]; }; then
              DELETE_FAILURES=$((DELETE_FAILURES + 1))
            fi

            cleanup_iteration=0
            while [ "${cleanup_iteration}" -lt 20 ]; do
              cleanup_iteration=$((cleanup_iteration + 1))
              list_path="/${CLEANUP_SCOPE}/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE}/versions?per_page=100&page=1"
              list_body="${RUNNER_TEMP}/${PACKAGE}-cleanup-list-${cleanup_iteration}.json"
              list_headers="${RUNNER_TEMP}/${PACKAGE}-cleanup-list-${cleanup_iteration}.headers"
              list_error_file="${RUNNER_TEMP}/${PACKAGE}-cleanup-list-${cleanup_iteration}.err"
              if list_http="$(api_call GET "${list_path}" "${list_body}" "${list_headers}" "${list_error_file}")"; then
                list_exit=0
              else
                list_exit=$?
              fi
              if [ "${list_exit}" -ne 0 ]; then
                DELETE_FAILURES=$((DELETE_FAILURES + 1))
                POST_DELETE_PACKAGE_HTTP="${list_http}"
                POST_DELETE_PACKAGE_STATE="check_failed"
                break
              fi
              if [ "${list_http}" = "404" ]; then
                POST_DELETE_PACKAGE_HTTP="404"
                POST_DELETE_PACKAGE_VERSIONS='[]'
                POST_DELETE_PACKAGE_STATE="absent"
                break
              fi
              if [ "${list_http}" != "200" ] || ! jq -e 'type == "array"' "${list_body}" >/dev/null 2>&1; then
                DELETE_FAILURES=$((DELETE_FAILURES + 1))
                POST_DELETE_PACKAGE_HTTP="${list_http}"
                POST_DELETE_PACKAGE_STATE="check_failed"
                break
              fi

              POST_DELETE_PACKAGE_HTTP="200"
              POST_DELETE_PACKAGE_VERSIONS="$(summarize_versions "${list_body}")"
              remaining_count="$(jq 'length' <<<"${POST_DELETE_PACKAGE_VERSIONS}")"
              if [ "${remaining_count}" -eq 0 ]; then
                POST_DELETE_PACKAGE_STATE="empty"
                break
              fi

              while IFS= read -r version_id; do
                residual_path="/${CLEANUP_SCOPE}/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE}/versions/${version_id}"
                residual_body="${RUNNER_TEMP}/${PACKAGE}-residual-${version_id}.json"
                residual_headers="${RUNNER_TEMP}/${PACKAGE}-residual-${version_id}.headers"
                residual_error_file="${RUNNER_TEMP}/${PACKAGE}-residual-${version_id}.err"
                if residual_http="$(api_call DELETE "${residual_path}" "${residual_body}" "${residual_headers}" "${residual_error_file}")"; then
                  residual_exit=0
                else
                  residual_exit=$?
                fi
                residual_error="$(tail -c 4000 "${residual_error_file}" 2>/dev/null)"
                DELETE_ATTEMPTS="$(jq -c \
                  --arg phase residual \
                  --arg version_id "${version_id}" \
                  --arg http "${residual_http}" \
                  --arg error "${residual_error}" \
                  --argjson curl_exit "${residual_exit}" \
                  '. + [{phase: $phase, version_id: $version_id, http: $http,
                    curl_exit: $curl_exit, error: $error}]' <<<"${DELETE_ATTEMPTS}")"
                if [ "${residual_exit}" -ne 0 ] || { [ "${residual_http}" != "204" ] && [ "${residual_http}" != "404" ]; }; then
                  DELETE_FAILURES=$((DELETE_FAILURES + 1))
                fi
              done < <(jq -r '.[].id' "${list_body}")
              sleep 1
            done

            if [ "${POST_DELETE_PACKAGE_STATE}" = "not_run" ]; then
              POST_DELETE_PACKAGE_STATE="iteration_limit"
              DELETE_FAILURES=$((DELETE_FAILURES + 1))
            fi

            version_body="${RUNNER_TEMP}/${PACKAGE}-post-delete-subject.json"
            version_headers="${RUNNER_TEMP}/${PACKAGE}-post-delete-subject.headers"
            version_error_file="${RUNNER_TEMP}/${PACKAGE}-post-delete-subject.err"
            if POST_DELETE_VERSION_HTTP="$(api_call GET "${subject_path}" "${version_body}" "${version_headers}" "${version_error_file}")"; then
              version_exit=0
            else
              version_exit=$?
            fi
            if [ "${version_exit}" -eq 0 ] && [ "${POST_DELETE_VERSION_HTTP}" = "404" ]; then
              POST_DELETE_VERSION_STATE="absent"
            elif [ "${version_exit}" -eq 0 ] && [ "${POST_DELETE_VERSION_HTTP}" = "200" ]; then
              POST_DELETE_VERSION_STATE="present"
            else
              POST_DELETE_VERSION_STATE="check_failed"
            fi
          fi

          if [[ "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            referrer_output="${RUNNER_TEMP}/${PACKAGE}-post-delete-signatures.jsonl"
            referrer_error="${RUNNER_TEMP}/${PACKAGE}-post-delete-signatures.err"
            cosign download signature \
              "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${PACKAGE}@${DIGEST}" \
              >"${referrer_output}" 2>"${referrer_error}"
            REFERRER_PROBE_EXIT="$?"
            if [ "${REFERRER_PROBE_EXIT}" -eq 0 ]; then
              REFERRERS="$(jq -sc '[.[] | {
                mediaType,
                predicateType: (.dsseEnvelope.payload | @base64d | fromjson | .predicateType),
                subjects: (.dsseEnvelope.payload | @base64d | fromjson | .subject)
              }]' "${referrer_output}")"
              if [ "$(jq 'length' <<<"${REFERRERS}")" -eq 0 ]; then
                REFERRER_STATE="none"
              else
                REFERRER_STATE="residual"
              fi
            elif grep -Eqi 'manifest unknown|name unknown|not found|no signatures|404' \
              "${referrer_error}"; then
              REFERRER_STATE="subject_not_found"
            else
              REFERRER_STATE="check_failed"
            fi
          fi

          if [ "$(jq 'length' <<<"${IDENTITY_ERRORS}")" -eq 0 ]; then
            IDENTITY_STATE="valid"
          else
            IDENTITY_STATE="invalid"
          fi

          if [ "${IDENTITY_STATE}" = "valid" ] && \
            [ "${DELETE_FAILURES}" -eq 0 ] && \
            [ "${POST_DELETE_VERSION_STATE}" = "absent" ] && \
            { [ "${POST_DELETE_PACKAGE_STATE}" = "absent" ] || [ "${POST_DELETE_PACKAGE_STATE}" = "empty" ]; } && \
            { [ "${REFERRER_STATE}" = "none" ] || [ "${REFERRER_STATE}" = "subject_not_found" ]; }; then
            CLEANUP_RESULT="pass"
          fi

          jq -n \
            --arg result "${CLEANUP_RESULT}" \
            --arg package "${PACKAGE}" \
            --arg expected_package "${EXPECTED_PACKAGE}" \
            --arg tag "${VALIDATION_TAG}" \
            --arg expected_tag "${EXPECTED_TAG}" \
            --arg identity_state "${IDENTITY_STATE}" \
            --arg digest_state "${DIGEST_STATE}" \
            --arg scope "${CLEANUP_SCOPE}" \
            --arg version_id "${CLEANUP_VERSION_ID}" \
            --arg post_delete_version_http "${POST_DELETE_VERSION_HTTP}" \
            --arg post_delete_version_state "${POST_DELETE_VERSION_STATE}" \
            --arg post_delete_package_http "${POST_DELETE_PACKAGE_HTTP}" \
            --arg post_delete_package_state "${POST_DELETE_PACKAGE_STATE}" \
            --arg referrer_probe_exit "${REFERRER_PROBE_EXIT}" \
            --argjson identity_errors "${IDENTITY_ERRORS}" \
            --argjson scope_probes "${SCOPE_PROBES}" \
            --argjson initial_package_versions "${INITIAL_PACKAGE_VERSIONS}" \
            --argjson delete_attempts "${DELETE_ATTEMPTS}" \
            --argjson delete_failures "${DELETE_FAILURES}" \
            --argjson post_delete_package_versions "${POST_DELETE_PACKAGE_VERSIONS}" \
            --arg referrer_state "${REFERRER_STATE}" \
            --argjson referrers "${REFERRERS}" \
            '{result: $result, package: $package, expected_package: $expected_package,
              tag: $tag, expected_tag: $expected_tag, identity_state: $identity_state,
              digest_state: $digest_state, identity_errors: $identity_errors,
              scope: $scope, scope_probes: $scope_probes, version_id: $version_id,
              initial_package_versions: $initial_package_versions,
              delete_attempts: $delete_attempts, delete_failures: $delete_failures,
              post_delete_version_http: $post_delete_version_http,
              post_delete_version_state: $post_delete_version_state,
              post_delete_package_http: $post_delete_package_http,
              post_delete_package_state: $post_delete_package_state,
              post_delete_package_versions: $post_delete_package_versions,
              referrer_probe_exit: $referrer_probe_exit, referrer_state: $referrer_state,
              referrers: $referrers,
              note: "PASS requires exact validation identity, an absent subject, an absent or empty package, and no discoverable referrers."}' \
            >"${EVIDENCE_DIR}/registry-cleanup.json"
          test "${CLEANUP_RESULT}" = "pass"

      - name: Upload hosted validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-validation-evidence-${{ matrix.image.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-validation-evidence/${{ matrix.image.name }}
          if-no-files-found: error
          retention-days: 30
