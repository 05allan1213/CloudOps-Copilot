{{- if and .Values.observability.stack.enabled (not .Values.bootstrapOnly) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudops-alerting
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/component: alerting-config
data:
  alertmanager.yml: |-
    global:
      resolve_timeout: 1m
    route:
      receiver: cloudops-webhook
      group_by: [alertname, cluster, environment, namespace, deployment, scenario_id]
      group_wait: {{ .Values.observability.stack.alertmanager.groupWait }}
      group_interval: {{ .Values.observability.stack.alertmanager.groupInterval }}
      repeat_interval: {{ .Values.observability.stack.alertmanager.repeatInterval }}
    receivers:
      - name: cloudops-webhook
        webhook_configs:
          - url: http://{{ include "cloudops.apiManagementServiceName" . }}.{{ .Release.Namespace }}.svc:{{ .Values.api.managementPort }}/webhooks/alertmanager
            send_resolved: true
            max_alerts: 100
            http_config:
              authorization:
                type: Bearer
                credentials_file: {{ .Values.webhook.tokenFile }}
  cloudops-alerts.yml: |-
    groups:
      - name: cloudops-alert-lifecycle
        interval: {{ .Values.observability.stack.scrapeInterval }}
        rules:
          - alert: CloudOpsAlertLifecycleValidation
            expr: vector(0) > 0
            labels:
              severity: critical
              cluster: {{ .Values.observability.stack.clusterID | quote }}
              environment: {{ .Values.observability.stack.environment | quote }}
              namespace: demo
              deployment: demo
              service: demo
            annotations:
              summary: Controlled Alert lifecycle validation
              description: Real Prometheus and Alertmanager integration signal
          {{- if .Values.scenario.enabled }}
          - alert: CloudOpsScenarioRequiredEnvMissing
            expr: cloudops_demo_workload_ready{job="cloudops-scenario-fault",scenario_id={{ .Values.scenario.id | quote }}} == 0
            for: 5s
            labels:
              severity: critical
              cluster: {{ .Values.observability.stack.clusterID | quote }}
              environment: {{ .Values.observability.stack.environment | quote }}
              namespace: {{ .Values.scenario.namespace | quote }}
              deployment: cloudops-scenario-fault
              service: cloudops-scenario-fault
              scenario_id: {{ .Values.scenario.id | quote }}
            annotations:
              summary: Scenario workload is failing because REQUIRED_ENV is missing
              description: The bounded Scenario fault workload is live and serving real HTTP 500 responses.
          {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: alert-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: alert-provider
      annotations:
        checksum/config: {{ toJson .Values.observability.stack.alertmanager | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: {{ include "cloudops.image" .Values.observability.stack.alertmanager.image | quote }}
          imagePullPolicy: {{ .Values.observability.stack.alertmanager.image.pullPolicy }}
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --data.retention={{ .Values.observability.stack.alertmanager.retention }}
            - --web.listen-address=:{{ .Values.observability.stack.alertmanager.port }}
            - --log.level=info
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.observability.stack.alertmanager.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            failureThreshold: 30
            periodSeconds: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.observability.stack.alertmanager.resources | nindent 12 }}
          volumeMounts:
            - name: alerting-config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
              readOnly: true
            - name: webhook-token
              mountPath: {{ .Values.webhook.mountPath }}
              readOnly: true
            - name: alertmanager-data
              mountPath: /alertmanager
            - name: alertmanager-tmp
              mountPath: /tmp
      volumes:
        - name: alerting-config
          configMap:
            name: cloudops-alerting
            defaultMode: 0444
        - name: webhook-token
          secret:
            secretName: {{ .Values.webhook.secretName }}
            items:
              - key: {{ .Values.webhook.secretKey }}
                path: token
        - name: alertmanager-data
          emptyDir:
            sizeLimit: 64Mi
        - name: alertmanager-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: alert-provider
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.observability.stack.alertmanager.port }}
      targetPort: http
      protocol: TCP
{{- end }}
