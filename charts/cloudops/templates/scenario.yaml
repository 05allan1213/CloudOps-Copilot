{{- if and .Values.scenario.enabled (not .Values.bootstrapOnly) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudops-scenario
  namespace: {{ .Values.scenario.namespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/component: scenario
    cloudops.io/scenario-id: {{ .Values.scenario.id | quote }}
automountServiceAccountToken: false
{{- range $variant := list "healthy" "fault" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "cloudops-scenario-%s" $variant }}
  namespace: {{ $.Values.scenario.namespace }}
  labels:
    {{- include "cloudops.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ printf "cloudops-scenario-%s" $variant }}
    app.kubernetes.io/component: scenario-workload
    cloudops.io/scenario-id: {{ $.Values.scenario.id | quote }}
    cloudops.io/scenario-variant: {{ $variant }}
spec:
  replicas: 1
  {{- if eq $variant "fault" }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ printf "cloudops-scenario-%s" $variant }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ printf "cloudops-scenario-%s" $variant }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: scenario-workload
        cloudops.io/scenario-id: {{ $.Values.scenario.id | quote }}
        cloudops.io/scenario-variant: {{ $variant }}
    spec:
      serviceAccountName: cloudops-scenario
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scenario
          image: {{ include "cloudops.image" $.Values.images.demo | quote }}
          imagePullPolicy: {{ $.Values.images.demo.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: SERVICE_NAME
              value: {{ printf "cloudops-scenario-%s" $variant }}
            - name: SERVICE_VERSION
              value: local
            - name: SOURCE_REVISION
              value: {{ $.Values.commonEnv.SOURCE_REVISION | quote }}
            - name: DEPLOYMENT_ENVIRONMENT
              value: {{ $.Values.observability.stack.environment | quote }}
            - name: K8S_CLUSTER_NAME
              value: {{ $.Values.observability.stack.clusterID | quote }}
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: K8S_WORKLOAD_NAME
              value: {{ printf "cloudops-scenario-%s" $variant }}
            - name: SCENARIO_ID
              value: {{ $.Values.scenario.id | quote }}
            - name: TRACE_OTLP_ENDPOINT
              value: {{ $.Values.commonEnv.TRACE_OTLP_ENDPOINT | quote }}
            - name: TRACE_SAMPLE_RATE
              value: {{ $.Values.commonEnv.TRACE_SAMPLE_RATE | quote }}
            - name: REQUIRED_ENV
              value: present
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
          resources:
            {{- toYaml $.Values.scenario.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "cloudops-scenario-%s" $variant }}
  namespace: {{ $.Values.scenario.namespace }}
  labels:
    {{- include "cloudops.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ printf "cloudops-scenario-%s" $variant }}
    app.kubernetes.io/component: scenario-workload
    cloudops.io/scenario-id: {{ $.Values.scenario.id | quote }}
spec:
  type: ClusterIP
  {{- if eq $variant "fault" }}
  publishNotReadyAddresses: true
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ printf "cloudops-scenario-%s" $variant }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-scenario-traffic
  namespace: {{ .Values.scenario.namespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/name: cloudops-scenario-traffic
    app.kubernetes.io/component: scenario-traffic
    cloudops.io/scenario-id: {{ .Values.scenario.id | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudops-scenario-traffic
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudops-scenario-traffic
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: scenario-traffic
        cloudops.io/scenario-id: {{ .Values.scenario.id | quote }}
    spec:
      serviceAccountName: cloudops-scenario
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traffic
          image: {{ include "cloudops.image" .Values.images.demo | quote }}
          imagePullPolicy: {{ .Values.images.demo.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DEMO_MODE
              value: traffic
            - name: SERVICE_NAME
              value: cloudops-scenario-traffic
            - name: K8S_WORKLOAD_NAME
              value: cloudops-scenario-traffic
            - name: TRAFFIC_TARGETS
              value: http://cloudops-scenario-healthy.{{ .Values.scenario.namespace }}.svc:8080/,http://cloudops-scenario-fault.{{ .Values.scenario.namespace }}.svc:8080/
            - name: TRAFFIC_INTERVAL
              value: {{ .Values.scenario.trafficInterval | quote }}
            - name: SERVICE_VERSION
              value: local
            - name: SOURCE_REVISION
              value: {{ .Values.commonEnv.SOURCE_REVISION | quote }}
            - name: DEPLOYMENT_ENVIRONMENT
              value: {{ .Values.observability.stack.environment | quote }}
            - name: K8S_CLUSTER_NAME
              value: {{ .Values.observability.stack.clusterID | quote }}
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: SCENARIO_ID
              value: {{ .Values.scenario.id | quote }}
            - name: TRACE_OTLP_ENDPOINT
              value: {{ .Values.commonEnv.TRACE_OTLP_ENDPOINT | quote }}
            - name: TRACE_SAMPLE_RATE
              value: {{ .Values.commonEnv.TRACE_SAMPLE_RATE | quote }}
          resources:
            {{- toYaml .Values.scenario.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
