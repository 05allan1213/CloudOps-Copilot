{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: cloudops-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migrate.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudops-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudops-migrate
          image: {{ include "cloudops.image" .Values.images.migrate | quote }}
          imagePullPolicy: {{ .Values.images.migrate.pullPolicy }}
          command: ["/app/cloudops-migrate"]
          args: ["up"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # Pre-install hooks run before normal ConfigMaps and
            # ServiceAccounts exist, so the migration Job receives only its
            # bounded database settings directly from values plus the
            # pre-created password Secret.
            {{- range $name := list "MYSQL_HOST" "MYSQL_PORT" "MYSQL_DATABASE" "MYSQL_PING_TIMEOUT_SECONDS" }}
            - name: {{ $name }}
              value: {{ index $.Values.commonEnv $name | quote }}
            {{- end }}
            - name: MYSQL_USER
              value: {{ .Values.database.migrate.user | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.migrate.secretName }}
                  key: {{ .Values.database.migrate.passwordKey }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          volumeMounts:
            - name: migrate-tmp
              mountPath: /tmp
      volumes:
        - name: migrate-tmp
          emptyDir: {}
{{- end }}
