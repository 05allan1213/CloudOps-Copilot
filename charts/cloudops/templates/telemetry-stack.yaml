              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: health
            failureThreshold: 30
            periodSeconds: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.observability.stack.otelCollector.resources | nindent 12 }}
          volumeMounts:
            - name: telemetry-config
              mountPath: /etc/cloudops-telemetry/otel-collector.yaml
              subPath: otel-collector.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: telemetry-config
          configMap:
            name: cloudops-telemetry
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: trace-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.observability.stack.otelCollector.grpcPort }}
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: {{ .Values.observability.stack.otelCollector.httpPort }}
      targetPort: otlp-http
      protocol: TCP
{{- end }}
