{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudops.apiName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/name: cloudops-api
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudops-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudops-api
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
        cloudops.io/monitoring: enabled
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: cloudops-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudops-api
          image: {{ include "cloudops.image" .Values.images.api | quote }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            {{- range $name, $_ := .Values.commonEnv }}
            - name: {{ $name }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cloudops.configMapName" $ }}
                  key: {{ $name }}
            {{- end }}
            {{- range $name, $value := .Values.api.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            - name: LISTEN_ADDR
              value: {{ ternary (printf "127.0.0.1:%d" (.Values.api.userPort | int)) (printf ":%d" (.Values.api.userPort | int)) .Values.oauth.enabled | quote }}
            - name: INTERNAL_LISTEN_ADDR
              value: {{ printf ":%d" (.Values.api.internalPort | int) | quote }}
            - name: V3_PROXY_AUTH_ENABLED
              value: {{ .Values.oauth.enabled | quote }}
            - name: V3_OAUTH_VIEWER_LOGINS
              value: {{ join "," .Values.oauth.viewerLogins | quote }}
            - name: V3_OAUTH_OPERATOR_LOGINS
              value: {{ join "," .Values.oauth.operatorLogins | quote }}
            - name: V3_CSRF_SECRET_FILE
              value: {{ ternary .Values.csrf.secretFile "" .Values.oauth.enabled | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.passwordKey }}
            - name: ALERTMANAGER_WEBHOOK_BEARER_TOKEN_FILE
              value: {{ .Values.webhook.tokenFile | quote }}
          ports:
            - name: user
              containerPort: {{ .Values.api.userPort }}
              protocol: TCP
            - name: internal
              containerPort: {{ .Values.api.internalPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: internal
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: internal
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: internal
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: webhook-token
              mountPath: {{ .Values.webhook.mountPath }}
              readOnly: true
            {{- if .Values.oauth.enabled }}
            - name: csrf-signing-key
              mountPath: {{ .Values.csrf.mountPath }}
              readOnly: true
            {{- end }}
            - name: api-tmp
              mountPath: /tmp
        {{- if .Values.oauth.enabled }}
        - name: oauth2-proxy
          image: {{ include "cloudops.image" .Values.images.oauth2Proxy | quote }}
          imagePullPolicy: {{ .Values.images.oauth2Proxy.pullPolicy }}
          args:
            - --alpha-config=/etc/oauth2-proxy/alpha-config.yaml
            - {{ printf "--redirect-url=%s" .Values.oauth.redirectURL | quote }}
            {{- range .Values.oauth.allowedEmailDomains }}
            - {{ printf "--email-domain=%s" . | quote }}
            {{- end }}
            - {{ printf "--cookie-name=%s" .Values.oauth.cookie.name | quote }}
            - {{ printf "--cookie-secure=%t" .Values.oauth.cookie.secure | quote }}
            - {{ printf "--cookie-samesite=%s" .Values.oauth.cookie.sameSite | quote }}
            - --cookie-httponly=true
            - {{ printf "--cookie-expire=%s" .Values.oauth.cookie.expire | quote }}
            - {{ printf "--cookie-refresh=%s" .Values.oauth.cookie.refresh | quote }}
            - --session-cookie-minimal=true
            - --skip-provider-button=true
            - --skip-auth-preflight=true
            - --ping-path=/ping
            - --ready-path=/ready
          env:
            - name: CLOUDOPS_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth.secret.name }}
                  key: {{ .Values.oauth.secret.clientIDKey }}
            - name: CLOUDOPS_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth.secret.name }}
                  key: {{ .Values.oauth.secret.clientSecretKey }}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth.secret.name }}
                  key: {{ .Values.oauth.secret.cookieSecretKey }}
          ports:
            - name: oauth
              containerPort: {{ .Values.oauth.port }}
              protocol: TCP
            - name: oauth-metrics
              containerPort: {{ .Values.oauth.metricsPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ping
              port: oauth
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: oauth
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: oauth
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.oauth.resources | nindent 12 }}
          volumeMounts:
            - name: oauth2-proxy-config
              mountPath: /etc/oauth2-proxy/alpha-config.yaml
              subPath: oauth2-proxy-alpha-config.yaml
              readOnly: true
            - name: oauth2-proxy-tmp
              mountPath: /tmp
        {{- end }}
      volumes:
        - name: webhook-token
          secret:
            secretName: {{ .Values.webhook.secretName }}
            items:
              - key: {{ .Values.webhook.secretKey }}
                path: token
        {{- if .Values.oauth.enabled }}
        - name: csrf-signing-key
          secret:
            secretName: {{ .Values.csrf.secretName }}
            items:
              - key: {{ .Values.csrf.secretKey }}
                path: signing-key
        - name: oauth2-proxy-config
          configMap:
            name: {{ include "cloudops.configMapName" . }}
            items:
              - key: oauth2-proxy-alpha-config.yaml
                path: oauth2-proxy-alpha-config.yaml
        - name: oauth2-proxy-tmp
          emptyDir: {}
        {{- end }}
        - name: api-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudops.apiInternalServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/name: cloudops-api
    app.kubernetes.io/component: api-internal
    cloudops.io/monitoring: enabled
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudops-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: internal
      port: {{ .Values.api.internalPort }}
      targetPort: internal
      protocol: TCP
{{- if .Values.oauth.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudops.apiUserServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/name: cloudops-api
    app.kubernetes.io/component: api-user
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudops-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: oauth
      port: {{ .Values.oauth.port }}
      targetPort: oauth
      protocol: TCP
{{- end }}
{{- end }}
