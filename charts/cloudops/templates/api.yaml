{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudops.apiName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/name: cloudops-api
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudops-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudops-api
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
        cloudops.io/monitoring: enabled
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: cloudops-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudops-api
          image: {{ include "cloudops.image" .Values.images.api | quote }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            {{- range $name, $_ := .Values.commonEnv }}
            - name: {{ $name }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cloudops.configMapName" $ }}
                  key: {{ $name }}
            {{- end }}
            {{- range $name, $value := .Values.api.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            - name: LISTEN_ADDR
              value: {{ printf ":%d" (.Values.api.port | int) | quote }}
            - name: INTERNAL_LISTEN_ADDR
              value: {{ printf ":%d" (.Values.api.managementPort | int) | quote }}
            - name: MYSQL_USER
              value: {{ .Values.database.api.user | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.api.secretName }}
                  key: {{ .Values.database.api.passwordKey }}
            - name: ALERTMANAGER_WEBHOOK_BEARER_TOKEN_FILE
              value: {{ .Values.webhook.tokenFile | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
            - name: management
              containerPort: {{ .Values.api.managementPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: management
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: management
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: webhook-token
              mountPath: {{ .Values.webhook.mountPath }}
              readOnly: true
            - name: api-tmp
              mountPath: /tmp
      volumes:
        - name: webhook-token
          secret:
            secretName: {{ .Values.webhook.secretName }}
            items:
              - key: {{ .Values.webhook.secretKey }}
                path: token
        - name: api-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudops.apiServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/name: cloudops-api
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudops-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudops.apiManagementServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/name: cloudops-api
    app.kubernetes.io/component: api-management
    cloudops.io/monitoring: enabled
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudops-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: management
      port: {{ .Values.api.managementPort }}
      targetPort: management
      protocol: TCP
{{- end }}
