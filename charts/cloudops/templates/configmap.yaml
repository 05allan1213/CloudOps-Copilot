apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudops.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  {{- range $name, $value := .Values.commonEnv }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- if .Values.oauth.enabled }}
  oauth2-proxy-alpha-config.yaml: |-
    server:
      bindAddress: "0.0.0.0:{{ .Values.oauth.port }}"
    metricsServer:
      bindAddress: "0.0.0.0:{{ .Values.oauth.metricsPort }}"
    upstreamConfig:
      upstreams:
        - id: cloudops-api
          path: /
          uri: http://127.0.0.1:{{ .Values.api.userPort }}
    providers:
      - id: github
        name: GitHub
        provider: github
        clientID: "${CLOUDOPS_OAUTH_CLIENT_ID}"
        clientSecret: "${CLOUDOPS_OAUTH_CLIENT_SECRET}"
        githubConfig:
          users:
          {{- range concat .Values.oauth.viewerLogins .Values.oauth.operatorLogins }}
            - {{ . | quote }}
          {{- end }}
    injectRequestHeaders:
      # This is the only identity header accepted by cloudops-api. Any
      # client-supplied value is removed before the authenticated claim wins.
      - name: X-Auth-Request-User
        preserveRequestValue: false
        values:
          - claimSource:
              claim: user
      # Keep the API-owned CSRF token, but strip credentials and every other
      # identity-bearing header before proxying to the loopback API listener.
      - name: X-CSRF-Token
        preserveRequestValue: true
      - name: Authorization
        preserveRequestValue: false
      - name: Proxy-Authorization
        preserveRequestValue: false
      - name: Cookie
        preserveRequestValue: false
      - name: X-Forwarded-User
        preserveRequestValue: false
      - name: X-Forwarded-Email
        preserveRequestValue: false
      - name: X-Forwarded-Groups
        preserveRequestValue: false
      - name: X-Forwarded-Preferred-Username
        preserveRequestValue: false
      - name: X-Forwarded-Access-Token
        preserveRequestValue: false
      - name: X-Auth-Request-Email
        preserveRequestValue: false
      - name: X-Auth-Request-Groups
        preserveRequestValue: false
      - name: X-Auth-Request-Preferred-Username
        preserveRequestValue: false
      - name: X-Auth-Request-Access-Token
        preserveRequestValue: false
{{- end }}
