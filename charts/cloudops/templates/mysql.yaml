{{- if .Values.mysql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: {{ include "cloudops.image" .Values.mysql.image | quote }}
          imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysql.rootSecretName }}
                  key: {{ .Values.mysql.rootPasswordKey }}
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
            - name: CLOUDOPS_API_USER
              value: {{ .Values.database.api.user | quote }}
            - name: CLOUDOPS_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.api.secretName }}
                  key: {{ .Values.database.api.passwordKey }}
            - name: CLOUDOPS_WORKER_USER
              value: {{ .Values.database.worker.user | quote }}
            - name: CLOUDOPS_WORKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.worker.secretName }}
                  key: {{ .Values.database.worker.passwordKey }}
            - name: CLOUDOPS_MIGRATE_USER
              value: {{ .Values.database.migrate.user | quote }}
            - name: CLOUDOPS_MIGRATE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.migrate.secretName }}
                  key: {{ .Values.database.migrate.passwordKey }}
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          readinessProbe:
            exec:
              command: ["sh", "-ec", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-ec", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: bootstrap-identities
              mountPath: /docker-entrypoint-initdb.d/10-cloudops-identities.sh
              subPath: 10-cloudops-identities.sh
              readOnly: true
      volumes:
        - name: bootstrap-identities
          configMap:
            name: cloudops-mysql-bootstrap
            defaultMode: 0444
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "cloudops.labels" . | nindent 10 }}
          app.kubernetes.io/component: database
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mysql.persistence.size | quote }}
        {{- if .Values.mysql.persistence.storageClassName }}
        storageClassName: {{ .Values.mysql.persistence.storageClassName | quote }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
{{- end }}
