apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudops-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
automountServiceAccountToken: false
{{- if .Values.worker.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudops-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudops-worker-readonly
  namespace: {{ .Values.worker.demoNamespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudops-worker-readonly
  namespace: {{ .Values.worker.demoNamespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
subjects:
  - kind: ServiceAccount
    name: cloudops-worker
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudops-worker-readonly
{{- end }}
{{- if .Values.baselineVerifier.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudops-baseline-verifier
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/component: baseline-verifier
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudops-baseline-verifier-readonly
  namespace: {{ .Values.baselineVerifier.demoNamespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/component: baseline-verifier
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudops-baseline-verifier-readonly
  namespace: {{ .Values.baselineVerifier.demoNamespace }}
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
    app.kubernetes.io/component: baseline-verifier
subjects:
  - kind: ServiceAccount
    name: cloudops-baseline-verifier
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudops-baseline-verifier-readonly
{{- end }}
