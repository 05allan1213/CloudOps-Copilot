profile: phase3

images:
  api:
    repository: cloudops-api
    tag: dev
    digest: ""
    pullPolicy: IfNotPresent
  worker:
    repository: cloudops-worker
    tag: dev
    digest: ""
    pullPolicy: IfNotPresent
  migrate:
    repository: cloudops-migrate
    tag: dev
    digest: ""
    pullPolicy: IfNotPresent
  oauth2Proxy:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.15.3
    digest: ""
    pullPolicy: IfNotPresent

# Non-secret environment shared by API, Worker, and Migrate. MySQL identities
# and credential values are workload-scoped below, read from pre-created
# Secrets, and never rendered by this chart.
commonEnv:
  APP_ENV: local-demo
  LOG_LEVEL: info
  GIN_MODE: release
  PROMETHEUS_URL: http://cloudops-monitoring-kube-prometheus-prometheus.cloudops-monitoring.svc:9090
  REDIS_ADDR: ""
  KAFKA_BROKERS: ""
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: cloudops
  MYSQL_STARTUP_TIMEOUT_SECONDS: "30"
  MYSQL_PING_TIMEOUT_SECONDS: "3"
  TRACE_OTLP_ENDPOINT: ""
  TRACE_SAMPLE_RATE: "1.0"

database:
  api:
    user: cloudops-api
    secretName: cloudops-api-database
    passwordKey: MYSQL_PASSWORD
  worker:
    user: cloudops-worker
    secretName: cloudops-worker-database
    passwordKey: MYSQL_PASSWORD
  migrate:
    user: cloudops-migrate
    secretName: cloudops-migrate-database
    passwordKey: MYSQL_PASSWORD

webhook:
  secretName: cloudops-alertmanager-webhook
  secretKey: token
  mountPath: /var/run/secrets/cloudops/alertmanager
  tokenFile: /var/run/secrets/cloudops/alertmanager/token

# This signing key is intentionally isolated from the oauth2-proxy client and
# cookie Secret. It is mounted only into cloudops-api when OAuth is enabled.
csrf:
  secretName: cloudops-csrf
  secretKey: signing-key
  mountPath: /var/run/secrets/cloudops/csrf
  secretFile: /var/run/secrets/cloudops/csrf/signing-key

api:
  enabled: true
  replicas: 1
  userPort: 8080
  internalPort: 8082
  env:
    AUTH_ENABLED: "false"
    RATE_LIMIT_ENABLED: "false"
    INCIDENT_AGENT_ENABLED: "false"
    CHANGE_INTELLIGENCE_ENABLED: "false"
    REMEDIATION_ENABLED: "false"
    DELIVERY_TRACKING_ENABLED: "false"
    VERIFICATION_ENABLED: "false"
    K8S_ENABLED: "false"
    K8S_WRITE_ENABLED: "false"
    STATIC_DIR: /app/static
    ALERTMANAGER_WEBHOOK_REQUIRE_BEARER: "true"
    SIGNAL_TARGET_ALLOWLIST_JSON: '[{"cluster_id":"kind-cloudops-v3","environment":"local-demo","namespace":"demo","workload_kind":"Deployment","workload_name":"demo","service_name":"demo","match_labels":{"cluster":"kind-cloudops-v3","environment":"local-demo","namespace":"demo","deployment":"demo"}}]'
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

migrate:
  enabled: true
  backoffLimit: 6
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 300
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

oauth:
  enabled: false
  port: 4180
  metricsPort: 44180
  redirectURL: http://127.0.0.1:4180/oauth2/callback
  allowedEmailDomains:
    - "*"
  viewerLogins:
    - cloudops-viewer
  operatorLogins:
    - cloudops-operator
  secret:
    name: cloudops-oauth
    clientIDKey: client-id
    clientSecretKey: client-secret
    cookieSecretKey: cookie-secret
  cookie:
    name: _cloudops_oauth2_proxy
    secure: false
    sameSite: lax
    expire: 8h
    refresh: 0s
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

worker:
  enabled: false
  replicas: 1
  managementPort: 8081
  demoNamespace: demo
  # Pre-created configuration Secret. It supplies environment-specific,
  # non-credential provider values such as V3_TARGET_REPOSITORY,
  # V3_TARGET_GITOPS_PATH, V3_TARGET_ARGO_REPOSITORY_URL, GitHub App IDs,
  # allowlists, fixed provider endpoints, and required workflow identities.
  providerConfigSecretName: cloudops-worker-provider-config
  # Pre-created file credential Secret. The chart mounts it read-only and
  # publishes only file paths to the Worker; it never renders secret bytes.
  credentials:
    secretName: cloudops-worker-credentials
    mountPath: /var/run/secrets/cloudops/worker
    files:
      V3_LLM_API_KEY_FILE: llm-api-key
      GITHUB_PRIVATE_KEY_FILE: github-read-private-key.pem
      GITHUB_WRITE_PRIVATE_KEY_FILE: github-write-private-key.pem
      ARGOCD_TOKEN_FILE: argocd-token
      OBSERVABILITY_ELASTICSEARCH_USERNAME_FILE: elasticsearch-username
      OBSERVABILITY_ELASTICSEARCH_PASSWORD_FILE: elasticsearch-password
      OBSERVABILITY_ELASTICSEARCH_CA_FILE: elasticsearch-ca.crt
  env:
    WORKER_MANAGEMENT_ADDR: ":8081"
    V3_WORKER_PROVIDERS_ENABLED: "true"
    K8S_ENABLED: "true"
    K8S_WRITE_ENABLED: "false"
    K8S_IN_CLUSTER: "true"
    K8S_ALLOWED_NAMESPACES: demo
    K8S_DEFAULT_NAMESPACE: demo
    V3_TARGET_NAMESPACE: demo
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

baselineVerifier:
  enabled: false
  demoNamespace: demo
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  database:
    user: cloudops-baseline
    secretName: cloudops-baseline-database
    passwordKey: MYSQL_PASSWORD
  credentials:
    secretName: cloudops-baseline-credentials
    mountPath: /var/run/secrets/cloudops/baseline
    files:
      ARGOCD_TOKEN_FILE: argocd-token
      OBSERVABILITY_ELASTICSEARCH_USERNAME_FILE: elasticsearch-username
      OBSERVABILITY_ELASTICSEARCH_PASSWORD_FILE: elasticsearch-password
      OBSERVABILITY_ELASTICSEARCH_CA_FILE: elasticsearch-ca.crt
  env:
    K8S_ENABLED: "true"
    K8S_WRITE_ENABLED: "false"
    K8S_IN_CLUSTER: "true"
    K8S_ALLOWED_NAMESPACES: demo
    K8S_DEFAULT_NAMESPACE: demo
    V3_TARGET_CLUSTER: kind-cloudops-v3
    V3_TARGET_ENVIRONMENT: local-demo
    V3_TARGET_NAMESPACE: demo
    V3_TARGET_SERVICE: demo
    V3_TARGET_WORKLOAD: demo
    V3_TARGET_CONTAINER: demo
    V3_TARGET_REPOSITORY: 05allan1213/cloudops-gitops-demo
    V3_SOURCE_REPOSITORY: 05allan1213/CloudOps-Copilot
    V3_TARGET_BASE_BRANCH: main
    V3_TARGET_GITOPS_PATH: apps/demo/deployment.yaml
    V3_TARGET_ARGO_PATH: apps/demo
    V3_TARGET_ARGO_APPLICATION: cloudops-demo
    V3_TARGET_ARGO_PROJECT: cloudops-demo
    V3_TARGET_ARGO_DESTINATION_SERVER: https://kubernetes.default.svc
    V3_TARGET_READY_URL: http://demo-diagnostics.demo.svc:8080/readyz
    V3_TARGET_REQUIRED_ENV_KEY: REQUIRED_ENV
    V3_REQUIRED_CHECK_NAME: gitops-required-check
    V3_REQUIRED_WORKFLOW_PATH: .github/workflows/gitops-required-check.yml
    V3_BASELINE_ALERT_NAMES: CloudOpsDemoRequiredEnvMissing,CloudOpsDemoErrorRateHigh
    V3_BASELINE_LOOKBACK_SECONDS: "1800"
    V3_BASELINE_TIMEOUT_SECONDS: "180"
    GITHUB_API_BASE_URL: https://api.github.com
    ARGOCD_SERVER: https://argocd-server.cloudops-argocd.svc
    ARGOCD_ALLOWED_APPLICATIONS: cloudops-demo
    ARGOCD_ALLOWED_PROJECTS: cloudops-demo
    REGISTRY_BASE_URL: https://ghcr.io
    REGISTRY_ALLOWED_HOSTS: ghcr.io
    REGISTRY_ALLOWED_REPOSITORIES: 05allan1213/cloudops-demo
    REGISTRY_ALLOWED_AUTH_REALM_HOSTS: ghcr.io
    OCI_ALLOWED_SOURCE_REPOSITORIES: https://github.com/05allan1213/CloudOps-Copilot
    OBSERVABILITY_PROMETHEUS_URL: http://cloudops-monitoring-kube-prometheus-prometheus.cloudops-monitoring.svc:9090
    OBSERVABILITY_TEMPO_URL: http://tempo.cloudops-tracing.svc:3200
    OBSERVABILITY_ELASTICSEARCH_URL: https://cloudops-elasticsearch-es-http.cloudops-logging.svc:9200
    OBSERVABILITY_ELASTICSEARCH_INDEX: logs-cloudops-*
    OBSERVABILITY_MAX_LOOKBACK_SECONDS: "3600"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

observability:
  enabled: true
  serviceMonitor:
    interval: 15s
    scrapeTimeout: 5s
