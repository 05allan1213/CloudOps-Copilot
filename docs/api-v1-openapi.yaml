openapi: 3.1.0
info:
  title: CloudOps API v1
  version: 1.0.0
  description: >-
    Local Owner commands and bounded MySQL-backed CloudOps projections.
    Numeric database identifiers, secrets, leases, checkpoints, and raw prompts
    are never public.
servers:
  - url: /
paths:
  /api/v1/bootstrap:
    get:
      operationId: getBootstrap
      responses:
        "200":
          description: Product capabilities and active operational state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapSnapshot" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/scopes:
    get:
      operationId: listOperationalScopes
      responses:
        "200":
          description: Active Operational Scope page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OperationalScope" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/scopes/{id}/activate:
    post:
      operationId: activateOperationalScope
      description: Atomically select one registered Cluster Scope from the active Configuration Revision.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "200":
          description: Newly active Operational Scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalScope" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/overview:
    get:
      operationId: getOverview
      responses:
        "200":
          description: Overview foundation state and real active-cluster Atlas projection
          content:
            application/json:
              schema:
                type: object
                required: [bootstrap, unread_notifications, atlas]
                properties:
                  bootstrap: { $ref: "#/components/schemas/BootstrapSnapshot" }
                  unread_notifications: { type: integer, minimum: 0 }
                  atlas: { $ref: "#/components/schemas/TopologySnapshot" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/topology:
    get:
      operationId: getKubernetesTopology
      description: Bounded typed topology for the single active cluster and Operational Scope.
      parameters:
        - { $ref: "#/components/parameters/InfrastructureCluster" }
        - { $ref: "#/components/parameters/InfrastructureNamespace" }
        - { $ref: "#/components/parameters/InfrastructureFrom" }
        - { $ref: "#/components/parameters/InfrastructureTo" }
        - { $ref: "#/components/parameters/InfrastructureLimit" }
      responses:
        "200":
          description: Real Kubernetes topology or an explicit structured unavailable state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopologySnapshot" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/topology/events:
    get:
      operationId: streamKubernetesTopologyEvents
      description: Bounded topology refresh hints for the active Operational Scope.
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: string, maxLength: 128 }
        - { $ref: "#/components/parameters/InfrastructureCluster" }
        - { $ref: "#/components/parameters/InfrastructureNamespace" }
        - { $ref: "#/components/parameters/InfrastructureFrom" }
        - { $ref: "#/components/parameters/InfrastructureTo" }
      responses:
        "200":
          description: Topology refresh SSE
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/resources:
    get:
      operationId: listKubernetesResources
      description: Searchable bounded Kubernetes Resource Projections from the current topology snapshot.
      parameters:
        - { $ref: "#/components/parameters/InfrastructureCluster" }
        - { $ref: "#/components/parameters/InfrastructureNamespace" }
        - { $ref: "#/components/parameters/InfrastructureFrom" }
        - { $ref: "#/components/parameters/InfrastructureTo" }
        - { $ref: "#/components/parameters/InfrastructureLimit" }
        - { $ref: "#/components/parameters/InfrastructureCursor" }
        - name: kind
          in: query
          schema:
            type: array
            maxItems: 16
            items: { type: string, maxLength: 64 }
        - name: search
          in: query
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Bounded structured resource page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubernetesResourcePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/resources/{id}:
    parameters:
      - { $ref: "#/components/parameters/KubernetesResourceID" }
    get:
      operationId: getKubernetesResource
      description: Typed resource detail with owners, selectors, endpoints, scheduling, conditions and Context Links.
      parameters:
        - { $ref: "#/components/parameters/InfrastructureCluster" }
        - { $ref: "#/components/parameters/InfrastructureNamespace" }
        - { $ref: "#/components/parameters/InfrastructureFrom" }
        - { $ref: "#/components/parameters/InfrastructureTo" }
      responses:
        "200":
          description: Typed Kubernetes resource detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubernetesResourceDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/resources/{id}/events:
    parameters:
      - { $ref: "#/components/parameters/KubernetesResourceID" }
    get:
      operationId: listKubernetesResourceEvents
      description: Recent bounded Kubernetes Events for one exact Resource Projection.
      parameters:
        - { $ref: "#/components/parameters/InfrastructureCluster" }
        - { $ref: "#/components/parameters/InfrastructureNamespace" }
        - { $ref: "#/components/parameters/InfrastructureFrom" }
        - { $ref: "#/components/parameters/InfrastructureTo" }
        - { $ref: "#/components/parameters/InfrastructureLimit" }
      responses:
        "200":
          description: Bounded Kubernetes Event page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubernetesEventPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Bootstrap diagnostics and Operational Configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsSnapshot" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/settings/validate:
    post:
      operationId: validateSettings
      description: Local Owner validation of a typed draft and bounded Provider construction.
      parameters:
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigurationDraft" }
      responses:
        "200":
          description: Persisted validation identity and results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigurationValidation" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/configuration-revisions:
    get:
      operationId: listConfigurationRevisions
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Immutable configuration revision history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ConfigurationRevision" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createConfigurationRevision
      description: Local Owner atomic activation of the exact validated draft.
      parameters:
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyConfiguration" }
      responses:
        "201":
          description: Active immutable configuration revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigurationRevision" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/secrets:
    post:
      operationId: createSecretVersion
      description: Local Owner write-only secret version creation; the value is never returned.
      parameters:
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretInput" }
      responses:
        "201":
          description: Secret metadata without the submitted value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretVersion" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/providers/{provider}/tests:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ProviderIdentity" }
    post:
      operationId: testProvider
      description: Local Owner bounded connection test for the submitted Provider configuration.
      parameters:
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderTestRequest" }
      responses:
        "200":
          description: Truthful Provider availability result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/storage-status:
    get:
      operationId: getStorageStatus
      responses:
        "200":
          description: Retention, capacity, and latest backup state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageStatus" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/notifications:
    get:
      operationId: listNotifications
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Durable Owner Notification Inbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/notifications/{id}/read:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    post:
      operationId: readNotification
      description: Local Owner marks one durable notification read.
      parameters:
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "204": { description: Notification marked read }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/notifications/read-all:
    post:
      operationId: readAllNotifications
      description: Local Owner marks unread notifications through an optional current cursor.
      parameters:
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReadAllNotifications" }
      responses:
        "200":
          description: Number of notifications updated
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/notification-events:
    get:
      operationId: streamNotificationEvents
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: string, format: uuid, maxLength: 36 }
      responses:
        "200":
          description: Owner Notification stream with resumable public UUID cursor
          content:
            text/event-stream:
              schema: { type: string }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/alerts:
    get:
      operationId: listAlerts
      description: Independent Alert lifecycle page derived from immutable Signals.
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: status, in: query, schema: { type: string, enum: [firing, resolved] } }
        - { name: severity, in: query, schema: { type: string, enum: [unknown, info, warning, critical] } }
        - { name: namespace, in: query, schema: { type: string, maxLength: 255 } }
        - { name: search, in: query, schema: { type: string, maxLength: 255 } }
      responses:
        "200":
          description: Bounded Alert page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/alerts/{id}:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    get:
      operationId: getAlert
      responses:
        "200":
          description: Alert lifecycle, source Signal provenance and audit events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertDetail" }
        "404": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/alerts/{id}/acknowledgements:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    post:
      operationId: acknowledgeAlert
      description: Local Owner records a recurrence-bound acknowledgement without silencing or resolving the Alert.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertCommand" }
      responses:
        "200": { description: Updated Alert, content: { application/json: { schema: { $ref: "#/components/schemas/Alert" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/alerts/{id}/silences:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    post:
      operationId: createAlertSilence
      description: Local Owner creates an exact-matcher, provider-backed silence bounded to 5 minutes through 24 hours.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertSilenceCommand" }
      responses:
        "201": { description: Provider-backed silence, content: { application/json: { schema: { $ref: "#/components/schemas/AlertSilence" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/silences/{id}/expire:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    post:
      operationId: expireAlertSilence
      description: Local Owner expires the provider silence while leaving Alert firing state unchanged.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertExpireSilenceCommand" }
      responses:
        "200": { description: Expired silence, content: { application/json: { schema: { $ref: "#/components/schemas/AlertSilence" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/alerts/{id}/investigations:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    post:
      operationId: startAlertInvestigation
      description: Local Owner starts an Investigation through an explicitly linked active Incident.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertCommand" }
      responses:
        "202": { description: Investigation accepted, content: { application/json: { schema: { $ref: "#/components/schemas/Alert" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/alerts/{id}/incident-links:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    post:
      operationId: linkAlertIncident
      description: Local Owner explicitly creates an Incident or attaches the Alert to an existing active Incident.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertIncidentLinkCommand" }
      responses:
        "201": { description: Updated Alert relation, content: { application/json: { schema: { $ref: "#/components/schemas/Alert" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/incidents:
    get:
      operationId: listIncidents
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/IncidentStatus" }
        - { $ref: "#/components/parameters/IncidentSeverity" }
        - { $ref: "#/components/parameters/IncidentService" }
        - { $ref: "#/components/parameters/IncidentAttention" }
        - { $ref: "#/components/parameters/IncidentResource" }
        - { $ref: "#/components/parameters/IncidentAlert" }
        - { $ref: "#/components/parameters/IncidentFrom" }
        - { $ref: "#/components/parameters/IncidentTo" }
      responses:
        "200":
          description: Incident page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Incident" }
                  next_cursor: { type: string }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/incidents/{id}:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    get:
      operationId: getIncident
      responses:
        "200":
          description: Incident projection
          content:
            application/json:
              schema:
                type: object
                required: [incident]
                properties:
                  incident: { $ref: "#/components/schemas/Incident" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/incidents/{id}/alerts:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    get:
      operationId: listIncidentAlertRelations
      description: Current-cycle Alert relations with explicit relationship provenance.
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/IncidentAlertRelationPage" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/incidents/{id}/signals:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    get:
      operationId: listIncidentSignals
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/ResourcePage" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/incidents/{id}/timeline:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    get:
      operationId: listIncidentTimeline
      parameters: [{ $ref: "#/components/parameters/AfterID" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/IncidentTimelinePage" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/incidents/{id}/evidence:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    get:
      operationId: listIncidentEvidence
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/IncidentEvidencePage" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/incidents/{id}/investigations:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    get:
      operationId: listInvestigations
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/IncidentInvestigationPage" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: startInvestigation
      description: Local Owner command with optimistic version and durable idempotency fencing.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionedCommand" }
      responses:
