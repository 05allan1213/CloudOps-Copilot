      properties:
        bad_gitops_revision: { $ref: "#/components/schemas/GitObjectID" }
        fix_gitops_revision: { $ref: "#/components/schemas/GitObjectID" }
        source_revision: { $ref: "#/components/schemas/GitObjectID" }
        image_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        gitops_revision: { $ref: "#/components/schemas/GitObjectID" }
    ResolutionVerificationProfile:
      type: object
      additionalProperties: false
      required: [id, hash]
      properties:
        id: { type: string, maxLength: 128 }
        hash: { $ref: "#/components/schemas/SHA256" }
    ResolutionStability:
      type: object
      additionalProperties: false
      required: [common_window_started_at, common_window_completed_at]
      properties:
        common_window_started_at: { type: string, format: date-time }
        common_window_completed_at: { type: string, format: date-time }
    SHA256:
      type: string
      pattern: "^[0-9a-f]{64}$"
    GitObjectID:
      type: string
      pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
    VersionedCommand:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 2048 }
    DecisionCommand:
      type: object
      additionalProperties: false
      required: [decision, expected_version, expected_hash, reason]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        expected_version: { type: integer, minimum: 1 }
        expected_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        reason: { type: string, minLength: 1, maxLength: 1024 }
    CommandResult:
      type: object
      additionalProperties: false
      required: [id, command, status]
      properties:
        id: { type: string, format: uuid }
        command: { type: string }
        status: { type: string }
        version: { type: integer, minimum: 1 }
        cycle: { type: integer, minimum: 1 }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, request_id, trace_id, next_steps]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        request_id: { type: string }
        trace_id: { type: string }
        next_steps:
          type: array
          minItems: 1
          items: { type: string }
  responses:
    ResourcePage:
      description: Bounded resource page
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items: { $ref: "#/components/schemas/Resource" }
              next_cursor: { type: string }
    Resource:
      description: Bounded resource projection
      content:
        application/json:
          schema:
            type: object
            required: [resource]
            properties:
              resource: { $ref: "#/components/schemas/Resource" }
    RemediationPlanPage:
      description: Bounded current-cycle remediation plan page
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                maxItems: 100
                items: { $ref: "#/components/schemas/RemediationPlan" }
              next_cursor: { type: string, format: uuid }
    DeliveryProjection:
      description: Latest current-cycle delivery projection; resource is null before delivery exists
      content:
        application/json:
          schema:
            type: object
            required: [resource]
            properties:
              resource:
                allOf: [{ $ref: "#/components/schemas/Delivery" }]
                nullable: true
    VerificationRunPage:
      description: Bounded current-cycle verification run page with nested checks and samples
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                maxItems: 100
                items: { $ref: "#/components/schemas/VerificationRun" }
              next_cursor: { type: string, format: uuid }
    ResolutionReportProjection:
      description: Immutable current-cycle ResolutionReport projection; resource is null before resolution
      content:
        application/json:
          schema:
            type: object
            required: [resource]
            properties:
              resource:
                allOf: [{ $ref: "#/components/schemas/ResolutionReport" }]
                nullable: true
    CommandAccepted:
      description: Command persisted and queued
      headers:
        X-Request-ID: { schema: { type: string } }
        X-Trace-ID: { schema: { type: string } }
        Idempotent-Replay: { schema: { type: string, enum: ["true"] } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CommandResult" }
    Problem:
      description: Stable problem response
      headers:
        X-Request-ID: { schema: { type: string } }
        X-Trace-ID: { schema: { type: string } }
        Idempotent-Replay: { schema: { type: string, enum: ["true"] } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
