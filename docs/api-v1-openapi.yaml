        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agent/consultations/{id}/snapshots:
    parameters: [{ $ref: "#/components/parameters/PublicID" }]
    post:
      operationId: attachAgentContextSnapshot
      description: Local Owner explicitly attaches a new current-page context; navigation never mutates an existing snapshot.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "201": { description: New immutable Context Snapshot }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agent/consultations/{id}/messages:
    parameters: [{ $ref: "#/components/parameters/PublicID" }]
    post:
      operationId: sendAgentConsultationMessage
      description: Local Owner starts one durable turn bound to the latest explicit snapshot.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties: { content: { type: string, minLength: 1, maxLength: 16000 } }
      responses:
        "202": { description: Owner message and durable Agent run }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agent/consultations/{id}/events:
    parameters: [{ $ref: "#/components/parameters/PublicID" }]
    get:
      operationId: streamAgentConsultationEvents
      description: Resumable SSE for persisted tool progress and final answers; no hidden reasoning is emitted.
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Agent progress event stream
          content: { text/event-stream: { schema: { type: string } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agent/consultations/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/PublicID" }]
    post:
      operationId: cancelAgentConsultationTurn
      description: Local Owner cancels only the current turn and preserves Consultation history.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "202": { description: Current turn cancellation requested }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/knowledge-items:
    get:
      operationId: listKnowledgeItems
      description: Owner-confirmed, versioned Knowledge Items with scope and review state.
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Knowledge Item page }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createKnowledgeItem
      description: Local Owner confirms exact content before it becomes cross-session guidance.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "201": { description: Owner-confirmed Knowledge Item revision }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/knowledge-items/{id}:
    parameters: [{ $ref: "#/components/parameters/PublicID" }]
    get:
      operationId: getKnowledgeItem
      description: Exact Knowledge Item and immutable revision history.
      responses:
        "200": { description: Knowledge Item detail }
        "404": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: reviseKnowledgeItem
      description: Local Owner creates a new immutable revision or changes lifecycle state.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200": { description: Revised Knowledge Item }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteKnowledgeItem
      description: Local Owner marks the item deleted while retained exact revisions remain explainable.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      responses:
        "204": { description: Knowledge Item marked deleted }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/runbook-guidance:
    get:
      operationId: listRunbookGuidance
      description: Git-managed Runbook Guidance with exact content revision; never current Evidence or write authority.
      responses:
        "200": { description: Versioned Runbook Guidance page }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agent/action-cards:
    post:
      operationId: proposeAgentActionCard
      description: Propose a reversible local action; creation does not authorize or execute it.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "201": { description: Immutable reversible Action Card }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agent/action-cards/{id}:
    parameters: [{ $ref: "#/components/parameters/PublicID" }]
    get:
      operationId: getAgentActionCard
      description: Exact reversible Action Card and authorization state.
      responses:
        "200": { description: Action Card detail }
        "404": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agent/action-cards/{id}/authorizations:
    parameters: [{ $ref: "#/components/parameters/PublicID" }]
    post:
      operationId: authorizeAgentActionCard
      description: Local Owner authorizes exactly one immutable reversible Action Card hash; no execution occurs here.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExactAuthorization" } } }
      responses:
        "201": { description: Exact Action Card authorization }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agent/action-cards/{id}/executions:
    parameters: [{ $ref: "#/components/parameters/PublicID" }]
    post:
      operationId: executeAgentActionCard
      description: Local Owner queues one exact authorized reversible Action Card; the API performs no mutation.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExactExecution" } } }
      responses:
        "202": { description: Durable controlled execution queued, content: { application/json: { schema: { $ref: "#/components/schemas/OperationExecution" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/operation-plans:
    get:
      operationId: listAgentOperationPlans
      description: Immutable high-impact Operation Plans and exact authorization state.
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Operation Plan page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/OperationPlan" } }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: proposeAgentOperationPlan
      description: Propose a high-impact external operation; creation never authorizes or executes it.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ScenarioScaleOperationPlanProposal" } } }
      responses:
        "201": { description: Immutable high-impact Operation Plan, content: { application/json: { schema: { $ref: "#/components/schemas/OperationPlan" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/operation-plans/{id}:
    parameters: [{ $ref: "#/components/parameters/PublicID" }]
    get:
      operationId: getAgentOperationPlan
      description: Exact high-impact Operation Plan and authorization state.
      responses:
        "200": { description: Operation Plan detail, content: { application/json: { schema: { $ref: "#/components/schemas/OperationPlan" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/operation-plans/{id}/authorizations:
    parameters: [{ $ref: "#/components/parameters/PublicID" }]
    post:
      operationId: authorizeAgentOperationPlan
      description: Local Owner authorizes one exact immutable high-impact plan hash; execution remains a separate operation.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExactAuthorization" } } }
      responses:
        "201": { description: Exact Operation Plan authorization }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/operation-plans/{id}/executions:
    parameters: [{ $ref: "#/components/parameters/PublicID" }]
    post:
      operationId: executeAgentOperationPlan
      description: Local Owner queues one exact authorized high-impact Operation Plan; only the Worker may cross the provider effect boundary.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExactExecution" } } }
      responses:
        "202": { description: Durable controlled execution queued, content: { application/json: { schema: { $ref: "#/components/schemas/OperationExecution" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/operations:
    get:
      operationId: listControlledOperations
      description: Durable controlled execution and audit projections; this read never contacts or mutates a Provider.
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Controlled operation execution page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/OperationExecution" } }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/operations/{id}:
    parameters: [{ $ref: "#/components/parameters/PublicID" }]
    get:
      operationId: getControlledOperation
      description: One durable execution with append-only audit and current verification Evidence.
      responses:
        "200": { description: Controlled operation detail, content: { application/json: { schema: { $ref: "#/components/schemas/OperationExecution" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/devops:
    get:
      operationId: getDevOpsWorkspace
      description: MySQL projection of exact change, baseline, Plan, delivery, operation, provider, and Verification identities.
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: DevOps Workspace projection, content: { application/json: { schema: { $ref: "#/components/schemas/DevOpsWorkspace" } } } }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
components:
  parameters:
    PublicID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid, minLength: 36, maxLength: 36 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 256 }
    AfterID:
      name: after_id
      in: query
      schema: { type: string, maxLength: 256 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    IncidentStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [detected, investigating, awaiting_approval, delivering, verifying, resolved, closed]
    IncidentSeverity:
      name: severity
      in: query
      schema: { type: string, enum: [unknown, info, warning, critical] }
    IncidentService:
      name: service
      in: query
      schema: { type: string, maxLength: 255 }
    IncidentAttention:
      name: attention
      in: query
      schema: { type: boolean }
    IncidentResource:
      name: resource
      in: query
      schema: { type: string, maxLength: 512 }
    IncidentAlert:
      name: alert
      in: query
      schema: { type: string, format: uuid }
    IncidentFrom:
      name: from
      in: query
      schema: { type: string, format: date-time }
    IncidentTo:
      name: to
      in: query
      schema: { type: string, format: date-time }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string, format: uri, maxLength: 2048 }
    KubernetesResourceID:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^k8s_[A-Za-z0-9_-]+$", maxLength: 512 }
    InfrastructureCluster:
      name: cluster
      in: query
      schema: { type: string, maxLength: 128 }
    InfrastructureNamespace:
      name: namespace
      in: query
      schema: { type: string, maxLength: 253 }
    InfrastructureFrom:
      name: from
      in: query
      schema: { type: string, format: date-time }
    InfrastructureTo:
      name: to
      in: query
      schema: { type: string, format: date-time }
    InfrastructureLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
    InfrastructureCursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 2048 }
    MonitoringCluster:
      name: cluster_id
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    MonitoringNamespace:
      name: namespace
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 253 }
    MonitoringResourceID:
      name: resource_id
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 512 }
    MonitoringResourceKind:
      name: resource_kind
      in: query
      required: true
      schema: { type: string, enum: [Deployment, StatefulSet, DaemonSet] }
    MonitoringResourceName:
      name: resource_name
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 253 }
  schemas:
    ProviderIdentity:
      type: string
      enum: [llm, kubernetes, prometheus, alertmanager, elasticsearch, tempo, github, argocd]
    GeneralConfiguration:
      type: object
      additionalProperties: false
      required: [query_max_lookback_seconds, query_max_results, telemetry_retention_days, browser_notifications_enabled, automatic_escalation_enabled]
      properties:
        query_max_lookback_seconds: { type: integer, minimum: 60, maximum: 2592000 }
        query_max_results: { type: integer, minimum: 1, maximum: 10000 }
        telemetry_retention_days: { type: integer, minimum: 1, maximum: 365 }
        browser_notifications_enabled: { type: boolean }
        automatic_escalation_enabled: { type: boolean, const: false }
    OperationalScope:
      type: object
      additionalProperties: false
      required: [name, cluster_id, environment, namespaces]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 128 }
        cluster_id: { type: string, minLength: 1, maxLength: 128 }
        environment: { type: string, minLength: 1, maxLength: 64 }
        namespaces:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 253 }
        configuration_revision_id: { type: string, format: uuid }
        configuration_revision_hash: { $ref: "#/components/schemas/SHA256" }
        active: { type: boolean }
    ProviderConfiguration:
      type: object
      additionalProperties: false
      required: [provider, enabled, endpoint, model, timeout_ms, max_results, context_link_base]
      properties:
        provider: { $ref: "#/components/schemas/ProviderIdentity" }
        enabled: { type: boolean }
        endpoint: { type: string, maxLength: 2048 }
        model: { type: string, maxLength: 255 }
        timeout_ms: { type: integer, minimum: 1000, maximum: 60000 }
        max_results: { type: integer, minimum: 1, maximum: 10000 }
        context_link_base: { type: string, maxLength: 2048 }
    SecretReference:
      type: object
      additionalProperties: false
      required: [provider, purpose, secret_version_id]
      properties:
        provider: { $ref: "#/components/schemas/ProviderIdentity" }
        purpose: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
        secret_version_id: { type: string, format: uuid }
        state: { type: string, enum: [configured, invalid] }
        fingerprint: { type: string, pattern: "^[0-9a-f]{20}$" }
    ConfigurationDraft:
      type: object
      additionalProperties: false
      required: [summary, general, scope, providers, secret_references]
      properties:
        summary: { type: string, minLength: 3, maxLength: 255 }
        general: { $ref: "#/components/schemas/GeneralConfiguration" }
        scope: { $ref: "#/components/schemas/OperationalScope" }
        scopes:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/OperationalScope" }
        providers:
          type: array
          minItems: 8
          maxItems: 8
          items: { $ref: "#/components/schemas/ProviderConfiguration" }
        secret_references:
          type: array
          items: { $ref: "#/components/schemas/SecretReference" }
    ActivationStatus:
      type: object
      additionalProperties: false
      required: [task_id, revision_id, status]
      properties:
        task_id: { type: string, format: uuid }
        revision_id: { type: string, format: uuid }
        status: { type: string, enum: [ready, running, succeeded, failed] }
        worker_id: { type: string, maxLength: 128 }
        observed_hash: { $ref: "#/components/schemas/SHA256" }
        observed_at: { type: string, format: date-time }
        last_error: { type: string, maxLength: 1024 }
    ConfigurationRevision:
      type: object
      additionalProperties: false
      required: [id, number, hash, summary, general, scope, scopes, providers, secret_references, created_by, created_at, active]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, minimum: 1 }
        hash: { $ref: "#/components/schemas/SHA256" }
        summary: { type: string, maxLength: 255 }
        general: { $ref: "#/components/schemas/GeneralConfiguration" }
        scope: { $ref: "#/components/schemas/OperationalScope" }
        scopes:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/OperationalScope" }
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderConfiguration" }
        secret_references:
          type: array
          items: { $ref: "#/components/schemas/SecretReference" }
        created_by: { type: string, maxLength: 64 }
        created_at: { type: string, format: date-time }
        active: { type: boolean }
        worker_boundary: { $ref: "#/components/schemas/ActivationStatus" }
    ProviderResult:
      type: object
      additionalProperties: false
      required: [provider, state, detail]
      properties:
        provider: { $ref: "#/components/schemas/ProviderIdentity" }
        state: { type: string, enum: [available, partial, unavailable, disabled, not_configured] }
        detail: { type: string, maxLength: 1024 }
        checked_at: { type: string, format: date-time }
    ProviderHealth:
      allOf:
        - { $ref: "#/components/schemas/ProviderResult" }
        - type: object
          required: [updated_at]
          properties:
            configuration_revision_id: { type: string, format: uuid }
            updated_at: { type: string, format: date-time }
    ConfigurationValidation:
      type: object
      additionalProperties: false
      required: [id, draft_hash, valid, errors, provider_results, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        draft_hash: { $ref: "#/components/schemas/SHA256" }
        valid: { type: boolean }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
        provider_results:
          type: array
          items: { $ref: "#/components/schemas/ProviderResult" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    BootstrapDiagnostics:
      type: object
      additionalProperties: false
      required: [listen_boundary, mysql_database, data_directory, worker_management_target, lifecycle]
      properties:
        listen_boundary: { type: string }
        mysql_database: { type: string }
        data_directory: { type: string }
        worker_management_target: { type: string }
        lifecycle: { type: string }
    SettingsSnapshot:
      type: object
      additionalProperties: false
      required: [bootstrap, active_revision, history, provider_health]
      properties:
        bootstrap: { $ref: "#/components/schemas/BootstrapDiagnostics" }
        active_revision: { $ref: "#/components/schemas/ConfigurationRevision" }
        history:
          type: array
          items: { $ref: "#/components/schemas/ConfigurationRevision" }
        provider_health:
          type: array
          items: { $ref: "#/components/schemas/ProviderHealth" }
    BootstrapSnapshot:
      type: object
      additionalProperties: false
      required: [product, contract, active_revision, active_scope, provider_health, scenario_state, capabilities, collected_at]
      properties:
        product: { type: string, const: CloudOps }
        contract: { type: string, const: V1 }
        active_revision: { $ref: "#/components/schemas/ConfigurationRevision" }
        active_scope: { $ref: "#/components/schemas/OperationalScope" }
        provider_health:
          type: array
          items: { $ref: "#/components/schemas/ProviderHealth" }
        scenario_state: { type: string }
        capabilities:
          type: array
          items: { type: string }
        collected_at: { type: string, format: date-time }
    KubernetesProviderState:
      type: string
      enum: [available, partial, unavailable, disabled]
    KubernetesHealthState:
      type: string
      enum: [healthy, warning, critical, unknown]
    KubernetesProviderSource:
      type: object
      additionalProperties: false
      required: [provider, cluster_id, identity, collected_at]
      properties:
        provider: { type: string, const: kubernetes }
        cluster_id: { type: string, maxLength: 128 }
        identity: { type: string, maxLength: 255 }
        server_version: { type: string, maxLength: 128 }
        collected_at: { type: string, format: date-time }
    KubernetesFreshness:
      type: object
