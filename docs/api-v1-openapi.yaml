openapi: 3.1.0
info:
  title: CloudOps API v1
  version: 1.0.0
  description: >-
    Local Owner commands and bounded MySQL-backed CloudOps projections.
    Numeric database identifiers, secrets, leases, checkpoints, and raw prompts
    are never public.
servers:
  - url: /
paths:
  /api/v1/bootstrap:
    get:
      operationId: getBootstrap
      responses:
        "200":
          description: Product capabilities and active operational state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapSnapshot" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/scopes:
    get:
      operationId: listOperationalScopes
      responses:
        "200":
          description: Active Operational Scope page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OperationalScope" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/scopes/{id}/activate:
    post:
      operationId: activateOperationalScope
      description: Atomically select one registered Cluster Scope from the active Configuration Revision.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "200":
          description: Newly active Operational Scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalScope" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/overview:
    get:
      operationId: getOverview
      responses:
        "200":
          description: Overview foundation state and real active-cluster Atlas projection
          content:
            application/json:
              schema:
                type: object
                required: [bootstrap, unread_notifications, atlas]
                properties:
                  bootstrap: { $ref: "#/components/schemas/BootstrapSnapshot" }
                  unread_notifications: { type: integer, minimum: 0 }
                  atlas: { $ref: "#/components/schemas/TopologySnapshot" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/topology:
    get:
      operationId: getKubernetesTopology
      description: Bounded typed topology for the single active cluster and Operational Scope.
      parameters:
        - { $ref: "#/components/parameters/InfrastructureCluster" }
        - { $ref: "#/components/parameters/InfrastructureNamespace" }
        - { $ref: "#/components/parameters/InfrastructureFrom" }
        - { $ref: "#/components/parameters/InfrastructureTo" }
        - { $ref: "#/components/parameters/InfrastructureLimit" }
      responses:
        "200":
          description: Real Kubernetes topology or an explicit structured unavailable state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopologySnapshot" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/topology/events:
    get:
      operationId: streamKubernetesTopologyEvents
      description: Bounded topology refresh hints for the active Operational Scope.
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: string, maxLength: 128 }
        - { $ref: "#/components/parameters/InfrastructureCluster" }
        - { $ref: "#/components/parameters/InfrastructureNamespace" }
        - { $ref: "#/components/parameters/InfrastructureFrom" }
        - { $ref: "#/components/parameters/InfrastructureTo" }
      responses:
        "200":
          description: Topology refresh SSE
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/resources:
    get:
      operationId: listKubernetesResources
      description: Searchable bounded Kubernetes Resource Projections from the current topology snapshot.
      parameters:
        - { $ref: "#/components/parameters/InfrastructureCluster" }
        - { $ref: "#/components/parameters/InfrastructureNamespace" }
        - { $ref: "#/components/parameters/InfrastructureFrom" }
        - { $ref: "#/components/parameters/InfrastructureTo" }
        - { $ref: "#/components/parameters/InfrastructureLimit" }
        - { $ref: "#/components/parameters/InfrastructureCursor" }
        - name: kind
          in: query
          schema:
            type: array
            maxItems: 16
            items: { type: string, maxLength: 64 }
        - name: search
          in: query
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Bounded structured resource page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubernetesResourcePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/resources/{id}:
    parameters:
      - { $ref: "#/components/parameters/KubernetesResourceID" }
    get:
      operationId: getKubernetesResource
      description: Typed resource detail with owners, selectors, endpoints, scheduling, conditions and Context Links.
      parameters:
        - { $ref: "#/components/parameters/InfrastructureCluster" }
        - { $ref: "#/components/parameters/InfrastructureNamespace" }
        - { $ref: "#/components/parameters/InfrastructureFrom" }
        - { $ref: "#/components/parameters/InfrastructureTo" }
      responses:
        "200":
          description: Typed Kubernetes resource detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubernetesResourceDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/resources/{id}/events:
    parameters:
      - { $ref: "#/components/parameters/KubernetesResourceID" }
    get:
      operationId: listKubernetesResourceEvents
      description: Recent bounded Kubernetes Events for one exact Resource Projection.
      parameters:
        - { $ref: "#/components/parameters/InfrastructureCluster" }
        - { $ref: "#/components/parameters/InfrastructureNamespace" }
        - { $ref: "#/components/parameters/InfrastructureFrom" }
        - { $ref: "#/components/parameters/InfrastructureTo" }
        - { $ref: "#/components/parameters/InfrastructureLimit" }
      responses:
        "200":
          description: Bounded Kubernetes Event page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KubernetesEventPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Bootstrap diagnostics and Operational Configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsSnapshot" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/settings/validate:
    post:
      operationId: validateSettings
      description: Local Owner validation of a typed draft and bounded Provider construction.
      parameters:
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigurationDraft" }
      responses:
        "200":
          description: Persisted validation identity and results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigurationValidation" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/configuration-revisions:
    get:
      operationId: listConfigurationRevisions
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Immutable configuration revision history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ConfigurationRevision" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createConfigurationRevision
      description: Local Owner atomic activation of the exact validated draft.
      parameters:
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyConfiguration" }
      responses:
        "201":
          description: Active immutable configuration revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigurationRevision" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/secrets:
    post:
      operationId: createSecretVersion
      description: Local Owner write-only secret version creation; the value is never returned.
      parameters:
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretInput" }
      responses:
        "201":
          description: Secret metadata without the submitted value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretVersion" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/providers/{provider}/tests:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ProviderIdentity" }
    post:
      operationId: testProvider
      description: Local Owner bounded connection test for the submitted Provider configuration.
      parameters:
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderTestRequest" }
      responses:
        "200":
          description: Truthful Provider availability result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/storage-status:
    get:
      operationId: getStorageStatus
      responses:
        "200":
          description: Retention, capacity, and latest backup state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageStatus" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/notifications:
    get:
      operationId: listNotifications
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Durable Owner Notification Inbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/notifications/{id}/read:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    post:
      operationId: readNotification
      description: Local Owner marks one durable notification read.
      parameters:
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "204": { description: Notification marked read }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/notifications/read-all:
    post:
      operationId: readAllNotifications
      description: Local Owner marks unread notifications through an optional current cursor.
      parameters:
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReadAllNotifications" }
      responses:
        "200":
          description: Number of notifications updated
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/notification-events:
    get:
      operationId: streamNotificationEvents
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: string, format: uuid, maxLength: 36 }
      responses:
        "200":
          description: Owner Notification stream with resumable public UUID cursor
          content:
            text/event-stream:
              schema: { type: string }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/incidents:
    get:
      operationId: listIncidents
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/IncidentStatus" }
        - { $ref: "#/components/parameters/IncidentSeverity" }
        - { $ref: "#/components/parameters/IncidentService" }
      responses:
        "200":
          description: Incident page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Incident" }
                  next_cursor: { type: string }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/incidents/{id}:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    get:
      operationId: getIncident
      responses:
        "200":
          description: Incident projection
          content:
            application/json:
              schema:
                type: object
                required: [incident]
                properties:
                  incident: { $ref: "#/components/schemas/Incident" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/incidents/{id}/signals:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    get:
      operationId: listIncidentSignals
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/ResourcePage" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/incidents/{id}/timeline:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    get:
      operationId: listIncidentTimeline
      parameters: [{ $ref: "#/components/parameters/AfterID" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/ResourcePage" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/incidents/{id}/evidence:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    get:
      operationId: listIncidentEvidence
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/ResourcePage" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/incidents/{id}/investigations:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    get:
      operationId: listInvestigations
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/ResourcePage" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: startInvestigation
      description: Local Owner command with optimistic version and durable idempotency fencing.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionedCommand" }
      responses:
        "202": { $ref: "#/components/responses/CommandAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/incidents/{id}/close:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    post:
      operationId: closeIncident
      description: Local Owner command with optimistic version and durable idempotency fencing.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionedCommand" }
      responses:
        "202": { $ref: "#/components/responses/CommandAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/incidents/{id}/remediation-plans:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    get:
      operationId: listRemediationPlans
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/RemediationPlanPage" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/incidents/{id}/delivery:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    get:
      operationId: getDelivery
      responses:
        "200": { $ref: "#/components/responses/DeliveryProjection" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/incidents/{id}/verifications:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    get:
      operationId: listVerifications
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/VerificationRunPage" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/incidents/{id}/resolution-report:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    get:
      operationId: getResolutionReport
      responses:
        "200": { $ref: "#/components/responses/ResolutionReportProjection" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/incidents/{id}/events:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
      - name: Last-Event-ID
        in: header
        schema: { type: string, maxLength: 256 }
    get:
      operationId: streamIncidentEvents
      responses:
        "200":
          description: Incident-scoped refresh hints
          content:
            text/event-stream:
              schema: { type: string }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/remediation-plans/{id}/decisions:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    post:
      operationId: decideRemediation
      description: Local Owner command binding the expected plan version and canonical hash.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionCommand" }
      responses:
        "202": { $ref: "#/components/responses/CommandAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/monitoring/catalog:
    get:
      operationId: getMonitoringCatalog
      description: Guided query catalog and live Prometheus availability for one exact Workload in the active Operational Scope.
      parameters:
        - { $ref: "#/components/parameters/MonitoringCluster" }
        - { $ref: "#/components/parameters/MonitoringNamespace" }
        - { $ref: "#/components/parameters/MonitoringResourceID" }
        - { $ref: "#/components/parameters/MonitoringResourceKind" }
        - { $ref: "#/components/parameters/MonitoringResourceName" }
      responses:
        "200":
          description: Bounded guided catalog with explicit Provider state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringCatalog" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/monitoring/queries:
    get:
      operationId: listMonitoringQueries
      description: Durable bounded Query Execution history; full telemetry results are not retained here.
      parameters:
        - name: cluster_id
          in: query
          schema: { type: string, maxLength: 128 }
        - name: namespace
          in: query
          schema: { type: string, maxLength: 253 }
        - name: resource_id
          in: query
          schema: { type: string, maxLength: 512 }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Query Execution audit history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringExecutionPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: startMonitoringQuery
      description: Local Owner starts one guided or expert query through the shared bounded contract. Actor identity cannot be supplied by the browser.
      parameters:
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartMonitoringQuery" }
      responses:
        "202":
          description: Query Execution accepted for bounded asynchronous execution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryExecution" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/monitoring/queries/{id}:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    get:
      operationId: getMonitoringQuery
      description: Exact Query Execution, live in-process result when available, audit events, and backend-generated Context Links.
      responses:
        "200":
          description: Query Execution projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryExecution" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/monitoring/queries/{id}/cancel:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    post:
      operationId: cancelMonitoringQuery
      description: Local Owner cancels a pending or running Owner or authorized Agent Query Execution.
      parameters:
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "200":
          description: Cancelled Query Execution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryExecution" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/monitoring/query-definitions:
    get:
      operationId: listQueryDefinitions
      description: Immutable-versioned Query Definitions saved from successful Owner executions.
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Query Definition versions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryDefinitionPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: saveQueryDefinition
      description: Local Owner saves a successful Owner Query Execution; editing creates a new immutable version.
      parameters:
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveQueryDefinition" }
      responses:
        "201":
          description: Immutable Query Definition version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryDefinition" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/monitoring/query-authorizations:
    get:
      operationId: listQueryAuthorizations
      description: Owner-managed exact Agent Query Authorizations and revocation state.
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Query Authorization audit list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryAuthorizationPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createQueryAuthorization
      description: Local Owner authorizes either one exact successful execution or one immutable Query Definition version. This does not execute as Agent.
      parameters:
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateQueryAuthorization" }
      responses:
        "201":
          description: Exact revocable Agent Query Authorization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueryAuthorization" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/monitoring/query-authorizations/{id}/revoke:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    post:
      operationId: revokeQueryAuthorization
      description: Local Owner revokes an Agent Query Authorization without rewriting prior execution audit.
      parameters:
        - { $ref: "#/components/parameters/Origin" }
      responses:
        "204": { description: Query Authorization revoked }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/logs/catalog:
    get:
      operationId: getLogsCatalog
      description: Elasticsearch availability and enforced bounds for one exact Workload in the active Operational Scope.
      parameters:
        - { $ref: "#/components/parameters/MonitoringCluster" }
        - { $ref: "#/components/parameters/MonitoringNamespace" }
        - { $ref: "#/components/parameters/MonitoringResourceID" }
        - { $ref: "#/components/parameters/MonitoringResourceKind" }
        - { $ref: "#/components/parameters/MonitoringResourceName" }
      responses:
        "200": { description: Bounded Elasticsearch catalog and Provider state }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/logs/queries:
    get:
      operationId: listLogQueries
      description: Durable Elasticsearch Query Execution metadata; Provider rows are never copied into query history.
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Bounded Logs Query Execution history }
        "400": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: startLogQuery
      description: Local Owner runs one guided or restricted Elasticsearch query through the Worker-owned Provider adapter.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "202": { description: Completed bounded Logs projection and Query Execution metadata }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/logs/queries/{id}:
    parameters: [{ $ref: "#/components/parameters/PublicID" }]
    get:
      operationId: getLogQuery
      description: Exact Logs Query Execution with short-lived in-process rows when still available.
      responses:
        "200": { description: Bounded Logs projection }
        "404": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/logs/queries/{id}/evidence:
    parameters: [{ $ref: "#/components/parameters/PublicID" }]
    post:
      operationId: retainLogEvidence
      description: Persist only explicitly selected, sanitized log facts as Evidence.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [item_ids], properties: { item_ids: { type: array, minItems: 1, maxItems: 32, items: { type: string } } } }
      responses:
        "201": { description: Retained bounded Evidence }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/traces/catalog:
    get:
      operationId: getTracesCatalog
      description: Tempo availability and enforced bounds for one exact Workload in the active Operational Scope.
      parameters:
        - { $ref: "#/components/parameters/MonitoringCluster" }
        - { $ref: "#/components/parameters/MonitoringNamespace" }
        - { $ref: "#/components/parameters/MonitoringResourceID" }
        - { $ref: "#/components/parameters/MonitoringResourceKind" }
        - { $ref: "#/components/parameters/MonitoringResourceName" }
      responses:
        "200": { description: Bounded Tempo catalog and Provider state }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/traces/searches:
    get:
      operationId: listTraceSearches
      description: Durable Tempo Query Execution metadata; full Trace results are not retained in query history.
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Bounded Trace Search history }
        "400": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: startTraceSearch
      description: Local Owner runs one guided or bounded TraceQL search through the Worker-owned Provider adapter.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "202": { description: Completed bounded Trace Search projection and Query Execution metadata }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/traces/searches/{id}:
    parameters: [{ $ref: "#/components/parameters/PublicID" }]
    get:
      operationId: getTraceSearch
      description: Exact Trace Search with short-lived in-process summaries when still available.
      responses:
        "200": { description: Bounded Trace Search projection }
        "404": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/traces/{trace_id}:
    get:
      operationId: getTraceDetail
      description: Bounded Tempo Trace detail revalidated against the requested Kubernetes resource and time range.
      parameters:
        - name: trace_id
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{32}$" }
      responses:
        "200": { description: Bounded Trace waterfall and span projection }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/traces/searches/{id}/traces/{trace_id}/evidence:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
      - name: trace_id
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9a-f]{32}$" }
    post:
      operationId: retainTraceEvidence
      description: Persist only explicitly selected, sanitized spans as Evidence.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [item_ids], properties: { item_ids: { type: array, minItems: 1, maxItems: 32, items: { type: string } } } }
      responses:
        "201": { description: Retained bounded Trace Evidence }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/agent/consultations:
    post:
      operationId: createTelemetryConsultation
      description: Local Owner creates a Consultation with one immutable Context Snapshot from exact query and Evidence references.
      parameters: [{ $ref: "#/components/parameters/Origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: Consultation and immutable initial Context Snapshot }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
components:
  parameters:
    PublicID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid, minLength: 36, maxLength: 36 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 256 }
    AfterID:
      name: after_id
      in: query
      schema: { type: string, maxLength: 256 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    IncidentStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [detected, investigating, awaiting_approval, delivering, verifying, resolved, closed]
    IncidentSeverity:
      name: severity
      in: query
      schema: { type: string, enum: [unknown, info, warning, critical] }
    IncidentService:
      name: service
      in: query
      schema: { type: string, maxLength: 255 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string, format: uri, maxLength: 2048 }
    KubernetesResourceID:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^k8s_[A-Za-z0-9_-]+$", maxLength: 512 }
    InfrastructureCluster:
      name: cluster
      in: query
      schema: { type: string, maxLength: 128 }
    InfrastructureNamespace:
      name: namespace
      in: query
      schema: { type: string, maxLength: 253 }
    InfrastructureFrom:
      name: from
      in: query
      schema: { type: string, format: date-time }
    InfrastructureTo:
      name: to
      in: query
      schema: { type: string, format: date-time }
    InfrastructureLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
    InfrastructureCursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 2048 }
    MonitoringCluster:
      name: cluster_id
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    MonitoringNamespace:
      name: namespace
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 253 }
    MonitoringResourceID:
      name: resource_id
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 512 }
    MonitoringResourceKind:
      name: resource_kind
      in: query
      required: true
      schema: { type: string, enum: [Deployment, StatefulSet, DaemonSet] }
    MonitoringResourceName:
      name: resource_name
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 253 }
  schemas:
    ProviderIdentity:
      type: string
      enum: [llm, kubernetes, prometheus, alertmanager, elasticsearch, tempo, github, argocd]
    GeneralConfiguration:
      type: object
      additionalProperties: false
      required: [query_max_lookback_seconds, query_max_results, telemetry_retention_days, browser_notifications_enabled, automatic_escalation_enabled]
      properties:
        query_max_lookback_seconds: { type: integer, minimum: 60, maximum: 2592000 }
        query_max_results: { type: integer, minimum: 1, maximum: 10000 }
        telemetry_retention_days: { type: integer, minimum: 1, maximum: 365 }
        browser_notifications_enabled: { type: boolean }
        automatic_escalation_enabled: { type: boolean, const: false }
    OperationalScope:
      type: object
      additionalProperties: false
      required: [name, cluster_id, environment, namespaces]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 128 }
        cluster_id: { type: string, minLength: 1, maxLength: 128 }
        environment: { type: string, minLength: 1, maxLength: 64 }
        namespaces:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 253 }
        configuration_revision_id: { type: string, format: uuid }
        configuration_revision_hash: { $ref: "#/components/schemas/SHA256" }
        active: { type: boolean }
    ProviderConfiguration:
      type: object
      additionalProperties: false
      required: [provider, enabled, endpoint, model, timeout_ms, max_results, context_link_base]
      properties:
        provider: { $ref: "#/components/schemas/ProviderIdentity" }
        enabled: { type: boolean }
        endpoint: { type: string, maxLength: 2048 }
        model: { type: string, maxLength: 255 }
        timeout_ms: { type: integer, minimum: 1000, maximum: 60000 }
        max_results: { type: integer, minimum: 1, maximum: 10000 }
        context_link_base: { type: string, maxLength: 2048 }
    SecretReference:
      type: object
      additionalProperties: false
      required: [provider, purpose, secret_version_id]
      properties:
        provider: { $ref: "#/components/schemas/ProviderIdentity" }
        purpose: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
        secret_version_id: { type: string, format: uuid }
        state: { type: string, enum: [configured, invalid] }
        fingerprint: { type: string, pattern: "^[0-9a-f]{20}$" }
    ConfigurationDraft:
      type: object
      additionalProperties: false
      required: [summary, general, scope, providers, secret_references]
      properties:
        summary: { type: string, minLength: 3, maxLength: 255 }
        general: { $ref: "#/components/schemas/GeneralConfiguration" }
        scope: { $ref: "#/components/schemas/OperationalScope" }
        scopes:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/OperationalScope" }
        providers:
          type: array
          minItems: 8
          maxItems: 8
          items: { $ref: "#/components/schemas/ProviderConfiguration" }
        secret_references:
          type: array
          items: { $ref: "#/components/schemas/SecretReference" }
    ActivationStatus:
      type: object
      additionalProperties: false
      required: [task_id, revision_id, status]
      properties:
        task_id: { type: string, format: uuid }
        revision_id: { type: string, format: uuid }
        status: { type: string, enum: [ready, running, succeeded, failed] }
        worker_id: { type: string, maxLength: 128 }
        observed_hash: { $ref: "#/components/schemas/SHA256" }
        observed_at: { type: string, format: date-time }
        last_error: { type: string, maxLength: 1024 }
    ConfigurationRevision:
      type: object
      additionalProperties: false
      required: [id, number, hash, summary, general, scope, scopes, providers, secret_references, created_by, created_at, active]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, minimum: 1 }
        hash: { $ref: "#/components/schemas/SHA256" }
        summary: { type: string, maxLength: 255 }
        general: { $ref: "#/components/schemas/GeneralConfiguration" }
        scope: { $ref: "#/components/schemas/OperationalScope" }
        scopes:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/OperationalScope" }
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderConfiguration" }
        secret_references:
          type: array
          items: { $ref: "#/components/schemas/SecretReference" }
        created_by: { type: string, maxLength: 64 }
        created_at: { type: string, format: date-time }
        active: { type: boolean }
        worker_boundary: { $ref: "#/components/schemas/ActivationStatus" }
    ProviderResult:
      type: object
      additionalProperties: false
      required: [provider, state, detail]
      properties:
        provider: { $ref: "#/components/schemas/ProviderIdentity" }
        state: { type: string, enum: [available, partial, unavailable, disabled, not_configured] }
        detail: { type: string, maxLength: 1024 }
        checked_at: { type: string, format: date-time }
    ProviderHealth:
      allOf:
        - { $ref: "#/components/schemas/ProviderResult" }
        - type: object
          required: [updated_at]
          properties:
            configuration_revision_id: { type: string, format: uuid }
            updated_at: { type: string, format: date-time }
    ConfigurationValidation:
      type: object
      additionalProperties: false
      required: [id, draft_hash, valid, errors, provider_results, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        draft_hash: { $ref: "#/components/schemas/SHA256" }
        valid: { type: boolean }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
        provider_results:
          type: array
          items: { $ref: "#/components/schemas/ProviderResult" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    BootstrapDiagnostics:
      type: object
      additionalProperties: false
      required: [listen_boundary, mysql_database, data_directory, worker_management_target, lifecycle]
      properties:
        listen_boundary: { type: string }
        mysql_database: { type: string }
        data_directory: { type: string }
        worker_management_target: { type: string }
        lifecycle: { type: string }
    SettingsSnapshot:
      type: object
      additionalProperties: false
      required: [bootstrap, active_revision, history, provider_health]
      properties:
        bootstrap: { $ref: "#/components/schemas/BootstrapDiagnostics" }
        active_revision: { $ref: "#/components/schemas/ConfigurationRevision" }
        history:
          type: array
          items: { $ref: "#/components/schemas/ConfigurationRevision" }
        provider_health:
          type: array
          items: { $ref: "#/components/schemas/ProviderHealth" }
    BootstrapSnapshot:
      type: object
      additionalProperties: false
      required: [product, contract, active_revision, active_scope, provider_health, scenario_state, capabilities, collected_at]
      properties:
        product: { type: string, const: CloudOps }
        contract: { type: string, const: V1 }
        active_revision: { $ref: "#/components/schemas/ConfigurationRevision" }
        active_scope: { $ref: "#/components/schemas/OperationalScope" }
        provider_health:
          type: array
          items: { $ref: "#/components/schemas/ProviderHealth" }
        scenario_state: { type: string }
        capabilities:
          type: array
          items: { type: string }
        collected_at: { type: string, format: date-time }
    KubernetesProviderState:
      type: string
      enum: [available, partial, unavailable, disabled]
    KubernetesHealthState:
      type: string
      enum: [healthy, warning, critical, unknown]
    KubernetesProviderSource:
      type: object
      additionalProperties: false
      required: [provider, cluster_id, identity, collected_at]
      properties:
        provider: { type: string, const: kubernetes }
        cluster_id: { type: string, maxLength: 128 }
        identity: { type: string, maxLength: 255 }
        server_version: { type: string, maxLength: 128 }
        collected_at: { type: string, format: date-time }
    KubernetesFreshness:
      type: object
      additionalProperties: false
      required: [state, fresh_until, age_seconds]
      properties:
        state: { type: string, enum: [fresh, stale, unavailable] }
        fresh_until: { type: string, format: date-time }
