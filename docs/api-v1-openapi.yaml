        attempt: { type: integer, minimum: 0 }
        external_effect_started_at: { type: string, format: date-time }
        result: { type: object }
        failure_code: { type: string }
        failure_summary: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        events: { type: array, items: { $ref: "#/components/schemas/OperationAuditEvent" } }
        verification: { $ref: "#/components/schemas/OperationVerificationObservation" }
        links: { type: array, items: { $ref: "#/components/schemas/OperationContextLink" } }
    DevOpsWorkspace:
      type: object
      description: Durable DevOps projection. Operation Plan and Action Card objects retain their Agent authority schema.
      required: [operation_plans, action_cards, executions, change_freezes, change_candidates, deployment_baselines, deliveries, providers, collected_at]
      properties:
        operation_plans: { type: array, items: { $ref: "#/components/schemas/OperationPlan" } }
        action_cards: { type: array, items: { type: object } }
        executions: { type: array, items: { $ref: "#/components/schemas/OperationExecution" } }
        change_freezes: { type: array, items: { $ref: "#/components/schemas/ChangeFreezeState" } }
        change_candidates: { type: array, items: { type: object } }
        deployment_baselines: { type: array, items: { type: object } }
        deliveries: { type: array, items: { type: object } }
        providers: { type: array, items: { type: object } }
        collected_at: { type: string, format: date-time }
    ChangeFreezeState:
      type: object
      additionalProperties: false
      required: [target, enabled, reason, row_version]
      properties:
        target: { $ref: "#/components/schemas/OperationTarget" }
        enabled: { type: boolean }
        reason: { type: string }
        row_version: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
    CommandResult:
      type: object
      additionalProperties: false
      required: [id, command, status]
      properties:
        id: { type: string, format: uuid }
        command: { type: string }
        status: { type: string }
        version: { type: integer, minimum: 1 }
        cycle: { type: integer, minimum: 1 }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, request_id, trace_id, next_steps]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        request_id: { type: string }
        trace_id: { type: string }
        next_steps:
          type: array
          minItems: 1
          items: { type: string }
  responses:
    IncidentAlertRelationPage:
      description: Bounded current-cycle Alert relation page with provenance
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                maxItems: 100
                items: { $ref: "#/components/schemas/IncidentAlertRelation" }
              next_cursor: { type: string, format: uuid }
    IncidentTimelinePage:
      description: Bounded current-cycle Incident timeline page
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                maxItems: 100
                items: { $ref: "#/components/schemas/IncidentTimelineEvent" }
              next_cursor: { type: string, format: uuid }
    IncidentEvidencePage:
      description: Bounded current-cycle attributable Evidence page
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                maxItems: 100
                items: { $ref: "#/components/schemas/IncidentEvidence" }
              next_cursor: { type: string, format: uuid }
    IncidentInvestigationPage:
      description: Bounded current-cycle Agent Investigation page
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                maxItems: 100
                items: { $ref: "#/components/schemas/IncidentInvestigation" }
              next_cursor: { type: string, format: uuid }
    IncidentDecisionProjection:
      description: Current-cycle decision projection; decision is null before one exists
      content:
        application/json:
          schema:
            type: object
            required: [decision]
            properties:
              decision:
                allOf: [{ $ref: "#/components/schemas/IncidentDecision" }]
                nullable: true
    ResourcePage:
      description: Bounded resource page
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items: { $ref: "#/components/schemas/Resource" }
              next_cursor: { type: string }
    Resource:
      description: Bounded resource projection
      content:
        application/json:
          schema:
            type: object
            required: [resource]
            properties:
              resource: { $ref: "#/components/schemas/Resource" }
    RemediationPlanPage:
      description: Bounded current-cycle remediation plan page
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                maxItems: 100
                items: { $ref: "#/components/schemas/RemediationPlan" }
              next_cursor: { type: string, format: uuid }
    DeliveryProjection:
      description: Latest current-cycle delivery projection; resource is null before delivery exists
      content:
        application/json:
          schema:
            type: object
            required: [resource]
            properties:
              resource:
                allOf: [{ $ref: "#/components/schemas/Delivery" }]
                nullable: true
    VerificationRunPage:
      description: Bounded current-cycle verification run page with nested checks and samples
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                maxItems: 100
                items: { $ref: "#/components/schemas/VerificationRun" }
              next_cursor: { type: string, format: uuid }
    ResolutionReportProjection:
      description: Immutable current-cycle ResolutionReport projection; resource is null before resolution
      content:
        application/json:
          schema:
            type: object
            required: [resource]
            properties:
              resource:
                allOf: [{ $ref: "#/components/schemas/ResolutionReport" }]
                nullable: true
    CommandAccepted:
      description: Command persisted and queued
      headers:
        X-Request-ID: { schema: { type: string } }
        X-Trace-ID: { schema: { type: string } }
        Idempotent-Replay: { schema: { type: string, enum: ["true"] } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CommandResult" }
    Problem:
      description: Stable problem response
      headers:
        X-Request-ID: { schema: { type: string } }
        X-Trace-ID: { schema: { type: string } }
        Idempotent-Replay: { schema: { type: string, enum: ["true"] } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
