apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatops-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatops-server
  template:
    metadata:
      labels:
        app: chatops-server
    spec:
      serviceAccountName: chatops-sa
      containers:
        - name: chatops-server
          image: chatops-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: chatops-config
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chatops-secret
                  key: LLM_API_KEY
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatops-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatops-redis
  template:
    metadata:
      labels:
        app: chatops-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
