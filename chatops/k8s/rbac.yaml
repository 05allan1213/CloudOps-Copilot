apiVersion: v1
kind: ServiceAccount
metadata:
  name: chatops-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chatops-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chatops-reader-binding
subjects:
  - kind: ServiceAccount
    name: chatops-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: chatops-reader
  apiGroup: rbac.authorization.k8s.io
