apiVersion: v1
kind: Service
metadata:
  name: chatops-server
spec:
  selector:
    app: chatops-server
  ports:
    - port: 8080
      targetPort: 8080
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: chatops-redis
spec:
  selector:
    app: chatops-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
