<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatOps 智能运维助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #16213e;
            padding: 16px 24px;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 {
            font-size: 18px;
            color: #00d4ff;
        }
        .header span {
            font-size: 13px;
            color: #888;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #0f3460;
            color: #e0e0e0;
            border-bottom-right-radius: 4px;
        }
        .message.bot {
            align-self: flex-start;
            background: #222244;
            color: #d0d0d0;
            border-bottom-left-radius: 4px;
        }
        .message.bot .label, .message.user .label {
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
        }
        .input-area {
            background: #16213e;
            padding: 16px 24px;
            border-top: 1px solid #0f3460;
            display: flex;
            gap: 12px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #0f3460;
            border-radius: 8px;
            background: #1a1a2e;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
        }
        .input-area input:focus {
            border-color: #00d4ff;
        }
        .input-area button {
            padding: 12px 24px;
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .input-area button:hover {
            background: #00b8d9;
        }
        .input-area button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        .typing { opacity: 0.6; font-style: italic; }
    </style>
</head>
<body>
    <div class="header">
        <h1>ChatOps 智能运维助手</h1>
        <span>自然语言查询 K8s 集群状态和监控指标</span>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message bot">
            <div class="label">运维助手</div>
            你好！我是 ChatOps 智能运维助手。你可以用自然语言查询集群状态，例如：
- "当前有几个 Pod 在运行？"
- "CPU 使用率最高的服务是哪个？"
- "查看所有 Deployment 状态"
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="输入你的运维问题..." autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>

    <script>
        let sessionId = '';

        document.getElementById('msgInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const btn = document.getElementById('sendBtn');
            const msg = input.value.trim();
            if (!msg) return;

            appendMessage('user', msg);
            input.value = '';
            btn.disabled = true;

            // 显示"正在思考"
            const typingEl = appendMessage('bot', '正在思考...', true);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg, session_id: sessionId })
                });
                const data = await res.json();
                if (data.error) {
                    typingEl.textContent = '出错了：' + data.error;
                    typingEl.classList.remove('typing');
                } else {
                    sessionId = data.session_id;
                    typingEl.innerHTML = '<div class="label">运维助手</div>' + escapeHtml(data.reply);
                    typingEl.classList.remove('typing');
                }
            } catch (err) {
                typingEl.textContent = '网络错误，请稍后重试';
                typingEl.classList.remove('typing');
            }
            btn.disabled = false;
            input.focus();
        }

        function appendMessage(role, text, isTyping) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = 'message ' + role;
            if (isTyping) div.classList.add('typing');
            if (role === 'user') {
                div.innerHTML = '<div class="label">你</div>' + escapeHtml(text);
            } else {
                div.innerHTML = '<div class="label">运维助手</div>' + escapeHtml(text);
            }
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }
    </script>
</body>
</html>
