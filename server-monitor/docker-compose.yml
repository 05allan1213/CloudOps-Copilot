# ============================================
# Docker Compose 编排配置
# ============================================
# 启动命令: docker compose up -d
# 停止命令: docker compose down
# 查看日志: docker compose logs -f
# ============================================

name: server-monitor

x-app-service: &app-service
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-observability-env: &observability-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TRACE_OTLP_ENDPOINT: ${TRACE_OTLP_ENDPOINT:-jaeger:4317}
  TRACE_SAMPLE_RATE: ${TRACE_SAMPLE_RATE:-1.0}

services:
  # ------------------------------------------
  # Redis 缓存与 Pub/Sub
  # ------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-server-monitor-local-redis}
      - --appendonly
      - "yes"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-server-monitor-local-redis}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD:-server-monitor-local-redis}\" redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M

  # ------------------------------------------
  # MySQL 业务数据存储
  # ------------------------------------------
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-server-monitor-local-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-server_monitor}
      MYSQL_USER: ${MYSQL_USER:-server_monitor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-server-monitor-local-mysql}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # ------------------------------------------
  # Jaeger 链路追踪
  # ------------------------------------------
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.17.0
    restart: unless-stopped
    command: ["--config=file:/etc/jaeger/jaeger.yaml"]
    volumes:
      - ./docker/jaeger/jaeger.yaml:/etc/jaeger/jaeger.yaml:ro
    ports:
      - "127.0.0.1:${JAEGER_UI_HOST_PORT:-16686}:16686"
      - "127.0.0.1:${OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_HOST_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:16686/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # ------------------------------------------
  # server-probe 监控探针
  # ------------------------------------------
  server-probe:
    profiles: ["legacy-demo-support"]
    image: server-monitor/server-probe:local
    build:
      context: .
      dockerfile: server-probe/Dockerfile
      target: runtime
    <<: *app-service
    ports:
      - "127.0.0.1:${SERVER_PROBE_HOST_PORT:-8082}:9090"
    environment:
      <<: *observability-env
      LISTEN_ADDR: ":9090"
      HOST_PROC: ${HOST_PROC:-/host/proc}
      HOST_SYS: ${HOST_SYS:-/host/sys}
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    depends_on:
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M

  # ------------------------------------------
  # Prometheus 监控服务
  # ------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - ./docker/custom-alerts.yml:/etc/prometheus/rules/custom-alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=6h"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  # ------------------------------------------
  # VictoriaMetrics 长期指标存储
  # ------------------------------------------
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - victoriametrics-data:/victoria-metrics-data
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--retentionPeriod=90d"
      - "--httpListenAddr=:8428"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8428/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # ------------------------------------------
  # Kafka 事件总线 (KRaft 模式，无 ZooKeeper)
  # ------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G

  # ------------------------------------------
  # Kafka Topic 初始化
  # ------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    restart: "no"
    environment:
      KAFKA_HEAP_OPTS: "-Xms64M -Xmx128M"
    depends_on:
      kafka:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Kafka to be ready..."
        until kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
          sleep 2
        done
        echo "Creating topics..."
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic alert-events --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic operation-events --partitions 3 --replication-factor 1
        echo "Topics created."
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 256M

  # ------------------------------------------
  # alert-service 告警事件消费与状态管理
  # ------------------------------------------
  alert-service:
    profiles: ["legacy-demo-support"]
    image: server-monitor/alert-service:local
    build:
      context: .
      dockerfile: alert-service/Dockerfile
      target: runtime
    <<: *app-service
    ports:
      - "127.0.0.1:${ALERT_SERVICE_HOST_PORT:-8081}:8081"
    environment:
      LISTEN_ADDR: ":8081"
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-alert-service}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-server-monitor-local-redis}
      <<: *observability-env
    depends_on:
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M

  # ------------------------------------------
  # AlertManager 告警管理
  # ------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ./docker/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 256M

  # ------------------------------------------
  # Grafana 可视化大盘
  # ------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-server-monitor-local-grafana}
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ------------------------------------------
  # Elasticsearch 日志存储
  # ------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.name: sm-logs
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2G

  # ------------------------------------------
  # Elasticsearch 日志索引初始化
  # ------------------------------------------
  elasticsearch-init:
    image: curlimages/curl:8.8.0
    restart: "no"
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ILM_POLICY_NAME: sm-logs-policy
      INDEX_TEMPLATE_NAME: sm-logs-template
    volumes:
      - ./docker/elasticsearch:/init:ro
    entrypoint: ["/bin/sh", "/init/init.sh"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M

  # ------------------------------------------
  # Kibana 日志查询
  # ------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G

  # ------------------------------------------
  # Fluent Bit 日志采集
  # ------------------------------------------
  fluent-bit:
    image: fluent/fluent-bit:3.1.4
    restart: unless-stopped
    volumes:
      - ./docker/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./docker/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ${DOCKER_CONTAINER_LOG_PATH:-/var/lib/docker/containers}:/var/log/docker:ro
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/fluent-bit/bin/fluent-bit", "--version"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M

  # ------------------------------------------
  # server-web Web 展示服务
  # ------------------------------------------
  server-web:
    image: server-monitor/server-web:local
    build:
      context: .
      dockerfile: server-web/Dockerfile
      target: runtime
    <<: *app-service
    ports:
      - "127.0.0.1:${SERVER_WEB_HOST_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      FAST_DEMO_ENABLED: ${FAST_DEMO_ENABLED:-false}
      FAST_DEMO_CONFIRM_DISPOSABLE: ${FAST_DEMO_CONFIRM_DISPOSABLE:-false}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      INCIDENT_AGGREGATION_WINDOW_SECONDS: ${INCIDENT_AGGREGATION_WINDOW_SECONDS:-14400}
      CHANGE_INTELLIGENCE_ENABLED: ${CHANGE_INTELLIGENCE_ENABLED:-false}
      CHANGE_LOOKBACK: ${CHANGE_LOOKBACK:-86400}
      CHANGE_MAX_CANDIDATES: ${CHANGE_MAX_CANDIDATES:-10}
      CHANGE_SERVICE_MAPPINGS_JSON: ${CHANGE_SERVICE_MAPPINGS_JSON:-{}}
      GITHUB_ENABLED: ${GITHUB_ENABLED:-false}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-0}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-0}
      GITHUB_PRIVATE_KEY_FILE: ${GITHUB_PRIVATE_KEY_FILE:-}
      GITHUB_TOKEN_FILE: ${GITHUB_TOKEN_FILE:-}
      GITHUB_ALLOWED_OWNERS: ${GITHUB_ALLOWED_OWNERS:-}
      GITHUB_ALLOWED_REPOSITORIES: ${GITHUB_ALLOWED_REPOSITORIES:-}
      GITHUB_ALLOWED_BRANCHES: ${GITHUB_ALLOWED_BRANCHES:-}
      GITHUB_ALLOWED_PATHS: ${GITHUB_ALLOWED_PATHS:-}
      GITHUB_DENIED_PATH_PATTERNS: ${GITHUB_DENIED_PATH_PATTERNS:-}
      GITHUB_MAX_DIFF_FILES: ${GITHUB_MAX_DIFF_FILES:-100}
      GITHUB_MAX_DIFF_BYTES: ${GITHUB_MAX_DIFF_BYTES:-131072}
      GITHUB_TIMEOUT: ${GITHUB_TIMEOUT:-10}
      GITHUB_MAX_RETRIES: ${GITHUB_MAX_RETRIES:-1}
      ARGOCD_ENABLED: ${ARGOCD_ENABLED:-false}
      ARGOCD_SERVER: ${ARGOCD_SERVER:-}
      ARGOCD_TOKEN_FILE: ${ARGOCD_TOKEN_FILE:-}
      ARGOCD_ALLOWED_APPLICATIONS: ${ARGOCD_ALLOWED_APPLICATIONS:-}
      ARGOCD_ALLOWED_PROJECTS: ${ARGOCD_ALLOWED_PROJECTS:-}
      ARGOCD_TIMEOUT: ${ARGOCD_TIMEOUT:-10}
      ARGOCD_MAX_RESOURCES: ${ARGOCD_MAX_RESOURCES:-100}
      ARGOCD_MAX_DIFF_BYTES: ${ARGOCD_MAX_DIFF_BYTES:-131072}
      IMAGE_REVISION_REQUIRED: ${IMAGE_REVISION_REQUIRED:-false}
      IMAGE_ALLOWED_REGISTRIES: ${IMAGE_ALLOWED_REGISTRIES:-}
      REGISTRY_METADATA_ENABLED: ${REGISTRY_METADATA_ENABLED:-false}
      REGISTRY_BASE_URL: ${REGISTRY_BASE_URL:-}
      REGISTRY_ALLOWED_HOSTS: ${REGISTRY_ALLOWED_HOSTS:-}
      REGISTRY_ALLOWED_REPOSITORIES: ${REGISTRY_ALLOWED_REPOSITORIES:-}
      REGISTRY_ALLOWED_AUTH_REALM_HOSTS: ${REGISTRY_ALLOWED_AUTH_REALM_HOSTS:-}
      REGISTRY_ALLOWED_REDIRECT_HOSTS: ${REGISTRY_ALLOWED_REDIRECT_HOSTS:-}
      OCI_ALLOWED_SOURCE_REPOSITORIES: ${OCI_ALLOWED_SOURCE_REPOSITORIES:-}
      REGISTRY_BEARER_TOKEN_FILE: ${REGISTRY_BEARER_TOKEN_FILE:-}
      REGISTRY_USERNAME_FILE: ${REGISTRY_USERNAME_FILE:-}
      REGISTRY_PASSWORD_FILE: ${REGISTRY_PASSWORD_FILE:-}
      REGISTRY_TIMEOUT: ${REGISTRY_TIMEOUT:-10}
      REGISTRY_MAX_RETRIES: ${REGISTRY_MAX_RETRIES:-1}
      REGISTRY_MANIFEST_MAX_BYTES: ${REGISTRY_MANIFEST_MAX_BYTES:-4194304}
      REGISTRY_CONFIG_MAX_BYTES: ${REGISTRY_CONFIG_MAX_BYTES:-1048576}
      REGISTRY_CACHE_TTL_SECONDS: ${REGISTRY_CACHE_TTL_SECONDS:-300}
      REGISTRY_CACHE_MAX_ITEMS: ${REGISTRY_CACHE_MAX_ITEMS:-256}
      REMEDIATION_ENABLED: ${REMEDIATION_ENABLED:-false}
      GITOPS_PR_ENABLED: ${GITOPS_PR_ENABLED:-false}
      GITHUB_WRITE_ENABLED: ${GITHUB_WRITE_ENABLED:-false}
      REMEDIATION_ALLOWED_OPERATIONS: ${REMEDIATION_ALLOWED_OPERATIONS:-rollback_image,set_replicas}
      REMEDIATION_MAX_PATCH_BYTES: ${REMEDIATION_MAX_PATCH_BYTES:-16384}
      REMEDIATION_MAX_FILES: ${REMEDIATION_MAX_FILES:-1}
      REMEDIATION_MAX_RISK: ${REMEDIATION_MAX_RISK:-medium}
      REMEDIATION_MIN_REPLICAS: ${REMEDIATION_MIN_REPLICAS:-1}
      REMEDIATION_MAX_REPLICAS: ${REMEDIATION_MAX_REPLICAS:-20}
      REMEDIATION_HPA_TARGETS: ${REMEDIATION_HPA_TARGETS:-}
      GITOPS_BASE_BRANCHES_JSON: ${GITOPS_BASE_BRANCHES_JSON:-{}}
      GITHUB_WRITE_API_BASE_URL: ${GITHUB_WRITE_API_BASE_URL:-https://api.github.com}
      GITHUB_WRITE_APP_ID: ${GITHUB_WRITE_APP_ID:-0}
      GITHUB_WRITE_INSTALLATION_ID: ${GITHUB_WRITE_INSTALLATION_ID:-0}
      GITHUB_WRITE_PRIVATE_KEY_FILE: ${GITHUB_WRITE_PRIVATE_KEY_FILE:-}
      GITHUB_WRITE_TOKEN_FILE: ${GITHUB_WRITE_TOKEN_FILE:-}
      GITHUB_WRITE_ALLOWED_REPOSITORIES: ${GITHUB_WRITE_ALLOWED_REPOSITORIES:-}
      GITHUB_WRITE_ALLOWED_BASE_BRANCHES: ${GITHUB_WRITE_ALLOWED_BASE_BRANCHES:-}
      GITHUB_WRITE_ALLOWED_PATHS: ${GITHUB_WRITE_ALLOWED_PATHS:-}
      GITHUB_WRITE_TIMEOUT_SECONDS: ${GITHUB_WRITE_TIMEOUT_SECONDS:-10}
      GITHUB_WRITE_MAX_RESPONSE_BYTES: ${GITHUB_WRITE_MAX_RESPONSE_BYTES:-1048576}
      GITHUB_WRITE_MAX_CONTENT_BYTES: ${GITHUB_WRITE_MAX_CONTENT_BYTES:-131072}
      REMEDIATION_WORKER_ID: ${REMEDIATION_WORKER_ID:-server-web-remediation-worker}
      REMEDIATION_POLL_INTERVAL_MILLISECONDS: ${REMEDIATION_POLL_INTERVAL_MILLISECONDS:-1000}
      REMEDIATION_LEASE_SECONDS: ${REMEDIATION_LEASE_SECONDS:-30}
      DELIVERY_TRACKING_ENABLED: ${DELIVERY_TRACKING_ENABLED:-false}
      VERIFICATION_ENABLED: ${VERIFICATION_ENABLED:-false}
      DELIVERY_WORKER_ID: ${DELIVERY_WORKER_ID:-server-web-delivery-worker}
      VERIFICATION_WORKER_ID: ${VERIFICATION_WORKER_ID:-server-web-verification-worker}
      DELIVERY_POLL_INTERVAL_SECONDS: ${DELIVERY_POLL_INTERVAL_SECONDS:-10}
      DELIVERY_TIMEOUT_SECONDS: ${DELIVERY_TIMEOUT_SECONDS:-3600}
      VERIFICATION_TIMEOUT_SECONDS: ${VERIFICATION_TIMEOUT_SECONDS:-1800}
      VERIFICATION_STABILITY_WINDOW_SECONDS: ${VERIFICATION_STABILITY_WINDOW_SECONDS:-120}
      VERIFICATION_LEASE_SECONDS: ${VERIFICATION_LEASE_SECONDS:-30}
      VERIFICATION_MAX_ATTEMPTS: ${VERIFICATION_MAX_ATTEMPTS:-180}
      VERIFICATION_PROFILES_JSON: '${VERIFICATION_PROFILES_JSON:-{"profiles":[]}}'
      OBSERVABILITY_PROMETHEUS_URL: ${OBSERVABILITY_PROMETHEUS_URL:-https://prometheus.invalid}
      OBSERVABILITY_LOKI_URL: ${OBSERVABILITY_LOKI_URL:-https://loki.invalid}
      OBSERVABILITY_TEMPO_URL: ${OBSERVABILITY_TEMPO_URL:-https://tempo.invalid}
      OBSERVABILITY_PROMETHEUS_TOKEN_FILE: ${OBSERVABILITY_PROMETHEUS_TOKEN_FILE:-}
      OBSERVABILITY_LOKI_TOKEN_FILE: ${OBSERVABILITY_LOKI_TOKEN_FILE:-}
      OBSERVABILITY_TEMPO_TOKEN_FILE: ${OBSERVABILITY_TEMPO_TOKEN_FILE:-}
      OBSERVABILITY_LOKI_TENANT: ${OBSERVABILITY_LOKI_TENANT:-}
      OBSERVABILITY_REQUEST_TIMEOUT_SECONDS: ${OBSERVABILITY_REQUEST_TIMEOUT_SECONDS:-10}
      OBSERVABILITY_MAX_LOOKBACK_SECONDS: ${OBSERVABILITY_MAX_LOOKBACK_SECONDS:-3600}
      OBSERVABILITY_MAX_RESPONSE_BYTES: ${OBSERVABILITY_MAX_RESPONSE_BYTES:-262144}
      OBSERVABILITY_MAX_SAMPLES: ${OBSERVABILITY_MAX_SAMPLES:-1000}
