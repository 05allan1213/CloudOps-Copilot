      <<: *observability-env
    volumes:
      - ./docker/custom-alerts.yml:/etc/server-monitor/rules/custom-alerts.yml
      - ./runbooks:/app/runbooks:ro
      - ${REGISTRY_CREDENTIALS_DIR:-./docker/registry-credentials}:/var/run/secrets/cloudops/registry:ro
      - ${GITHUB_WRITE_CREDENTIALS_DIR:-./docker/github-write-credentials}:/var/run/secrets/cloudops/github-write:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 256M

volumes:
  redis-data:
  mysql-data:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
  victoriametrics-data:
  kafka-data:
