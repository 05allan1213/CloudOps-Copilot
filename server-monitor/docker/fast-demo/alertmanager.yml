global:
  resolve_timeout: 10s

route:
  group_by: ["alertname", "deployment"]
  group_wait: 1s
  group_interval: 2s
  repeat_interval: 1m
  receiver: cloudops-demo

receivers:
  - name: cloudops-demo
    webhook_configs:
      - url: http://server-web:8080/api/v2/webhook/alertmanager
        send_resolved: true
