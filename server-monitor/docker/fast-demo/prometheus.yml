global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/rules/fast-demo-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: server-probe
    static_configs:
      - targets: ["server-probe:9090"]
  - job_name: server-web
    static_configs:
      - targets: ["server-web:8080"]
  - job_name: alert-service
    static_configs:
      - targets: ["alert-service:8081"]
  - job_name: cloudops-demo-workload
    metrics_path: /metrics
    static_configs:
      - targets: ["cloudops-demo-control-plane:30082"]
