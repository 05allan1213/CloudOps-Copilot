apiVersion: v1
kind: Namespace
metadata:
  name: cloudops-demo
  labels:
    cloudops-copilot.io/disposable: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-operator
  namespace: cloudops-demo
  labels:
    cloudops-copilot.io/disposable: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-operator
  namespace: cloudops-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-operator
  namespace: cloudops-demo
subjects:
  - kind: ServiceAccount
    name: demo-operator
    namespace: cloudops-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: demo-operator
