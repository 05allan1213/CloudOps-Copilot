apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-demo-workload
  namespace: cloudops-demo
  labels:
    app: cloudops-demo-workload
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudops-demo-workload
  template:
    metadata:
      labels:
        app: cloudops-demo-workload
    spec:
      containers:
        - name: workload
          image: cloudops-demo/workload:v2-demo
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cloudops-demo-workload
  namespace: cloudops-demo
spec:
  type: NodePort
  selector:
    app: cloudops-demo-workload
  ports:
    - name: metrics
      port: 80
      targetPort: http
      nodePort: 30082
