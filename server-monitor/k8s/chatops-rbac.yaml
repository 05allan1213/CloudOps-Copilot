apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudops-copilot
  namespace: server-monitor

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudops-copilot-readonly
  namespace: server-monitor
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudops-copilot-deployment-writer
  namespace: server-monitor
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudops-copilot-readonly
  namespace: server-monitor
subjects:
  - kind: ServiceAccount
    name: cloudops-copilot
    namespace: server-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudops-copilot-readonly
