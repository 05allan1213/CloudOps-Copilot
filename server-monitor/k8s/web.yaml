# ============================================
# server-web 部署配置
# ============================================
# Web API 服务：查询 Prometheus，提供监控接口
# ============================================

# ------------------------------------------
# Deployment - 部署控制器
# ------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-web
  namespace: server-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server-web
  template:
    metadata:
      labels:
        app: server-web
    spec:
      serviceAccountName: cloudops-copilot
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - server-web
                topologyKey: kubernetes.io/hostname
      containers:
        - name: server-web
          image: goproject-server-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: LOG_LEVEL
            - name: PROMETHEUS_URL
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: PROMETHEUS_URL
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: REDIS_ADDR
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monitor-secret
                  key: REDIS_PASSWORD
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: MYSQL_PORT
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monitor-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_STARTUP_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: MYSQL_STARTUP_TIMEOUT_SECONDS
            - name: MYSQL_PING_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: MYSQL_PING_TIMEOUT_SECONDS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: monitor-secret
                  key: JWT_SECRET
            - name: AUTH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: AUTH_ENABLED
            - name: JWT_EXPIRE_HOURS
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: JWT_EXPIRE_HOURS
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monitor-secret
                  key: ADMIN_PASSWORD
            - name: GIN_MODE
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: GIN_MODE
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: CORS_ALLOWED_ORIGINS
            - name: RATE_LIMIT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: RATE_LIMIT_ENABLED
            - name: RATE_LIMIT_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: RATE_LIMIT_REQUESTS
            - name: RATE_LIMIT_WINDOW_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: RATE_LIMIT_WINDOW_SECONDS
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: monitor-secret
                  key: LLM_API_KEY
            - name: LLM_API_URL
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: LLM_API_URL
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: LLM_MODEL
            - name: LLM_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: LLM_TIMEOUT_SECONDS
            - name: LLM_MAX_TOKENS
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: LLM_MAX_TOKENS
            - name: K8S_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: K8S_ENABLED
            - name: K8S_WRITE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: K8S_WRITE_ENABLED
            - name: K8S_IN_CLUSTER
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: K8S_IN_CLUSTER
            - name: K8S_KUBECONFIG
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: K8S_KUBECONFIG
            - name: K8S_ALLOWED_NAMESPACES
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: K8S_ALLOWED_NAMESPACES
            - name: K8S_DEFAULT_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: K8S_DEFAULT_NAMESPACE
            - name: K8S_REQUEST_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: K8S_REQUEST_TIMEOUT_SECONDS
            - name: K8S_LOG_TAIL_LINES
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: K8S_LOG_TAIL_LINES
            - name: K8S_LOG_MAX_BYTES
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: K8S_LOG_MAX_BYTES
            - name: K8S_EVENT_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: K8S_EVENT_LIMIT
            - name: AGENT_TOOL_REGISTRY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: AGENT_TOOL_REGISTRY_ENABLED
            - name: AGENT_TOOL_DEFAULT_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: AGENT_TOOL_DEFAULT_TIMEOUT_SECONDS
            - name: AGENT_TOOL_LOG_ARGS
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: AGENT_TOOL_LOG_ARGS
            - name: RUNBOOK_DIR
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: RUNBOOK_DIR
            - name: RUNBOOK_MAX_FILES
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: RUNBOOK_MAX_FILES
            - name: RUNBOOK_MAX_FILE_BYTES
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: RUNBOOK_MAX_FILE_BYTES
            - name: RUNBOOK_SEARCH_TOP_N
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: RUNBOOK_SEARCH_TOP_N
            - name: RUNBOOK_BM25_WEIGHT
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: RUNBOOK_BM25_WEIGHT
            - name: RUNBOOK_BM25_K1
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: RUNBOOK_BM25_K1
            - name: RUNBOOK_BM25_B
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: RUNBOOK_BM25_B
            - name: EMBEDDING_API_URL
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: EMBEDDING_API_URL
            - name: EMBEDDING_MODEL
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: EMBEDDING_MODEL
            - name: EMBEDDING_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: EMBEDDING_TIMEOUT_SECONDS
            - name: EMBEDDING_INDEX_BUILD_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: EMBEDDING_INDEX_BUILD_TIMEOUT_SECONDS
            - name: EMBEDDING_DIMS
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: EMBEDDING_DIMS
            - name: RUNBOOK_RRF_K
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: RUNBOOK_RRF_K
            - name: RERANKER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: RERANKER_ENABLED
            - name: RERANKER_TOP_N
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: RERANKER_TOP_N
            - name: RERANKER_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: RERANKER_TIMEOUT_SECONDS
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: monitor-secret
                  key: EMBEDDING_API_KEY
                  optional: true
            - name: READY_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: READY_TIMEOUT_SECONDS
            - name: REQUEST_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: REQUEST_TIMEOUT_SECONDS
            - name: INCIDENT_AGGREGATION_WINDOW_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: INCIDENT_AGGREGATION_WINDOW_SECONDS
            - name: TRACE_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: TRACE_OTLP_ENDPOINT
            - name: TRACE_SAMPLE_RATE
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: TRACE_SAMPLE_RATE
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: monitor-config
                  key: KAFKA_BROKERS
          volumeMounts:
            - name: runbooks
              mountPath: /app/runbooks
              readOnly: true
      volumes:
        - name: runbooks
          configMap:
            name: monitor-runbooks

---
# ------------------------------------------
# Service - 服务发现
# ------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: server-web
  namespace: server-monitor
spec:
  selector:
    app: server-web
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
