image:
  repository: mysql
  tag: 8.0.46
  digest: sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
  pullPolicy: IfNotPresent
database:
  name: cloudops
  root:
    secretName: cloudops-mysql-root
    passwordKey: MYSQL_ROOT_PASSWORD
  identities:
    api:
      user: cloudops-api
      secretName: cloudops-api-database
      passwordKey: MYSQL_PASSWORD
    worker:
      user: cloudops-worker
      secretName: cloudops-worker-database
      passwordKey: MYSQL_PASSWORD
    migrate:
      user: cloudops-migrate
      secretName: cloudops-migrate-database
      passwordKey: MYSQL_PASSWORD
    baseline:
      user: cloudops-baseline
      secretName: cloudops-baseline-database
      passwordKey: MYSQL_PASSWORD
persistence:
  size: 2Gi
  storageClassName: ""
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

observability:
  enabled: true
  namespaces:
    cloudops: cloudops-system
    demo: cloudops-demo
  environment: local-demo
  clusterName: cloudops-v3-phase3
  elastic:
    version: 9.4.3
    elasticsearch:
      name: cloudops-elasticsearch
      image:
        repository: docker.elastic.co/elasticsearch/elasticsearch
        tag: 9.4.3
        digest: sha256:851ff5f9615ab7d2f00931114f6db32850f0208ec9fe7e841f135ac78f5f13d5
        pullPolicy: IfNotPresent
      readRoleSecretName: cloudops-elasticsearch-roles
      storage:
        size: 2Gi
        storageClassName: ""
      javaOpts: -Xms512m -Xmx512m
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi
    kibana:
      name: cloudops-kibana
      image:
        repository: docker.elastic.co/kibana/kibana
        tag: 9.4.3
        digest: sha256:85e993bf4519827c84faa8a65265028d7ea572385f07ce8d913ad03025327ed7
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
    filebeat:
      name: cloudops-filebeat
      serviceAccountName: cloudops-filebeat
      image:
        repository: docker.elastic.co/beats/filebeat
        tag: 9.4.3
        digest: sha256:61bf789ac881c88c0edee6d490434e7a6d464d5f46a2bb1f5540a2301d4bdec3
        pullPolicy: IfNotPresent
      dataStream: logs-cloudops-default
      registryHostPath: /var/lib/cloudops-filebeat
      queueEvents: 2048
      flushMinEvents: 256
      flushTimeout: 5s
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi
  otelCollector:
    name: cloudops-otel-collector
    serviceAccountName: cloudops-otel-collector
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: 0.156.0
      digest: sha256:125bdbeb7590cc1952c5b3430ecf14063568980c2c93d5b38676cc0446ed8108
      pullPolicy: IfNotPresent
    memoryLimitMiB: 192
    memorySpikeLimitMiB: 48
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  tempo:
    name: cloudops-tempo
    serviceAccountName: cloudops-tempo
    target: all
    image:
      repository: grafana/tempo
      tag: 3.0.2
      digest: sha256:cda87c212d8c584dc0b89e337e7ed648a5100feb657e5d528480ee4fa03dbbe3
      pullPolicy: IfNotPresent
    retention: 2h
    storage:
      size: 2Gi
      storageClassName: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 750m
        memory: 1Gi
