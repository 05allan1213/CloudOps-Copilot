{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.observability.otelCollector.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops-kind-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: trace-collector
automountServiceAccountToken: true
---
{{- range $namespace := list .Values.observability.namespaces.cloudops .Values.observability.namespaces.demo }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudops-otel-k8sattributes
  namespace: {{ $namespace }}
  labels:
    {{- include "cloudops-kind-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: trace-collector
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudops-otel-k8sattributes
  namespace: {{ $namespace }}
  labels:
    {{- include "cloudops-kind-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: trace-collector
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.observability.otelCollector.serviceAccountName }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudops-otel-k8sattributes
---
{{- end }}
{{- end }}
