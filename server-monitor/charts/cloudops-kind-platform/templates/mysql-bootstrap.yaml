apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudops-mysql-bootstrap
  labels:
    {{- include "cloudops-kind-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-bootstrap
data:
  10-cloudops-identities.sh: |-
    # This file is sourced by the MySQL image only while initializing a fresh
    # disposable kind data directory. Password bytes arrive through Secret
    # environment references and are never present in this ConfigMap.
    sql_literal() {
      local value="$1"
      value="${value//\'/\'\'}"
      printf "'%s'" "${value}"
    }

    api_user="$(sql_literal "${CLOUDOPS_API_USER}")"
    api_password="$(sql_literal "${CLOUDOPS_API_PASSWORD}")"
    worker_user="$(sql_literal "${CLOUDOPS_WORKER_USER}")"
    worker_password="$(sql_literal "${CLOUDOPS_WORKER_PASSWORD}")"
    migrate_user="$(sql_literal "${CLOUDOPS_MIGRATE_USER}")"
    migrate_password="$(sql_literal "${CLOUDOPS_MIGRATE_PASSWORD}")"
    baseline_user="$(sql_literal "${CLOUDOPS_BASELINE_USER}")"
    baseline_password="$(sql_literal "${CLOUDOPS_BASELINE_PASSWORD}")"

    mysql --protocol=socket -uroot -p"${MYSQL_ROOT_PASSWORD}" <<-EOSQL
    SET SESSION sql_mode = CONCAT_WS(',', @@SESSION.sql_mode, 'NO_BACKSLASH_ESCAPES');
    CREATE USER IF NOT EXISTS ${api_user}@'%' IDENTIFIED BY ${api_password};
    ALTER USER ${api_user}@'%' IDENTIFIED BY ${api_password};
    REVOKE IF EXISTS ALL PRIVILEGES, GRANT OPTION FROM ${api_user}@'%';
    GRANT SELECT, INSERT, UPDATE, DELETE ON `{{ .Values.database.name }}`.* TO ${api_user}@'%';

    CREATE USER IF NOT EXISTS ${worker_user}@'%' IDENTIFIED BY ${worker_password};
    ALTER USER ${worker_user}@'%' IDENTIFIED BY ${worker_password};
    REVOKE IF EXISTS ALL PRIVILEGES, GRANT OPTION FROM ${worker_user}@'%';
    GRANT SELECT, INSERT, UPDATE, DELETE ON `{{ .Values.database.name }}`.* TO ${worker_user}@'%';

    CREATE USER IF NOT EXISTS ${migrate_user}@'%' IDENTIFIED BY ${migrate_password};
    ALTER USER ${migrate_user}@'%' IDENTIFIED BY ${migrate_password};
    REVOKE IF EXISTS ALL PRIVILEGES, GRANT OPTION FROM ${migrate_user}@'%';
    GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, INDEX, REFERENCES ON `{{ .Values.database.name }}`.* TO ${migrate_user}@'%';

    CREATE USER IF NOT EXISTS ${baseline_user}@'%' IDENTIFIED BY ${baseline_password};
    ALTER USER ${baseline_user}@'%' IDENTIFIED BY ${baseline_password};
    REVOKE IF EXISTS ALL PRIVILEGES, GRANT OPTION FROM ${baseline_user}@'%';
    GRANT SELECT ON `{{ .Values.database.name }}`.* TO ${baseline_user}@'%';
    GRANT INSERT, UPDATE ON `{{ .Values.database.name }}`.`deployment_baselines` TO ${baseline_user}@'%';
    GRANT INSERT, UPDATE ON `{{ .Values.database.name }}`.`baseline_observations` TO ${baseline_user}@'%';
    EOSQL
