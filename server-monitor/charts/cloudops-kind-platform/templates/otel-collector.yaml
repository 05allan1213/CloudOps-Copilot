{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.observability.otelCollector.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops-kind-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: trace-collector
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: {{ .Values.observability.otelCollector.memoryLimitMiB }}
        spike_limit_mib: {{ .Values.observability.otelCollector.memorySpikeLimitMiB }}
      transform/sanitize_k8s_identity:
        error_mode: propagate
        trace_statements:
          - context: resource
            statements:
              - delete_key(attributes, "k8s.namespace.name")
              - delete_key(attributes, "k8s.pod.name")
              - delete_key(attributes, "k8s.pod.ip")
              - delete_key(attributes, "k8s.replicaset.name")
              - delete_key(attributes, "k8s.deployment.name")
              - delete_key(attributes, "k8s.workload.kind")
              - delete_key(attributes, "k8s.workload.name")
              - delete_key(attributes, "container.image.name")
              - delete_key(attributes, "container.image.repo_digests")
      k8sattributes/cloudops:
        auth_type: serviceAccount
        passthrough: false
        wait_for_metadata: true
        wait_for_metadata_timeout: 30s
        filter:
          namespace: {{ .Values.observability.namespaces.cloudops | quote }}
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.replicaset.name
            - k8s.deployment.name
            - k8s.container.name
            - container.id
            - container.image.name
            - container.image.repo_digests
          labels:
            - tag_name: cloudops.source.revision
              key: cloudops.io/source-revision
              from: pod
            - tag_name: cloudops.gitops.revision
              key: cloudops.io/gitops-revision
              from: pod
        pod_association:
          - sources:
              - from: connection
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
      k8sattributes/demo:
        auth_type: serviceAccount
        passthrough: false
        wait_for_metadata: true
        wait_for_metadata_timeout: 30s
        filter:
          namespace: {{ .Values.observability.namespaces.demo | quote }}
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.replicaset.name
            - k8s.deployment.name
            - k8s.container.name
            - container.id
            - container.image.name
            - container.image.repo_digests
          labels:
            - tag_name: cloudops.source.revision
              key: cloudops.io/source-revision
              from: pod
            - tag_name: cloudops.gitops.revision
              key: cloudops.io/gitops-revision
              from: pod
        pod_association:
          - sources:
              - from: connection
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
      transform/normalize_k8s_identity:
        error_mode: propagate
        trace_statements:
          - context: resource
            statements:
              - set(attributes["k8s.workload.kind"], "Deployment") where attributes["k8s.deployment.name"] != nil
              - set(attributes["k8s.workload.name"], attributes["k8s.deployment.name"]) where attributes["k8s.deployment.name"] != nil
      filter/allowed_namespaces:
        error_mode: propagate
        trace_conditions:
          - resource.attributes["k8s.namespace.name"] != {{ .Values.observability.namespaces.cloudops | quote }} and resource.attributes["k8s.namespace.name"] != {{ .Values.observability.namespaces.demo | quote }}
      resource:
        attributes:
          - key: deployment.environment.name
            value: {{ .Values.observability.environment | quote }}
            action: upsert
          - key: k8s.cluster.name
            value: {{ .Values.observability.clusterName | quote }}
            action: upsert
      batch:
        send_batch_size: 256
        timeout: 2s
    exporters:
      otlp/tempo:
        endpoint: {{ printf "%s:4317" .Values.observability.tempo.name | quote }}
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, transform/sanitize_k8s_identity, k8sattributes/cloudops, k8sattributes/demo, transform/normalize_k8s_identity, filter/allowed_namespaces, resource, batch]
          exporters: [otlp/tempo]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
                    without_type_suffix: true
                    without_units: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.observability.otelCollector.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops-kind-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: trace-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.observability.otelCollector.name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.observability.otelCollector.name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: trace-collector
    spec:
      serviceAccountName: {{ .Values.observability.otelCollector.serviceAccountName }}
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: {{ include "cloudops-kind-platform.image" .Values.observability.otelCollector.image | quote }}
          imagePullPolicy: {{ .Values.observability.otelCollector.image.pullPolicy | quote }}
          args: ["--config=/conf/collector.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.observability.otelCollector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ .Values.observability.otelCollector.name }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.observability.otelCollector.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops-kind-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: trace-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.observability.otelCollector.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
    - name: metrics
      port: 8888
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.observability.otelCollector.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops-kind-platform.labels" . | nindent 4 }}
    cloudops.io/monitoring: enabled
    app.kubernetes.io/component: trace-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.observability.otelCollector.name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
{{- end }}
