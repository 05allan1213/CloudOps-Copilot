{{- $seenUsers := dict -}}
{{- $seenSecrets := dict -}}
{{- range $name, $identity := .Values.database.identities -}}
  {{- if hasKey $seenUsers $identity.user -}}
  {{- fail (printf "MySQL identities %s and %s must use different users" (index $seenUsers $identity.user) $name) -}}
  {{- end -}}
  {{- $_ := set $seenUsers $identity.user $name -}}
  {{- if hasKey $seenSecrets $identity.secretName -}}
  {{- fail (printf "MySQL identities %s and %s must use different credential Secrets" (index $seenSecrets $identity.secretName) $name) -}}
  {{- end -}}
  {{- $_ := set $seenSecrets $identity.secretName $name -}}
  {{- if eq $identity.secretName $.Values.database.root.secretName -}}
  {{- fail (printf "MySQL identity %s must not reuse the root credential Secret" $name) -}}
  {{- end -}}
{{- end -}}
