{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.observability.tempo.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops-kind-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: trace-store
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.observability.tempo.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops-kind-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: trace-store
data:
  tempo.yaml: |
    target: {{ .Values.observability.tempo.target }}
    server:
      http_listen_port: 3200
      log_level: info
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
    overrides:
      defaults:
        ingestion:
          rate_limit_bytes: 5000000
        compaction:
          block_retention: {{ .Values.observability.tempo.retention }}
    usage_report:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.observability.tempo.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops-kind-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: trace-store
spec:
  serviceName: {{ .Values.observability.tempo.name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.observability.tempo.name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.observability.tempo.name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: trace-store
    spec:
      serviceAccountName: {{ .Values.observability.tempo.serviceAccountName }}
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tempo
          image: {{ include "cloudops-kind-platform.image" .Values.observability.tempo.image | quote }}
          imagePullPolicy: {{ .Values.observability.tempo.image.pullPolicy | quote }}
          args: ["-config.file=/conf/tempo.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3200
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.observability.tempo.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: data
              mountPath: /var/tempo
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ .Values.observability.tempo.name }}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.observability.tempo.storage.size | quote }}
        {{- if .Values.observability.tempo.storage.storageClassName }}
        storageClassName: {{ .Values.observability.tempo.storage.storageClassName | quote }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.observability.tempo.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops-kind-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: trace-store
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.observability.tempo.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 3200
      targetPort: http
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.observability.tempo.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops-kind-platform.labels" . | nindent 4 }}
    cloudops.io/monitoring: enabled
    app.kubernetes.io/component: trace-store
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.observability.tempo.name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
{{- end }}
