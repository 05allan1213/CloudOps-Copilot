{{- if .Values.observability.enabled }}
apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: {{ .Values.observability.elastic.filebeat.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudops-kind-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-collector
spec:
  type: filebeat
  version: {{ .Values.observability.elastic.version | quote }}
  image: {{ include "cloudops-kind-platform.image" .Values.observability.elastic.filebeat.image | quote }}
  elasticsearchRef:
    name: {{ .Values.observability.elastic.elasticsearch.name }}
  kibanaRef:
    name: {{ .Values.observability.elastic.kibana.name }}
  config:
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}
          scope: node
          namespace: {{ .Values.observability.namespaces.cloudops | quote }}
          add_resource_metadata:
            node:
              enabled: false
            namespace:
              enabled: false
          hints.enabled: false
          templates:
            - condition:
                equals:
                  kubernetes.namespace: {{ .Values.observability.namespaces.cloudops | quote }}
              config:
                - type: filestream
                  id: cloudops-${data.kubernetes.pod.uid}-${data.kubernetes.container.id}
                  prospector.scanner:
                    fingerprint.enabled: true
                    symlinks: true
                  file_identity.fingerprint: {}
                  parsers:
                    - container: {}
                  paths:
                    - /var/log/containers/*${data.kubernetes.container.id}.log
                  fields_under_root: true
                  fields:
                    data_stream.type: logs
                    data_stream.dataset: cloudops
                    data_stream.namespace: default
        - type: kubernetes
          node: ${NODE_NAME}
          scope: node
          namespace: {{ .Values.observability.namespaces.demo | quote }}
          add_resource_metadata:
            node:
              enabled: false
            namespace:
              enabled: false
          hints.enabled: false
          templates:
            - condition:
                equals:
                  kubernetes.namespace: {{ .Values.observability.namespaces.demo | quote }}
              config:
                - type: filestream
                  id: demo-${data.kubernetes.pod.uid}-${data.kubernetes.container.id}
                  prospector.scanner:
                    fingerprint.enabled: true
                    symlinks: true
                  file_identity.fingerprint: {}
                  parsers:
                    - container: {}
                  paths:
                    - /var/log/containers/*${data.kubernetes.container.id}.log
                  fields_under_root: true
                  fields:
                    data_stream.type: logs
                    data_stream.dataset: cloudops
                    data_stream.namespace: default
    queue.mem:
      events: {{ .Values.observability.elastic.filebeat.queueEvents }}
      flush.min_events: {{ .Values.observability.elastic.filebeat.flushMinEvents }}
      flush.timeout: {{ .Values.observability.elastic.filebeat.flushTimeout }}
    setup.ilm.enabled: false
    setup.template:
      enabled: true
      type: data_stream
      name: logs-cloudops
      pattern: logs-cloudops-*
    output.elasticsearch:
      index: {{ .Values.observability.elastic.filebeat.dataStream | quote }}
  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: {{ .Values.observability.elastic.filebeat.serviceAccountName }}
        automountServiceAccountToken: true
        hostNetwork: false
        dnsPolicy: ClusterFirst
        terminationGracePeriodSeconds: 30
        securityContext:
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: filebeat
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            securityContext:
              runAsUser: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              {{- toYaml .Values.observability.elastic.filebeat.resources | nindent 14 }}
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
                readOnly: true
              - name: varlogpods
                mountPath: /var/log/pods
                readOnly: true
              - name: registry
                mountPath: /usr/share/filebeat/data
        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
              type: Directory
          - name: varlogpods
            hostPath:
              path: /var/log/pods
              type: Directory
          - name: registry
            hostPath:
              path: {{ .Values.observability.elastic.filebeat.registryHostPath | quote }}
              type: DirectoryOrCreate
{{- end }}
