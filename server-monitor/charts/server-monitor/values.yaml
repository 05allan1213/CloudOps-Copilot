    credentialSecretName: ""
  argocd:
    enabled: false
    server: ""
    allowedApplications: []
    allowedProjects: []
    timeoutSeconds: "10"
    maxResources: "100"
    maxDiffBytes: "131072"
    credentialSecretName: ""
  image:
    revisionRequired: false
    allowedRegistries: []
  registry:
    enabled: false
    baseURL: ""
    allowedHosts: []
    allowedRepositories: []
    allowedAuthRealmHosts: []
    allowedRedirectHosts: []
    allowedSourceRepositories: []
