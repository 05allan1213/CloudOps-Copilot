  runbookMaxFileBytes: "65536"
  runbookSearchTopN: "2"
  runbookBM25Weight: "0.3"
  runbookBM25K1: "1.2"
  runbookBM25B: "0.75"
  embeddingApiUrl: ""
  embeddingModel: ""
  embeddingTimeoutSeconds: "10"
  embeddingIndexBuildTimeoutSeconds: "30"
  embeddingDims: "0"
  runbookRRFK: "60"
  rerankerEnabled: "false"
  rerankerTopN: "2"
  rerankerTimeoutSeconds: "10"

