# ============================================
# ConfigMap - 配置中心
# ============================================
# 存储非敏感配置信息
# 使用方式：在 Pod 中通过 configMapKeyRef 引用
# ============================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: monitor-config
  labels:
    {{- include "server-monitor.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  PROMETHEUS_URL: {{ .Values.config.prometheusUrl | quote }}
  PROMETHEUS_RELOAD_URL: {{ .Values.alertRuleSync.prometheusReloadUrl | quote }}
  ALERT_RULES_FILE_PATH: {{ .Values.alertRuleSync.rulesFilePath | quote }}
  ALERT_RULE_SYNC_ENABLED: {{ .Values.alertRuleSync.enabled | quote }}
  PROMTOOL_PATH: {{ .Values.alertRuleSync.promtoolPath | quote }}
  ALERT_RULE_SYNC_TIMEOUT_SECONDS: {{ .Values.alertRuleSync.timeoutSeconds | quote }}
  REDIS_ADDR: {{ .Values.config.redisAddr | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  RATE_LIMIT_ENABLED: {{ .Values.rateLimit.enabled | quote }}
  RATE_LIMIT_REQUESTS: {{ .Values.rateLimit.requests | quote }}
  RATE_LIMIT_WINDOW_SECONDS: {{ .Values.rateLimit.windowSeconds | quote }}
  COPILOT_ENABLED: {{ .Values.config.copilotEnabled | quote }}
  LLM_API_URL: {{ .Values.config.llmApiUrl | quote }}
  LLM_MODEL: {{ .Values.config.llmModel | quote }}
  LLM_TIMEOUT_SECONDS: {{ .Values.config.llmTimeoutSeconds | quote }}
  LLM_MAX_TOKENS: {{ .Values.config.llmMaxTokens | quote }}
  DIAGNOSIS_LLM_TIMEOUT_SECONDS: {{ .Values.config.diagnosisLLMTimeoutSeconds | quote }}
  DIAGNOSIS_ENABLED: {{ .Values.config.diagnosisEnabled | quote }}
  DIAGNOSIS_WORKER_COUNT: {{ .Values.config.diagnosisWorkerCount | quote }}
  DIAGNOSIS_KAFKA_GROUP_ID: {{ .Values.config.diagnosisKafkaGroupID | quote }}
  DIAGNOSIS_TASK_TTL_SECONDS: {{ .Values.config.diagnosisTaskTTLSeconds | quote }}
  DIAGNOSIS_TASK_TIMEOUT_SECONDS: {{ .Values.config.diagnosisTaskTimeoutSeconds | quote }}
  DIAGNOSIS_RETRYABLE_ERRORS: {{ .Values.config.diagnosisRetryableErrors | quote }}
  DIAGNOSIS_STATUS_PUSH_ENABLED: {{ .Values.config.diagnosisStatusPushEnabled | quote }}
  FEEDBACK_ENABLED: {{ .Values.config.feedbackEnabled | default true | quote }}
  FEEDBACK_COMMENT_MAX_LENGTH: {{ .Values.config.feedbackCommentMaxLength | default 500 | quote }}
  ACTION_APPROVAL_ENABLED: {{ .Values.config.actionApprovalEnabled | quote }}
  ACTION_EXECUTION_ENABLED: {{ .Values.config.actionExecutionEnabled | quote }}
  ACTION_MAX_REPLICAS: {{ .Values.config.actionMaxReplicas | quote }}
  ACTION_PENDING_TTL_HOURS: {{ .Values.config.actionPendingTTLHours | quote }}
  ACTION_OPERATION_EVENTS_ENABLED: {{ .Values.config.actionOperationEventsEnabled | quote }}
  ACTION_STATUS_PUSH_ENABLED: {{ .Values.config.actionStatusPushEnabled | quote }}
  K8S_ENABLED: {{ .Values.k8sIntegration.enabled | quote }}
  K8S_WRITE_ENABLED: {{ .Values.k8sIntegration.writeEnabled | quote }}
  K8S_NODES_ENABLED: {{ .Values.k8sIntegration.nodesEnabled | quote }}
  K8S_API_ENABLED: {{ .Values.k8sIntegration.apiEnabled | quote }}
  K8S_IN_CLUSTER: {{ .Values.k8sIntegration.inCluster | quote }}
  K8S_KUBECONFIG: {{ .Values.k8sIntegration.kubeconfig | quote }}
  K8S_ALLOWED_NAMESPACES: {{ join "," .Values.k8sIntegration.allowedNamespaces | quote }}
  K8S_DEFAULT_NAMESPACE: {{ .Values.k8sIntegration.defaultNamespace | quote }}
  K8S_REQUEST_TIMEOUT_SECONDS: {{ .Values.k8sIntegration.requestTimeoutSeconds | quote }}
  K8S_LOG_TAIL_LINES: {{ .Values.k8sIntegration.logTailLines | quote }}
  K8S_LOG_MAX_BYTES: {{ .Values.k8sIntegration.logMaxBytes | quote }}
  K8S_EVENT_LIMIT: {{ .Values.k8sIntegration.eventLimit | quote }}
  K8S_CACHE_TTL_SECONDS: {{ .Values.k8sIntegration.cacheTTlSeconds | quote }}
  K8S_LIST_CACHE_TTL_SECONDS: {{ .Values.k8sIntegration.listCacheTTLSeconds | quote }}
  K8S_EVENT_WATCH_INTERVAL_SECONDS: {{ .Values.k8sIntegration.eventWatchIntervalSeconds | quote }}
  K8S_CLUSTERS: {{ .Values.k8sIntegration.clusters | quote }}
  COPILOT_SESSION_TTL_SECONDS: {{ .Values.config.copilotSessionTTLSeconds | quote }}
  COPILOT_MAX_MESSAGE_LENGTH: {{ .Values.config.copilotMaxMessageLength | quote }}
  COPILOT_MAX_SESSION_MESSAGES: {{ .Values.config.copilotMaxSessionMessages | quote }}
  COPILOT_TOOL_REGISTRY_ENABLED: {{ .Values.config.copilotToolRegistryEnabled | quote }}
  COPILOT_TOOL_DEFAULT_TIMEOUT_SECONDS: {{ .Values.config.copilotToolDefaultTimeoutSeconds | quote }}
  COPILOT_TOOL_LOG_ARGS: {{ .Values.config.copilotToolLogArgs | quote }}
  COPILOT_TOOLS_CLASSIFY_ENABLED: {{ .Values.copilot.toolsClassifyEnabled | quote }}
  COPILOT_MULTI_INTENT_ENABLED: {{ .Values.copilot.multiIntentEnabled | quote }}
  COPILOT_MULTI_INTENT_MAX: {{ .Values.copilot.multiIntentMax | quote }}
  RUNBOOK_DIR: {{ .Values.config.runbookDir | quote }}
  RUNBOOK_MAX_FILES: {{ .Values.config.runbookMaxFiles | quote }}
  RUNBOOK_MAX_FILE_BYTES: {{ .Values.config.runbookMaxFileBytes | quote }}
  RUNBOOK_SEARCH_TOP_N: {{ .Values.config.runbookSearchTopN | quote }}
  RUNBOOK_BM25_WEIGHT: {{ .Values.config.runbookBM25Weight | quote }}
  RUNBOOK_BM25_K1: {{ .Values.config.runbookBM25K1 | quote }}
  RUNBOOK_BM25_B: {{ .Values.config.runbookBM25B | quote }}
  EMBEDDING_API_URL: {{ .Values.config.embeddingApiUrl | quote }}
  EMBEDDING_MODEL: {{ .Values.config.embeddingModel | quote }}
  EMBEDDING_TIMEOUT_SECONDS: {{ .Values.config.embeddingTimeoutSeconds | quote }}
  EMBEDDING_INDEX_BUILD_TIMEOUT_SECONDS: {{ .Values.config.embeddingIndexBuildTimeoutSeconds | quote }}
  EMBEDDING_DIMS: {{ .Values.config.embeddingDims | quote }}
  RUNBOOK_RRF_K: {{ .Values.config.runbookRRFK | quote }}
  RERANKER_ENABLED: {{ .Values.config.rerankerEnabled | quote }}
  RERANKER_TOP_N: {{ .Values.config.rerankerTopN | quote }}
  RERANKER_TIMEOUT_SECONDS: {{ .Values.config.rerankerTimeoutSeconds | quote }}
  GIN_MODE: {{ .Values.config.ginMode | quote }}
  READY_TIMEOUT_SECONDS: {{ .Values.config.readyTimeoutSeconds | quote }}
  REQUEST_TIMEOUT_SECONDS: {{ .Values.config.requestTimeoutSeconds | quote }}
  INCIDENT_AGGREGATION_WINDOW_SECONDS: {{ .Values.config.incidentAggregationWindowSeconds | quote }}
  CHANGE_INTELLIGENCE_ENABLED: {{ .Values.changeIntelligence.enabled | quote }}
  CHANGE_LOOKBACK: {{ .Values.changeIntelligence.lookbackSeconds | quote }}
  CHANGE_MAX_CANDIDATES: {{ .Values.changeIntelligence.maxCandidates | quote }}
  CHANGE_SERVICE_MAPPINGS_JSON: {{ .Values.changeIntelligence.serviceMappingsJSON | quote }}
  GITHUB_ENABLED: {{ .Values.changeIntelligence.github.enabled | quote }}
  GITHUB_API_BASE_URL: {{ .Values.changeIntelligence.github.apiBaseURL | quote }}
  GITHUB_APP_ID: {{ .Values.changeIntelligence.github.appID | quote }}
  GITHUB_INSTALLATION_ID: {{ .Values.changeIntelligence.github.installationID | quote }}
  GITHUB_TOKEN_FILE: {{ ternary "/var/run/secrets/cloudops/github/token" "" (and .Values.changeIntelligence.github.enabled (ne .Values.changeIntelligence.github.credentialSecretName "") (eq .Values.changeIntelligence.github.appID "0")) | quote }}
  GITHUB_PRIVATE_KEY_FILE: {{ ternary "/var/run/secrets/cloudops/github/private-key.pem" "" (and .Values.changeIntelligence.github.enabled (ne .Values.changeIntelligence.github.credentialSecretName "") (ne .Values.changeIntelligence.github.appID "0")) | quote }}
  GITHUB_ALLOWED_OWNERS: {{ join "," .Values.changeIntelligence.github.allowedOwners | quote }}
  GITHUB_ALLOWED_REPOSITORIES: {{ join "," .Values.changeIntelligence.github.allowedRepositories | quote }}
  GITHUB_ALLOWED_BRANCHES: {{ join "," .Values.changeIntelligence.github.allowedBranches | quote }}
  GITHUB_ALLOWED_PATHS: {{ join "," .Values.changeIntelligence.github.allowedPaths | quote }}
  GITHUB_DENIED_PATH_PATTERNS: {{ join "," .Values.changeIntelligence.github.deniedPathPatterns | quote }}
  GITHUB_MAX_DIFF_FILES: {{ .Values.changeIntelligence.github.maxDiffFiles | quote }}
  GITHUB_MAX_DIFF_BYTES: {{ .Values.changeIntelligence.github.maxDiffBytes | quote }}
  GITHUB_TIMEOUT: {{ .Values.changeIntelligence.github.timeoutSeconds | quote }}
  GITHUB_MAX_RETRIES: {{ .Values.changeIntelligence.github.maxRetries | quote }}
  ARGOCD_ENABLED: {{ .Values.changeIntelligence.argocd.enabled | quote }}
  ARGOCD_SERVER: {{ .Values.changeIntelligence.argocd.server | quote }}
  ARGOCD_TOKEN_FILE: {{ ternary "/var/run/secrets/cloudops/argocd/token" "" (and .Values.changeIntelligence.argocd.enabled (ne .Values.changeIntelligence.argocd.credentialSecretName "")) | quote }}
  ARGOCD_ALLOWED_APPLICATIONS: {{ join "," .Values.changeIntelligence.argocd.allowedApplications | quote }}
  ARGOCD_ALLOWED_PROJECTS: {{ join "," .Values.changeIntelligence.argocd.allowedProjects | quote }}
  ARGOCD_TIMEOUT: {{ .Values.changeIntelligence.argocd.timeoutSeconds | quote }}
  ARGOCD_MAX_RESOURCES: {{ .Values.changeIntelligence.argocd.maxResources | quote }}
  ARGOCD_MAX_DIFF_BYTES: {{ .Values.changeIntelligence.argocd.maxDiffBytes | quote }}
  IMAGE_REVISION_REQUIRED: {{ .Values.changeIntelligence.image.revisionRequired | quote }}
  IMAGE_ALLOWED_REGISTRIES: {{ join "," .Values.changeIntelligence.image.allowedRegistries | quote }}
  REGISTRY_METADATA_ENABLED: {{ .Values.changeIntelligence.registry.enabled | quote }}
  REGISTRY_BASE_URL: {{ .Values.changeIntelligence.registry.baseURL | quote }}
  REGISTRY_ALLOWED_HOSTS: {{ join "," .Values.changeIntelligence.registry.allowedHosts | quote }}
  REGISTRY_ALLOWED_REPOSITORIES: {{ join "," .Values.changeIntelligence.registry.allowedRepositories | quote }}
  REGISTRY_ALLOWED_AUTH_REALM_HOSTS: {{ join "," .Values.changeIntelligence.registry.allowedAuthRealmHosts | quote }}
  REGISTRY_ALLOWED_REDIRECT_HOSTS: {{ join "," .Values.changeIntelligence.registry.allowedRedirectHosts | quote }}
  OCI_ALLOWED_SOURCE_REPOSITORIES: {{ join "," .Values.changeIntelligence.registry.allowedSourceRepositories | quote }}
  REGISTRY_BEARER_TOKEN_FILE: {{ ternary "/var/run/secrets/cloudops/registry/bearer-token" "" (and .Values.changeIntelligence.registry.enabled (eq .Values.changeIntelligence.registry.auth.mode "bearer") (ne .Values.changeIntelligence.registry.auth.credentialSecretName "")) | quote }}
  REGISTRY_USERNAME_FILE: {{ ternary "/var/run/secrets/cloudops/registry/username" "" (and .Values.changeIntelligence.registry.enabled (eq .Values.changeIntelligence.registry.auth.mode "basic") (ne .Values.changeIntelligence.registry.auth.credentialSecretName "")) | quote }}
  REGISTRY_PASSWORD_FILE: {{ ternary "/var/run/secrets/cloudops/registry/password" "" (and .Values.changeIntelligence.registry.enabled (eq .Values.changeIntelligence.registry.auth.mode "basic") (ne .Values.changeIntelligence.registry.auth.credentialSecretName "")) | quote }}
  REGISTRY_TIMEOUT: {{ .Values.changeIntelligence.registry.timeoutSeconds | quote }}
  REGISTRY_MAX_RETRIES: {{ .Values.changeIntelligence.registry.maxRetries | quote }}
  REGISTRY_MANIFEST_MAX_BYTES: {{ .Values.changeIntelligence.registry.manifestMaxBytes | quote }}
  REGISTRY_CONFIG_MAX_BYTES: {{ .Values.changeIntelligence.registry.configMaxBytes | quote }}
  REGISTRY_CACHE_TTL_SECONDS: {{ .Values.changeIntelligence.registry.cacheTTLSeconds | quote }}
  REGISTRY_CACHE_MAX_ITEMS: {{ .Values.changeIntelligence.registry.cacheMaxItems | quote }}
  REMEDIATION_ENABLED: {{ .Values.remediation.enabled | quote }}
  GITOPS_PR_ENABLED: {{ .Values.remediation.gitopsPREnabled | quote }}
  GITHUB_WRITE_ENABLED: {{ .Values.remediation.githubWrite.enabled | quote }}
  REMEDIATION_ALLOWED_OPERATIONS: {{ join "," .Values.remediation.allowedOperations | quote }}
  REMEDIATION_MAX_PATCH_BYTES: {{ .Values.remediation.maxPatchBytes | quote }}
  REMEDIATION_MAX_FILES: {{ .Values.remediation.maxFiles | quote }}
  REMEDIATION_MAX_RISK: {{ .Values.remediation.maxRisk | quote }}
  REMEDIATION_MIN_REPLICAS: {{ .Values.remediation.minReplicas | quote }}
  REMEDIATION_MAX_REPLICAS: {{ .Values.remediation.maxReplicas | quote }}
  REMEDIATION_HPA_TARGETS: {{ join "," .Values.remediation.hpaTargets | quote }}
  GITOPS_BASE_BRANCHES_JSON: {{ .Values.remediation.baseBranchesJSON | quote }}
  GITHUB_WRITE_API_BASE_URL: {{ .Values.remediation.githubWrite.apiBaseURL | quote }}
  GITHUB_WRITE_APP_ID: {{ .Values.remediation.githubWrite.appID | quote }}
  GITHUB_WRITE_INSTALLATION_ID: {{ .Values.remediation.githubWrite.installationID | quote }}
  GITHUB_WRITE_TOKEN_FILE: {{ ternary "/var/run/secrets/cloudops/github-write/token" "" (and .Values.remediation.githubWrite.enabled (ne .Values.remediation.githubWrite.credentialSecretName "") (eq .Values.remediation.githubWrite.appID "0")) | quote }}
  GITHUB_WRITE_PRIVATE_KEY_FILE: {{ ternary "/var/run/secrets/cloudops/github-write/private-key.pem" "" (and .Values.remediation.githubWrite.enabled (ne .Values.remediation.githubWrite.credentialSecretName "") (ne .Values.remediation.githubWrite.appID "0")) | quote }}
  GITHUB_WRITE_ALLOWED_REPOSITORIES: {{ join "," .Values.remediation.githubWrite.allowedRepositories | quote }}
  GITHUB_WRITE_ALLOWED_BASE_BRANCHES: {{ join "," .Values.remediation.githubWrite.allowedBaseBranches | quote }}
  GITHUB_WRITE_ALLOWED_PATHS: {{ join "," .Values.remediation.githubWrite.allowedPaths | quote }}
  GITHUB_WRITE_TIMEOUT_SECONDS: {{ .Values.remediation.githubWrite.timeoutSeconds | quote }}
  GITHUB_WRITE_MAX_RESPONSE_BYTES: {{ .Values.remediation.githubWrite.maxResponseBytes | quote }}
  GITHUB_WRITE_MAX_CONTENT_BYTES: {{ .Values.remediation.githubWrite.maxContentBytes | quote }}
  REMEDIATION_WORKER_ID: {{ .Values.remediation.workerID | quote }}
  REMEDIATION_POLL_INTERVAL_MILLISECONDS: {{ .Values.remediation.pollIntervalMilliseconds | quote }}
  REMEDIATION_LEASE_SECONDS: {{ .Values.remediation.leaseSeconds | quote }}
  HOSTS_CACHE_TTL_SECONDS: {{ .Values.config.hostsCacheTTLSeconds | quote }}
  TRACE_OTLP_ENDPOINT: {{ .Values.config.traceOtlpEndpoint | quote }}
  TRACE_SAMPLE_RATE: {{ .Values.config.traceSampleRate | quote }}
  KAFKA_BROKERS: {{ ternary .Values.config.kafkaBrokers "" .Values.kafka.enabled | quote }}
  PROBE_LISTEN_ADDR: {{ .Values.serverProbe.listenAddr | quote }}
  PROBE_METRICS_PATH: {{ .Values.serverProbe.metricsPath | quote }}
  PROBE_SCRAPE_INTERVAL: {{ .Values.serverProbe.scrapeInterval | quote }}
  MYSQL_HOST: {{ .Values.config.mysqlHost | quote }}
  MYSQL_PORT: {{ .Values.config.mysqlPort | quote }}
  MYSQL_USER: {{ .Values.config.mysqlUser | quote }}
  MYSQL_DATABASE: {{ .Values.config.mysqlDatabase | quote }}
  MYSQL_STARTUP_TIMEOUT_SECONDS: {{ .Values.config.mysqlStartupTimeoutSeconds | quote }}
  MYSQL_PING_TIMEOUT_SECONDS: {{ .Values.config.mysqlPingTimeoutSeconds | quote }}
  JWT_EXPIRE_HOURS: {{ .Values.auth.jwtExpireHours | quote }}
  AUTH_ENABLED: {{ .Values.auth.enabled | quote }}
