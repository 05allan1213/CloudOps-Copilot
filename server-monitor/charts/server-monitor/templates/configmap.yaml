# ============================================
# ConfigMap - 配置中心
# ============================================
# 存储非敏感配置信息
# 使用方式：在 Pod 中通过 configMapKeyRef 引用
# ============================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: monitor-config
  labels:
    {{- include "server-monitor.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  PROMETHEUS_URL: {{ .Values.config.prometheusUrl | quote }}
  PROMETHEUS_RELOAD_URL: {{ .Values.alertRuleSync.prometheusReloadUrl | quote }}
  ALERT_RULES_FILE_PATH: {{ .Values.alertRuleSync.rulesFilePath | quote }}
  ALERT_RULE_SYNC_ENABLED: {{ .Values.alertRuleSync.enabled | quote }}
  PROMTOOL_PATH: {{ .Values.alertRuleSync.promtoolPath | quote }}
  ALERT_RULE_SYNC_TIMEOUT_SECONDS: {{ .Values.alertRuleSync.timeoutSeconds | quote }}
  REDIS_ADDR: {{ .Values.config.redisAddr | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  RATE_LIMIT_ENABLED: {{ .Values.rateLimit.enabled | quote }}
  RATE_LIMIT_REQUESTS: {{ .Values.rateLimit.requests | quote }}
  RATE_LIMIT_WINDOW_SECONDS: {{ .Values.rateLimit.windowSeconds | quote }}
  COPILOT_ENABLED: {{ .Values.config.copilotEnabled | quote }}
  LLM_API_URL: {{ .Values.config.llmApiUrl | quote }}
  LLM_MODEL: {{ .Values.config.llmModel | quote }}
  LLM_TIMEOUT_SECONDS: {{ .Values.config.llmTimeoutSeconds | quote }}
  LLM_MAX_TOKENS: {{ .Values.config.llmMaxTokens | quote }}
  DIAGNOSIS_LLM_TIMEOUT_SECONDS: {{ .Values.config.diagnosisLLMTimeoutSeconds | quote }}
  DIAGNOSIS_ENABLED: {{ .Values.config.diagnosisEnabled | quote }}
  DIAGNOSIS_WORKER_COUNT: {{ .Values.config.diagnosisWorkerCount | quote }}
  DIAGNOSIS_KAFKA_GROUP_ID: {{ .Values.config.diagnosisKafkaGroupID | quote }}
  DIAGNOSIS_TASK_TTL_SECONDS: {{ .Values.config.diagnosisTaskTTLSeconds | quote }}
  DIAGNOSIS_TASK_TIMEOUT_SECONDS: {{ .Values.config.diagnosisTaskTimeoutSeconds | quote }}
  DIAGNOSIS_RETRYABLE_ERRORS: {{ .Values.config.diagnosisRetryableErrors | quote }}
  DIAGNOSIS_STATUS_PUSH_ENABLED: {{ .Values.config.diagnosisStatusPushEnabled | quote }}
  FEEDBACK_ENABLED: {{ .Values.config.feedbackEnabled | default true | quote }}
  FEEDBACK_COMMENT_MAX_LENGTH: {{ .Values.config.feedbackCommentMaxLength | default 500 | quote }}
  ACTION_APPROVAL_ENABLED: {{ .Values.config.actionApprovalEnabled | quote }}
  ACTION_EXECUTION_ENABLED: {{ .Values.config.actionExecutionEnabled | quote }}
  ACTION_MAX_REPLICAS: {{ .Values.config.actionMaxReplicas | quote }}
  ACTION_PENDING_TTL_HOURS: {{ .Values.config.actionPendingTTLHours | quote }}
  ACTION_OPERATION_EVENTS_ENABLED: {{ .Values.config.actionOperationEventsEnabled | quote }}
  ACTION_STATUS_PUSH_ENABLED: {{ .Values.config.actionStatusPushEnabled | quote }}
  K8S_ENABLED: {{ .Values.k8sIntegration.enabled | quote }}
  K8S_WRITE_ENABLED: {{ .Values.k8sIntegration.writeEnabled | quote }}
  K8S_NODES_ENABLED: {{ .Values.k8sIntegration.nodesEnabled | quote }}
  K8S_IN_CLUSTER: {{ .Values.k8sIntegration.inCluster | quote }}
  K8S_KUBECONFIG: {{ .Values.k8sIntegration.kubeconfig | quote }}
  K8S_ALLOWED_NAMESPACES: {{ join "," .Values.k8sIntegration.allowedNamespaces | quote }}
  K8S_DEFAULT_NAMESPACE: {{ .Values.k8sIntegration.defaultNamespace | quote }}
  K8S_REQUEST_TIMEOUT_SECONDS: {{ .Values.k8sIntegration.requestTimeoutSeconds | quote }}
  K8S_LOG_TAIL_LINES: {{ .Values.k8sIntegration.logTailLines | quote }}
  K8S_LOG_MAX_BYTES: {{ .Values.k8sIntegration.logMaxBytes | quote }}
  K8S_EVENT_LIMIT: {{ .Values.k8sIntegration.eventLimit | quote }}
  COPILOT_SESSION_TTL_SECONDS: {{ .Values.config.copilotSessionTTLSeconds | quote }}
  COPILOT_MAX_MESSAGE_LENGTH: {{ .Values.config.copilotMaxMessageLength | quote }}
  COPILOT_MAX_SESSION_MESSAGES: {{ .Values.config.copilotMaxSessionMessages | quote }}
  COPILOT_TOOL_REGISTRY_ENABLED: {{ .Values.config.copilotToolRegistryEnabled | quote }}
  COPILOT_TOOL_DEFAULT_TIMEOUT_SECONDS: {{ .Values.config.copilotToolDefaultTimeoutSeconds | quote }}
  COPILOT_TOOL_LOG_ARGS: {{ .Values.config.copilotToolLogArgs | quote }}
  COPILOT_TOOLS_CLASSIFY_ENABLED: {{ .Values.copilot.toolsClassifyEnabled | quote }}
  COPILOT_MULTI_INTENT_ENABLED: {{ .Values.copilot.multiIntentEnabled | quote }}
  COPILOT_MULTI_INTENT_MAX: {{ .Values.copilot.multiIntentMax | quote }}
  RUNBOOK_DIR: {{ .Values.config.runbookDir | quote }}
  RUNBOOK_MAX_FILES: {{ .Values.config.runbookMaxFiles | quote }}
  RUNBOOK_MAX_FILE_BYTES: {{ .Values.config.runbookMaxFileBytes | quote }}
  RUNBOOK_SEARCH_TOP_N: {{ .Values.config.runbookSearchTopN | quote }}
  RUNBOOK_BM25_WEIGHT: {{ .Values.config.runbookBM25Weight | quote }}
  RUNBOOK_BM25_K1: {{ .Values.config.runbookBM25K1 | quote }}
  RUNBOOK_BM25_B: {{ .Values.config.runbookBM25B | quote }}
  EMBEDDING_API_URL: {{ .Values.config.embeddingApiUrl | quote }}
  EMBEDDING_MODEL: {{ .Values.config.embeddingModel | quote }}
  EMBEDDING_TIMEOUT_SECONDS: {{ .Values.config.embeddingTimeoutSeconds | quote }}
  EMBEDDING_INDEX_BUILD_TIMEOUT_SECONDS: {{ .Values.config.embeddingIndexBuildTimeoutSeconds | quote }}
  EMBEDDING_DIMS: {{ .Values.config.embeddingDims | quote }}
  RUNBOOK_RRF_K: {{ .Values.config.runbookRRFK | quote }}
  RERANKER_ENABLED: {{ .Values.config.rerankerEnabled | quote }}
  RERANKER_TOP_N: {{ .Values.config.rerankerTopN | quote }}
  RERANKER_TIMEOUT_SECONDS: {{ .Values.config.rerankerTimeoutSeconds | quote }}
  GIN_MODE: {{ .Values.config.ginMode | quote }}
  READY_TIMEOUT_SECONDS: {{ .Values.config.readyTimeoutSeconds | quote }}
  REQUEST_TIMEOUT_SECONDS: {{ .Values.config.requestTimeoutSeconds | quote }}
  HOSTS_CACHE_TTL_SECONDS: {{ .Values.config.hostsCacheTTLSeconds | quote }}
  TRACE_OTLP_ENDPOINT: {{ .Values.config.traceOtlpEndpoint | quote }}
  TRACE_SAMPLE_RATE: {{ .Values.config.traceSampleRate | quote }}
  KAFKA_BROKERS: {{ ternary .Values.config.kafkaBrokers "" .Values.kafka.enabled | quote }}
  PROBE_LISTEN_ADDR: {{ .Values.serverProbe.listenAddr | quote }}
  PROBE_METRICS_PATH: {{ .Values.serverProbe.metricsPath | quote }}
  PROBE_SCRAPE_INTERVAL: {{ .Values.serverProbe.scrapeInterval | quote }}
  MYSQL_HOST: {{ .Values.config.mysqlHost | quote }}
  MYSQL_PORT: {{ .Values.config.mysqlPort | quote }}
  MYSQL_USER: {{ .Values.config.mysqlUser | quote }}
  MYSQL_DATABASE: {{ .Values.config.mysqlDatabase | quote }}
  MYSQL_STARTUP_TIMEOUT_SECONDS: {{ .Values.config.mysqlStartupTimeoutSeconds | quote }}
  MYSQL_PING_TIMEOUT_SECONDS: {{ .Values.config.mysqlPingTimeoutSeconds | quote }}
  JWT_EXPIRE_HOURS: {{ .Values.auth.jwtExpireHours | quote }}
  AUTH_ENABLED: {{ .Values.auth.enabled | quote }}
