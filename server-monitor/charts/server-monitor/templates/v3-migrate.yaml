{{- if and .Values.v3.enabled .Values.v3.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: cloudops-migrate
  labels:
    {{- include "server-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.v3.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.v3.migrate.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.v3.migrate.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudops-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudops-migrate
          image: {{ include "server-monitor.image" .Values.v3.images.migrate | quote }}
          imagePullPolicy: {{ .Values.v3.images.migrate.pullPolicy | quote }}
          args: ["up"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: MYSQL_HOST
              value: {{ index .Values.v3.commonEnv "MYSQL_HOST" | quote }}
            - name: MYSQL_PORT
              value: {{ index .Values.v3.commonEnv "MYSQL_PORT" | quote }}
            - name: MYSQL_USER
              value: {{ index .Values.v3.commonEnv "MYSQL_USER" | quote }}
            - name: MYSQL_DATABASE
              value: {{ index .Values.v3.commonEnv "MYSQL_DATABASE" | quote }}
            - name: MYSQL_PING_TIMEOUT_SECONDS
              value: {{ index .Values.v3.commonEnv "MYSQL_PING_TIMEOUT_SECONDS" | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.v3.database.secretName | quote }}
                  key: {{ .Values.v3.database.passwordKey | quote }}
{{- end }}
