{{- if .Values.v3.enabled }}
{{- if not (has .Values.v3.profile (list "phase3" "phase4" "phase5" "phase6")) }}
{{- fail "v3.profile must be one of phase3, phase4, phase5, or phase6" }}
{{- end }}
{{- if or .Values.serverWeb.enabled .Values.redis.enabled .Values.mysql.enabled .Values.prometheus.enabled .Values.victoriametrics.enabled .Values.alertmanager.enabled .Values.grafana.enabled .Values.jaeger.enabled .Values.kafka.enabled .Values.elasticsearch.enabled .Values.kibana.enabled .Values.fluentBit.enabled .Values.ingress.enabled }}
{{- fail "v3 profile cannot render legacy application or platform resources; use the checked values-v3 profile and platform bootstrap" }}
{{- end }}
{{- if .Values.secret.create }}
{{- fail "v3 profile requires pre-existing Secret references; secret values must not be rendered from Helm values" }}
{{- end }}
{{- if and (has .Values.v3.profile (list "phase3" "phase4" "phase5")) .Values.v3.worker.enabled }}
{{- fail "cloudops-worker is disabled before the complete phase6 operation registry is available" }}
{{- end }}
{{- if not .Values.v3.api.enabled }}
{{- fail "v3 profile requires the cloudops-api internal listener" }}
{{- end }}
{{- end }}
