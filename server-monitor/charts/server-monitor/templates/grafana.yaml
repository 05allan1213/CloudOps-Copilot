{{- if .Values.grafana.enabled }}
# ============================================
# Grafana 部署配置
# ============================================
# 可视化仪表盘：展示 Prometheus 指标
# ============================================

# ------------------------------------------
# 1. DataSource Provisioning
# ------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    {{- include "server-monitor.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        jsonData:
          timeInterval: "15s"
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://victoriametrics:8428
        jsonData:
          timeInterval: "15s"
        editable: true
      - name: Elasticsearch
        uid: elasticsearch
        type: elasticsearch
        access: proxy
        url: http://elasticsearch:9200
        database: sm-logs-*
        jsonData:
          timeField: "@timestamp"
          esVersion: "8.13.0"
          logMessageField: msg
          logLevelField: level
          dataLinks:
            - datasourceUid: jaeger
              field: trace_id
              url: "$${__value.raw}"
        editable: true
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        jsonData:
          tracesToMetrics:
            datasourceUid: prometheus
        editable: true

---
# ------------------------------------------
# 2. Dashboard Provider Provisioning
# ------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  labels:
    {{- include "server-monitor.labels" . | nindent 4 }}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: server-monitor
        orgId: 1
        folder: Server Monitor
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards

---
# ------------------------------------------
# 3. Dashboard JSON
# ------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    {{- include "server-monitor.labels" . | nindent 4 }}
data:
  alert-overview.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {"datasource": "Prometheus", "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0}, "id": 1, "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "count(ALERTS{alertstate=\"firing\"})", "refId": "A"}], "title": "Active Alerts", "type": "stat"},
        {"datasource": "Prometheus", "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0}, "id": 2, "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "count(ALERTS{alertstate=\"firing\",severity=\"critical\"})", "refId": "A"}], "title": "Critical Alerts", "type": "stat"},
        {"datasource": "Prometheus", "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0}, "id": 3, "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "count(ALERTS{alertstate=\"firing\",severity=\"warning\"})", "refId": "A"}], "title": "Warning Alerts", "type": "stat"},
        {"datasource": "Prometheus", "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0}, "id": 4, "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "count(ALERTS{alertstate=\"firing\",severity=\"info\"})", "refId": "A"}], "title": "Info Alerts", "type": "stat"},
        {"datasource": "Prometheus", "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4}, "id": 5, "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "none"}}, "targets": [{"expr": "count by (alertname, severity) (ALERTS{alertstate=\"firing\"})", "legendFormat": "{{ "{{" }}severity{{ "}}" }} {{ "{{" }}alertname{{ "}}" }}", "refId": "A"}], "title": "Active Alerts by Rule", "type": "timeseries"},
        {"datasource": "Prometheus", "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4}, "id": 6, "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "none"}}, "targets": [{"expr": "count by (instance) (ALERTS{alertstate=\"firing\"})", "legendFormat": "{{ "{{" }}instance{{ "}}" }}", "refId": "A"}], "title": "Active Alerts by Instance", "type": "timeseries"},
        {"datasource": "Prometheus", "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 8, "w": 24, "x": 0, "y": 12}, "id": 7, "options": {"showHeader": true}, "targets": [{"expr": "ALERTS{alertstate=\"firing\"}", "format": "table", "instant": true, "refId": "A"}], "title": "Current Firing Alerts", "type": "table"}
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["server-monitor", "alerts"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "",
      "title": "Alert Overview",
      "uid": "server-monitor-alerts",
      "version": 1,
      "weekStart": ""
    }
---
# ------------------------------------------
# 4. Grafana 数据卷（PersistentVolumeClaim）
# ------------------------------------------
{{ if .Values.grafana.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  labels:
    {{- include "server-monitor.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.grafana.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.grafana.persistence.size | quote }}
  {{ if .Values.grafana.persistence.storageClassName }}
  storageClassName: {{ .Values.grafana.persistence.storageClassName | quote }}
  {{ end }}

---
{{ end }}
# ------------------------------------------
# 5. Deployment - 部署控制器
# ------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    {{- include "server-monitor.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      {{- with .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: grafana
          image: {{ .Values.grafana.image | quote }}
          {{- with .Values.global.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name | quote }}
                  key: GRAFANA_ADMIN_USER
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name | quote }}
                  key: GRAFANA_ADMIN_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: data
          {{ if .Values.grafana.persistence.enabled }}
          persistentVolumeClaim:
            claimName: grafana-data
          {{ else }}
          emptyDir: {}
          {{ end }}
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-providers
          configMap:
            name: grafana-dashboard-providers
        - name: dashboards
          configMap:
            name: grafana-dashboards

---
# ------------------------------------------
# 6. Service - 服务发现
# ------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    {{- include "server-monitor.labels" . | nindent 4 }}
spec:
  selector:
    app: grafana
  ports:
    - port: {{ .Values.grafana.service.port }}
      targetPort: 3000
      {{- if eq .Values.grafana.service.type "NodePort" }}
      nodePort: {{ .Values.grafana.service.nodePort }}
      {{- end }}
  type: {{ .Values.grafana.service.type }}
{{- end }}
