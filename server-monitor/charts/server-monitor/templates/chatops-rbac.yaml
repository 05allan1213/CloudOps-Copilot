{{- if and .Values.serverWeb.enabled .Values.k8sIntegration.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudops-copilot
  labels:
    {{- include "server-monitor.labels" . | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudops-copilot-readonly
  labels:
    {{- include "server-monitor.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudops-copilot-deployment-writer
  labels:
    {{- include "server-monitor.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudops-copilot-readonly
  labels:
    {{- include "server-monitor.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: cloudops-copilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudops-copilot-readonly

{{- if .Values.k8sIntegration.rbac.bindWriteRole }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudops-copilot-deployment-writer
  labels:
    {{- include "server-monitor.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: cloudops-copilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudops-copilot-deployment-writer
{{- end }}
{{- if .Values.k8sIntegration.rbac.bindNodeRole }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-cloudops-copilot-node-reader
  labels:
    {{- include "server-monitor.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-cloudops-copilot-node-reader
  labels:
    {{- include "server-monitor.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: cloudops-copilot
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-cloudops-copilot-node-reader
{{- end }}
{{- end }}
