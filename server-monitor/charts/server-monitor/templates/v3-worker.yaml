{{- if and .Values.v3.enabled .Values.v3.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-worker
  labels:
    {{- include "server-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.v3.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudops-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudops-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
        cloudops.io/monitoring: enabled
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/v3-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: cloudops-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudops-worker
          image: {{ include "server-monitor.image" .Values.v3.images.worker | quote }}
          imagePullPolicy: {{ .Values.v3.images.worker.pullPolicy | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: cloudops-v3-config
          env:
            {{- range $name, $value := .Values.v3.worker.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.v3.database.secretName | quote }}
                  key: {{ .Values.v3.database.passwordKey | quote }}
          ports:
            - name: management
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: management
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: management
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: management
            periodSeconds: 10
          resources:
            {{- toYaml .Values.v3.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cloudops-worker-management
  labels:
    {{- include "server-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-management
    cloudops.io/monitoring: enabled
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudops-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: management
      port: 8081
      targetPort: management
      protocol: TCP
{{- end }}
