image:
  repository: cloudops-demo
  tag: dev
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 2
clusterName: kind-cloudops-v3-phase3
environment: local-demo
requiredEnv: baseline-present
sourceRevision: unknown

trace:
  otlpEndpoint: ""
  sampleRate: "1"

monitoring:
  interval: 15s
  scrapeTimeout: 5s
  readinessAlertFor: 30s
  errorAlertFor: 30s
  errorRateThreshold: 0.20

loadGenerator:
  enabled: true
  ratePerSecond: 5
  requestTimeoutSeconds: 2
  maxDurationSeconds: 1740

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

loadGeneratorResources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi
