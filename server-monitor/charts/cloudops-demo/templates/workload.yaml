apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-demo-workload
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cloudops-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: workload
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "cloudops-demo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloudops-demo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: workload
        cloudops.io/monitoring: enabled
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "cloudops-demo.selectorLabels" . | nindent 20 }}
      containers:
        - name: cloudops-demo
          image: {{ include "cloudops-demo.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: REQUIRED_ENV
              value: {{ .Values.requiredEnv | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.sourceRevision | quote }}
            - name: SOURCE_REVISION
              value: {{ .Values.sourceRevision | quote }}
            - name: DEPLOYMENT_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: K8S_CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: TRACE_OTLP_ENDPOINT
              value: {{ .Values.trace.otlpEndpoint | quote }}
            - name: TRACE_SAMPLE_RATE
              value: {{ .Values.trace.sampleRate | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: cloudops-demo-workload
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cloudops-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: normal-service
spec:
  type: ClusterIP
  selector:
    {{- include "cloudops-demo.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: demo-diagnostics
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cloudops-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: diagnostics-service
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    {{- include "cloudops-demo.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
