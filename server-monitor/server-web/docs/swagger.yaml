definitions:
  action.ActionResult:
    properties:
      action_type:
        type: string
      message:
        type: string
      new_annotation:
        type: string
      new_replicas:
        type: integer
      old_annotation:
        type: string
      old_replicas:
        type: integer
      ready_replicas:
        type: integer
      replicas:
        type: integer
      target:
        type: string
    type: object
  action.ApproveRequest:
    properties:
      comment:
        type: string
    type: object
  action.CreateActionRequestDoc:
    properties:
      action_type:
        type: string
      diagnosis_report_id:
        type: integer
      namespace:
        type: string
      params:
        additionalProperties: true
        type: object
      risk_level:
        type: string
      target_kind:
        type: string
      target_name:
        type: string
    type: object
  action.CreateFromDiagnosisRequest:
    properties:
      selected_action_types:
        items:
          type: string
        type: array
      source:
        type: string
    type: object
  action.ExecuteRequest:
    properties:
      confirm:
        type: boolean
    type: object
  action.RejectRequest:
    properties:
      reason:
        type: string
    type: object
  action.actionDoc:
    properties:
      action_type:
        type: string
      approved_at:
        type: string
      approved_by:
        type: integer
      created_at:
        type: string
      diagnosis_report_id:
        type: integer
      error_message:
        type: string
      executed_at:
        type: string
      executed_by:
        type: integer
      id:
        type: integer
      namespace:
        type: string
      params: {}
      requested_by:
        type: string
      result:
        $ref: '#/definitions/action.ActionResult'
      risk_level:
        type: string
      status:
        type: string
      target_kind:
        type: string
      target_name:
        type: string
      updated_at:
        type: string
    type: object
  action.actionResponseEnvelope:
    properties:
      data:
        $ref: '#/definitions/action.actionDoc'
      error:
        type: string
      status:
        type: string
    type: object
  action.auditListResponseEnvelope:
    properties:
      data:
        $ref: '#/definitions/action.auditListResult'
      error:
        type: string
      status:
        type: string
    type: object
  action.auditListResult:
    properties:
      items:
        items:
          $ref: '#/definitions/action.auditLogDoc'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  action.auditLogDoc:
    properties:
      action:
        type: string
      actor:
        type: string
      actor_role:
        type: string
      created_at:
        type: string
      error_message:
        type: string
      id:
        type: integer
      request: {}
      resource_id:
        type: string
      resource_type:
        type: string
      result:
        type: string
      trace_id:
        type: string
    type: object
  handler.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  handler.toolParamDoc:
    properties:
      default: {}
      description:
        type: string
      enum:
        items:
          type: string
        type: array
      max:
        type: number
      min:
        type: number
      name:
        type: string
      pattern:
        type: string
      required:
        type: boolean
      type:
        type: string
    type: object
  handler.toolSchemaDoc:
    properties:
      description:
        type: string
      name:
        type: string
      parameters:
        items:
          $ref: '#/definitions/handler.toolParamDoc'
        type: array
      read_only:
        type: boolean
      risk_level:
        type: string
      timeout:
        type: string
    type: object
  handler.toolSchemasResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handler.toolSchemaDoc'
        type: array
      error:
        type: string
      status:
        type: string
    type: object
  server-web_internal_copilot_handler.response:
    properties:
      data: {}
      error:
        type: string
      status:
        type: string
    type: object
  server-web_internal_handler.response:
    properties:
      data: {}
      error:
        type: string
      status:
        type: string
    type: object
  webhook.AlertRecord:
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      endsAt:
        type: string
      fingerprint:
        type: string
      generatorURL:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      startsAt:
        type: string
      status:
        type: string
    type: object
  webhook.AlertmanagerWebhookRequest:
    properties:
      alerts:
        items:
          $ref: '#/definitions/webhook.AlertRecord'
        type: array
      commonAnnotations:
        additionalProperties:
          type: string
        type: object
      commonLabels:
        additionalProperties:
          type: string
        type: object
      externalURL:
        type: string
      groupLabels:
        additionalProperties:
          type: string
        type: object
      receiver:
        type: string
      status:
        type: string
    type: object
info:
  contact: {}
paths:
  /actions:
    get:
      description: 按状态、风险等级、动作类型查询 PendingAction
      parameters:
      - description: 状态
        in: query
        name: status
        type: string
      - description: 风险等级
        in: query
        name: risk_level
        type: string
      - description: 动作类型
        in: query
        name: action_type
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取动作列表
      tags:
      - actions
    post:
      consumes:
      - application/json
      description: 由 admin 直接创建 pending K8s 动作，不会执行真实动作；仍需 approve 后 execute。
      parameters:
      - description: 动作创建请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/action.CreateActionRequestDoc'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/action.actionResponseEnvelope'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 直接创建待审批动作
      tags:
      - actions
  /actions/{id}:
    get:
      description: 查询单个 PendingAction 的参数、状态、审批和执行结果
      parameters:
      - description: 动作 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取动作详情
      tags:
      - actions
  /actions/{id}/approve:
    post:
      consumes:
      - application/json
      description: 将 pending 动作审批为 approved，只有 admin 可调用
      parameters:
      - description: 动作 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 审批备注
        in: body
        name: body
        schema:
          $ref: '#/definitions/action.ApproveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 审批通过动作
      tags:
      - actions
  /actions/{id}/execute:
    post:
      consumes:
      - application/json
      description: 执行 approved 动作；K8s restart/scale 只有在 ACTION_EXECUTION_ENABLED 和
        K8S_WRITE_ENABLED 同时开启时使用真实执行器，结果包含 target、old/new replicas、ready replicas
        和 restart annotation 摘要。
      parameters:
      - description: 动作 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 执行确认
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/action.ExecuteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/action.actionResponseEnvelope'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 执行动作
      tags:
      - actions
  /actions/{id}/reject:
    post:
      consumes:
      - application/json
      description: 将 pending 动作拒绝为 rejected，拒绝原因必填
      parameters:
      - description: 动作 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 拒绝原因
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/action.RejectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 拒绝动作
      tags:
      - actions
  /actions/pending:
    get:
      description: 查询 pending 状态的动作审批项
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取待审批动作列表
      tags:
      - actions
  /alerts/active:
    get:
      description: 从 Redis 获取当前活跃的告警列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
      security:
      - BearerAuth: []
      summary: 获取活跃告警列表
      tags:
      - alerts
  /alerts/events:
    get:
      description: 查询告警事件历史，支持按状态和严重程度过滤
      parameters:
      - description: 状态过滤 (firing/resolved)
        in: query
        name: status
        type: string
      - description: 严重程度过滤 (critical/warning/info)
        in: query
        name: severity
        type: string
      - description: 搜索关键词
        in: query
        name: search
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
      security:
      - BearerAuth: []
      summary: 获取告警事件列表
      tags:
      - alerts
  /audit-logs:
    get:
      description: 查询动作审批、拒绝、执行、失败和权限拒绝审计日志；action/action_type 支持 action.execute 等审计动作，也支持
        k8s.restart_deployment、k8s.scale_deployment 过滤 K8s 动作类型。
      parameters:
      - description: 审计动作或 K8s 动作类型
        in: query
        name: action
        type: string
      - description: 审计动作或 K8s 动作类型
        in: query
        name: action_type
        type: string
      - description: 结果
        in: query
        name: result
        type: string
      - description: 操作者
        in: query
        name: actor
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/action.auditListResponseEnvelope'
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取审计日志列表
      tags:
      - audit
  /audit-logs/{id}:
    get:
      description: 查询单条审计日志详情
      parameters:
      - description: 审计日志 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取审计日志详情
      tags:
      - audit
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码登录，返回 JWT 令牌
      parameters:
      - description: 登录请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
      summary: 用户登录
      tags:
      - auth
  /auth/me:
    get:
      description: 根据 Bearer Token 获取当前登录用户信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
      security:
      - BearerAuth: []
      summary: 获取当前用户信息
      tags:
      - auth
  /copilot/tools:
    get:
      description: 返回当前启用的只读工具；K8s 开启后包含 k8s.get_pods、k8s.get_deployments、k8s.get_services、k8s.get_nodes、k8s.get_events、k8s.get_logs。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.toolSchemasResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/server-web_internal_copilot_handler.response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server-web_internal_copilot_handler.response'
      security:
      - BearerAuth: []
      summary: 获取 Copilot 工具 Schema
      tags:
      - copilot
  /diagnosis/{id}/actions:
    post:
      consumes:
      - application/json
      description: 根据诊断报告 recommended_actions 创建 PendingAction，只有 admin 可调用，不会执行真实动作
      parameters:
      - description: 诊断报告 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 创建请求
        in: body
        name: body
        schema:
          $ref: '#/definitions/action.CreateFromDiagnosisRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 从诊断报告生成待审批动作
      tags:
      - actions
  /hosts:
    get:
      description: 查询 Prometheus 获取所有监控主机列表
      parameters:
      - description: 主机组名称过滤
        in: query
        name: group
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
      security:
      - BearerAuth: []
      summary: 获取主机列表
      tags:
      - hosts
  /k8s/overview:
    get:
      description: 获取 K8s 集群概览，包含 Node/Pod/Deployment/Event 统计。需要 K8S_ENABLED=true 且 K8S_API_ENABLED=true
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
        "503":
          description: Service Unavailable (K8s not enabled)
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
      security:
      - BearerAuth: []
      summary: K8s 集群概览
      tags:
      - k8s
  /k8s/nodes:
    get:
      description: 获取 K8s Node 列表。需要 K8S_ENABLED=true、K8S_API_ENABLED=true、K8S_NODES_ENABLED=true
      parameters:
      - description: 状态过滤 (ready/notready)
        in: query
        name: status
        type: string
      - description: 角色过滤 (control-plane/worker)
        in: query
        name: role
        type: string
      - description: 搜索关键词
        in: query
        name: search
        type: string
      - description: 命名空间过滤
        in: query
        name: namespace
        type: string
      - description: 每页数量
        in: query
        name: limit
        type: integer
      - description: 页码
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
        "503":
          description: Service Unavailable (Nodes not enabled)
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
      security:
      - BearerAuth: []
      summary: 获取 Node 列表（需要 K8S_NODES_ENABLED=true）
      tags:
      - k8s
  /k8s/nodes/by-instance/{instance}:
    get:
      description: 通过 Prometheus instance 标签查找 K8s Node。需要 K8S_NODES_ENABLED=true
      parameters:
      - description: Prometheus instance 标签值
        in: path
        name: instance
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
      security:
      - BearerAuth: []
      summary: 通过 instance 查找 Node
      tags:
      - k8s
  /k8s/nodes/{name}:
    get:
      description: 获取 K8s Node 详情，包含运行中 Pod 和相关 Event。需要 K8S_NODES_ENABLED=true
      parameters:
      - description: Node 名称
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server-web_internal_handler.response'
        "400":
