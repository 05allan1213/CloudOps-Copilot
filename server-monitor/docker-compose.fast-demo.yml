services:
  mysql:
    ports: !override
      - "127.0.0.1:${DEMO_MYSQL_HOST_PORT:-33307}:3306"
  server-web:
    image: cloudops-demo/server-web:${FAST_DEMO_IMAGE_TAG:-v2-demo}
    environment:
      APP_ENV: local-demo
      FAST_DEMO_CONFIRM_DISPOSABLE: "true"
      AUTH_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"
      INCIDENT_AGENT_ENABLED: "true"
      INCIDENT_AGENT_WORKER_ID: fast-demo-agent-worker
      FAST_DEMO_ENABLED: "true"
      FAST_DEMO_REVISION: ${FAST_DEMO_REVISION}
      FAST_DEMO_CLUSTER: kind-cloudops-demo
      FAST_DEMO_NAMESPACE: cloudops-demo
      FAST_DEMO_WORKLOAD: cloudops-demo-workload
      FAST_DEMO_RECOVERY_REPLICAS: "2"
      FAST_DEMO_MAX_REPLICAS: "10"
      K8S_ENABLED: "true"
      K8S_WRITE_ENABLED: "true"
      K8S_IN_CLUSTER: "false"
      K8S_KUBECONFIG: /opt/server-monitor/docker/kubeconfig
      K8S_ALLOWED_NAMESPACES: cloudops-demo
      K8S_DEFAULT_NAMESPACE: cloudops-demo
      K8S_REQUEST_TIMEOUT_SECONDS: "10"
    volumes:
      - ./docker/custom-alerts.yml:/etc/server-monitor/rules/custom-alerts.yml
      - ./runbooks:/app/runbooks:ro
      - ./docker/kubeconfig:/opt/server-monitor/docker/kubeconfig:ro
      - ${REGISTRY_CREDENTIALS_DIR:-./docker/registry-credentials}:/var/run/secrets/cloudops/registry:ro
      - ${GITHUB_WRITE_CREDENTIALS_DIR:-./docker/github-write-credentials}:/var/run/secrets/cloudops/github-write:ro
    networks:
      - default
      - kind
  prometheus:
    volumes:
      - ./docker/fast-demo/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/fast-demo/alerts.yml:/etc/prometheus/rules/fast-demo-alerts.yml:ro
    networks:
      - default
      - kind
  alertmanager:
    volumes:
      - ./docker/fast-demo/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

networks:
  kind:
    external: true
